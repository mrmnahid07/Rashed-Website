<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Messenger</title>

<!-- ================= FIREBASE ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f0f2f5;
    color:#111827;
}

/* =====================================================
   AUTH
===================================================== */

.auth{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#dbeafe,#eef2ff 45%,#f8fafc);
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:22px;
    padding:35px 28px;
    box-shadow:0 15px 50px rgba(0,0,0,.12);
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    border-radius:22px;
    margin:auto auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#1877f2,#7c3aed);
}

.auth-box h1{
    margin-bottom:7px;
}

.auth-box p{
    color:#6b7280;
    margin-bottom:25px;
}

.auth-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:12px;
    outline:none;
    font-size:15px;
}

.auth-box input:focus{
    border-color:#1877f2;
}

.auth-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#1877f2;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.auth-switch{
    margin-top:18px;
    color:#1877f2;
    cursor:pointer;
    font-weight:bold;
}

.auth-error{
    color:#dc2626;
    margin:10px 0;
    font-size:14px;
}

/* =====================================================
   APP
===================================================== */

.app{
    display:none;
    height:100vh;
    overflow:hidden;
    background:#fff;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:360px;
    height:100vh;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
    background:#fff;
}

.top{
    padding:18px;
    border-bottom:1px solid #eee;
}

.my-profile{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.my-profile img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    cursor:pointer;
}

.my-info{
    flex:1;
    cursor:pointer;
}

.my-info strong{
    display:block;
    font-size:16px;
}

.my-info span{
    color:#22c55e;
    font-size:12px;
}

.logout-btn{
    border:0;
    background:#fee2e2;
    color:#dc2626;
    padding:9px 12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.search{
    width:100%;
    padding:12px 15px;
    border:0;
    background:#f1f3f5;
    border-radius:12px;
    outline:none;
}

/* =====================================================
   TABS
===================================================== */

.sidebar-tabs{
    display:flex;
    gap:5px;
    padding:10px 12px;
    border-bottom:1px solid #eee;
}

.tab-btn{
    flex:1;
    border:0;
    background:#f1f3f5;
    padding:10px 5px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:#555;
}

.tab-btn.active{
    background:#1877f2;
    color:#fff;
}

.badge{
    background:#ef4444;
    color:#fff;
    min-width:18px;
    height:18px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    margin-left:3px;
}

/* =====================================================
   USERS
===================================================== */

.users{
    flex:1;
    overflow-y:auto;
}

.user-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    cursor:pointer;
    border-bottom:1px solid #f4f4f4;
}

.user-row:hover{
    background:#f5f7fa;
}

.user-row img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
}

.user-main{
    flex:1;
    min-width:0;
}

.user-main strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-main small{
    color:#777;
    display:block;
    margin-top:4px;
}

.status-line{
    display:flex;
    align-items:center;
    gap:5px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#9ca3af;
}

.status-dot.online{
    background:#22c55e;
}

.action-area{
    display:flex;
    gap:5px;
    flex-direction:column;
}

.small-btn{
    border:0;
    padding:7px 9px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.add-btn{
    background:#1877f2;
    color:#fff;
}

.sent-btn{
    background:#e5e7eb;
    color:#555;
}

.friend-btn{
    background:#dcfce7;
    color:#15803d;
}

.accept-btn{
    background:#22c55e;
    color:#fff;
}

.reject-btn{
    background:#fee2e2;
    color:#dc2626;
}

.chat-btn{
    background:#1877f2;
    color:#fff;
}

.empty-list{
    padding:40px 20px;
    text-align:center;
    color:#888;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:72px;
    padding:10px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #ddd;
}

.back-btn{
    display:none;
    border:0;
    background:#f1f3f5;
    border-radius:50%;
    width:38px;
    height:38px;
    cursor:pointer;
    font-size:20px;
}

.chat-header img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.chat-info{
    flex:1;
    min-width:0;
}

.chat-info strong{
    display:block;
}

.chat-info small{
    color:#777;
}

.chat-actions{
    display:flex;
    gap:8px;
}

.call-btn{
    border:0;
    width:40px;
    height:40px;
    border-radius:50%;
    background:#e8f1ff;
    cursor:pointer;
    font-size:18px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#f7f8fa;
}

.message{
    max-width:70%;
    margin-bottom:10px;
    display:flex;
    flex-direction:column;
}

.message.mine{
    margin-left:auto;
    align-items:flex-end;
}

.message.theirs{
    margin-right:auto;
}

.message-bubble{
    padding:10px 13px;
    border-radius:16px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    word-break:break-word;
}

.mine .message-bubble{
    background:#1877f2;
    color:#fff;
}

.message img,
.message video{
    max-width:280px;
    max-height:300px;
    border-radius:12px;
    display:block;
}

.message audio{
    max-width:260px;
}

.message-time{
    font-size:10px;
    color:#999;
    margin-top:3px;
}

.delete-msg{
    font-size:10px;
    color:#ef4444;
    cursor:pointer;
    margin-top:3px;
}

.composer{
    min-height:65px;
    border-top:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    background:#fff;
}

.file-btn,
.voice-btn{
    border:0;
    background:#f1f3f5;
    width:40px;
    height:40px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.message-input{
    flex:1;
    border:0;
    background:#f1f3f5;
    padding:12px 15px;
    border-radius:22px;
    outline:none;
    min-width:0;
}

.send-btn{
    border:0;
    background:#1877f2;
    color:#fff;
    height:42px;
    padding:0 18px;
    border-radius:22px;
    font-weight:bold;
    cursor:pointer;
}

.send-btn:hover{
    background:#0d65d8;
}

#fileInput{
    display:none;
}

.typing{
    height:20px;
    padding-left:20px;
    font-size:12px;
    color:#777;
}

/* =====================================================
   PROFILE MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:20px;
    padding:25px;
}

.modal-box h2{
    margin-bottom:20px;
}

.profile-preview{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:0 auto 15px;
}

.modal-box input,
.modal-box textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    outline:none;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

.modal-buttons button{
    flex:1;
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.save-btn{
    background:#1877f2;
    color:#fff;
}

.close-btn{
    background:#eee;
}

/* =====================================================
   INCOMING CALL
===================================================== */

.incoming-call-box{
    text-align:center;
}

.incoming-call-box img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    margin:15px auto;
}

.call-buttons{
    display:flex;
    gap:10px;
}

.call-buttons button{
    flex:1;
    border:0;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.accept-call{
    background:#22c55e;
    color:#fff;
}

.reject-call{
    background:#ef4444;
    color:#fff;
}

/* =====================================================
   CALL SCREEN
===================================================== */

.call-screen{
    display:none;
    position:fixed;
    inset:0;
    background:#111827;
    z-index:2000;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#remoteVideo{
    width:100%;
    height:100%;
    object-fit:contain;
}

#localVideo{
    position:absolute;
    right:20px;
    top:20px;
    width:180px;
    height:130px;
    object-fit:cover;
    border-radius:15px;
    border:2px solid #fff;
}

.call-text{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:18px;
    z-index:3;
    background:rgba(0,0,0,.5);
    padding:8px 15px;
    border-radius:20px;
}

.call-controls{
    position:absolute;
    bottom:30px;
    display:flex;
    gap:15px;
    z-index:5;
}

.call-control{
    width:55px;
    height:55px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
    background:#374151;
    color:#fff;
}

.end-call-btn{
    background:#ef4444;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .app{
        position:relative;
    }

    .sidebar{
        width:100%;
        border:0;
    }

    .chat{
        position:absolute;
        inset:0;
        background:#fff;
        transform:translateX(100%);
        transition:.25s;
        z-index:20;
    }

    .app.chat-open .chat{
        transform:translateX(0);
    }

    .back-btn{
        display:block;
    }

    .message{
        max-width:85%;
    }

    .sidebar{
        height:100vh;
    }

    .top{
        padding:12px;
    }

    .chat-header{
        padding:8px 10px;
    }

    .chat-actions{
        gap:4px;
    }

    .call-btn{
        width:36px;
        height:36px;
    }

    .composer{
        padding:7px;
    }

    .send-btn{
        padding:0 14px;
    }

    .file-btn,
    .voice-btn{
        width:38px;
        height:38px;
        flex-shrink:0;
    }

    .message-input{
        min-width:0;
    }

    #localVideo{
        width:120px;
        height:90px;
        right:10px;
        top:60px;
    }

    .user-row{
        padding:11px 10px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN / REGISTER
===================================================== -->

<div class="auth" id="auth">

    <div class="auth-box">

        <div class="logo">M</div>

        <h1>Smart Messenger</h1>

        <p id="authSubtitle">
            Login to continue
        </p>

        <input
            id="registerName"
            type="text"
            placeholder="Your Name"
            style="display:none"
        >

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <div
            id="authError"
            class="auth-error"
        ></div>

        <button
            class="auth-btn"
            id="authButton"
            onclick="authAction()"
        >
            Login
        </button>

        <div
            class="auth-switch"
            id="authSwitch"
            onclick="toggleAuth()"
        >
            Create new account
        </div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div class="app" id="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="top">

            <div class="my-profile">

                <img
                    id="myAvatar"
                    onclick="openProfile()"
                    src=""
                >

                <div
                    class="my-info"
                    onclick="openProfile()"
                >
                    <strong id="myName">
                        Smart Messenger
                    </strong>

                    <span>
                        ● Online
                    </span>
                </div>

                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

            <input
                id="searchInput"
                class="search"
                type="text"
                placeholder="Search people..."
                oninput="searchUsers()"
            >

        </div>


        <div class="sidebar-tabs">

            <button
                id="tabPeople"
                class="tab-btn active"
                onclick="setSocialTab('people')"
            >
                People
            </button>

            <button
                id="tabFriends"
                class="tab-btn"
                onclick="setSocialTab('friends')"
            >
                Friends
            </button>

            <button
                id="tabRequests"
                class="tab-btn"
                onclick="setSocialTab('requests')"
            >
                Requests
                <span
                    id="requestBadge"
                    class="badge"
                    style="display:none"
                >
                    0
                </span>
            </button>

        </div>


        <div
            class="users"
            id="users"
        ></div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <div class="chat-header">

            <button
                class="back-btn"
                onclick="closeChat()"
            >
                ‹
            </button>

            <img
                id="chatAvatar"
                src=""
            >

            <div class="chat-info">

                <strong id="chatName">
                    Select a friend
                </strong>

                <small id="chatStatus">
                    Add a friend to start chatting
                </small>

                <div
                    id="typingStatus"
                    class="typing"
                ></div>

            </div>

            <div class="chat-actions">

                <button
                    class="call-btn"
                    onclick="startCall(false)"
                    title="Voice Call"
                >
                    📞
                </button>

                <button
                    class="call-btn"
                    onclick="startCall(true)"
                    title="Video Call"
                >
                    🎥
                </button>

            </div>

        </div>


        <div
            class="messages"
            id="messages"
        >

            <div class="empty-list">
                Select a friend to start chatting
            </div>

        </div>


        <div
            id="typingArea"
            class="typing"
        ></div>


        <div class="composer">

            <label
                class="file-btn"
                title="Send Image / Video"
            >
                📎
                <input
                    id="fileInput"
                    type="file"
                    accept="image/*,video/*"
                    onchange="sendFile(this.files[0])"
                >
            </label>

            <button
                class="voice-btn"
                id="voiceButton"
                onclick="toggleRecording()"
                title="Voice Message"
            >
                🎤
            </button>

            <input
                id="messageInput"
                class="message-input"
                type="text"
                placeholder="Write a message..."
                oninput="typing()"
                onkeydown="handleEnter(event)"
            >

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </main>

</div>


<!-- =====================================================
     PROFILE MODAL
===================================================== -->

<div
    class="modal"
    id="profileModal"
>

    <div class="modal-box">

        <h2>My Profile</h2>

        <img
            id="profilePreview"
            class="profile-preview"
            src=""
        >

        <input
            id="profilePhoto"
            type="file"
            accept="image/*"
        >

        <input
            id="profileName"
            type="text"
            placeholder="Name"
        >

        <textarea
            id="profileAbout"
            placeholder="About"
            rows="3"
        ></textarea>

        <div class="modal-buttons">

            <button
                class="save-btn"
                onclick="saveProfile()"
            >
                Save
            </button>

            <button
                class="close-btn"
                onclick="closeProfile()"
            >
                Close
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     INCOMING CALL MODAL
===================================================== -->

<div
    class="modal"
    id="incomingCallModal"
>

    <div class="modal-box incoming-call-box">

        <h2>Incoming Call</h2>

        <img
            id="incomingCallAvatar"
            src=""
        >

        <h3 id="incomingCallName">
            Someone
        </h3>

        <p id="incomingCallType">
            is calling you...
        </p>

        <br>

        <div class="call-buttons">

            <button
                class="accept-call"
                onclick="acceptIncomingCall()"
            >
                Accept
            </button>

            <button
                class="reject-call"
                onclick="rejectIncomingCall()"
            >
                Reject
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     CALL SCREEN
===================================================== -->

<div
    class="call-screen"
    id="callScreen"
>

    <div
        class="call-text"
        id="callText"
    >
        Calling...
    </div>

    <video
        id="remoteVideo"
        autoplay
        playsinline
    ></video>

    <video
        id="localVideo"
        autoplay
        muted
        playsinline
    ></video>

    <div class="call-controls">

        <button
            class="call-control"
            onclick="toggleMic()"
            id="micButton"
        >
            🎤
        </button>

        <button
            class="call-control"
            onclick="toggleCamera()"
            id="cameraButton"
        >
            🎥
        </button>

        <button
            class="call-control end-call-btn"
            onclick="endCall()"
        >
            ☎
        </button>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDjgt2oKenX2VokbpurU8DfSYKGLq7Wfuc",

    authDomain:
        "smart-store-2e455.firebaseapp.com",

    projectId:
        "smart-store-2e455",

    storageBucket:
        "smart-store-2e455.firebasestorage.app",

    messagingSenderId:
        "498458496108",

    appId:
        "1:498458496108:web:989851f4be63cbcc7a1c49"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

const storage = firebase.storage();


/* =====================================================
   DEFAULT AVATAR
===================================================== */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 100 100">

<rect width="100"
height="100"
rx="50"
fill="#e5e7eb"/>

<circle
cx="50"
cy="37"
r="18"
fill="#94a3b8"/>

<path
d="M18 86c4-21 17-31 32-31s28 10 32 31"
fill="#94a3b8"/>

</svg>
`);


function avatarURL(url){

    return url || DEFAULT_AVATAR;

}


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let selectedUser = null;

let socialTab = "people";

let allUsers = [];

let friendIds = new Set();

let incomingRequests = new Map();

let outgoingRequests = new Map();


let unsubscribeUsers = null;

let unsubscribeFriends = null;

let unsubscribeIncoming = null;

let unsubscribeOutgoing = null;

let unsubscribeMessages = null;

let unsubscribeTyping = null;

let unsubscribeChatUser = null;

let unsubscribeCalls = null;

let unsubscribeCallDoc = null;

let candidateUnsubscribes = [];


let typingTimer = null;

let registerMode = false;


function toggleAuth(){

    registerMode = !registerMode;

    document.getElementById("registerName").style.display =
        registerMode ? "block" : "none";

    document.getElementById("authButton").textContent =
        registerMode ? "Create Account" : "Login";

    document.getElementById("authSwitch").textContent =
        registerMode
        ? "Already have an account? Login"
        : "Create new account";

    document.getElementById("authSubtitle").textContent =
        registerMode
        ? "Create your Smart Messenger account"
        : "Login to continue";

    document.getElementById("authError").textContent = "";

}


/* =====================================================
   AUTH ACTION
===================================================== */

async function authAction(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const name =
        document.getElementById("registerName").value.trim();

    const errorBox =
        document.getElementById("authError");


    errorBox.textContent = "";


    if(!email || !password){

        errorBox.textContent =
            "Email and password required.";

        return;

    }


    try{

        if(registerMode){

            if(!name){

                errorBox.textContent =
                    "Please enter your name.";

                return;

            }


            const result =
                await auth.createUserWithEmailAndPassword(
                    email,
                    password
                );


            await db
                .collection("users")
                .doc(result.user.uid)
                .set({

                    uid:result.user.uid,

                    name:name,

                    email:email,

                    about:"",

                    photoURL:"",

                    online:true,

                    lastSeen:
                        firebase.firestore.FieldValue.serverTimestamp(),

                    createdAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });


        }else{

            await auth.signInWithEmailAndPassword(
                email,
                password
            );

        }

    }catch(error){

        console.error(error);

        errorBox.textContent =
            friendlyError(error);

    }

}


/* =====================================================
   FRIENDLY FIREBASE ERROR
===================================================== */

function friendlyError(error){

    const code =
        error.code || "";

    if(code.includes("email-already-in-use"))
        return "This email is already registered.";

    if(code.includes("invalid-email"))
        return "Invalid email address.";

    if(code.includes("weak-password"))
        return "Password should be at least 6 characters.";

    if(code.includes("invalid-credential"))
        return "Wrong email or password.";

    if(code.includes("user-not-found"))
        return "Account not found.";

    if(code.includes("wrong-password"))
        return "Wrong password.";

    if(code.includes("permission-denied"))
        return "Firebase permission denied. Check Firestore rules.";

    return error.message || "Something went wrong.";

}

            .set({

                lastSeen:

===================================================== */

async function loadMyProfile(){

    if(!currentUser) return;

    try{

        const snap =
            await db
            .collection("users")
            .doc(currentUser.uid)
            .get();


        const data =
            snap.exists
            ? snap.data()
            : {};


        document.getElementById("myName").textContent =
            data.name || currentUser.email;


        document.getElementById("myAvatar").src =
            avatarURL(data.photoURL);

    }catch(error){

/* =====================================================
   LOAD USERS
===================================================== */

function loadUsers(){

    if(!currentUser) return;


    if(unsubscribeUsers){

        unsubscribeUsers();

        unsubscribeUsers = null;

    }


    unsubscribeUsers =
        db
        .collection("users")
        .onSnapshot(

            function(snapshot){

                allUsers = [];

                snapshot.forEach(function(doc){

                    if(doc.id !== currentUser.uid){

                        allUsers.push({

                            id:doc.id,

                            ...doc.data()

                        });

                    }

                });


                allUsers.sort(function(a,b){

                    return (a.name || "")
                        .localeCompare(b.name || "");

                });


                renderCurrentTab();

            },

            function(error){

                console.error(error);

                document.getElementById("users").innerHTML =
                    `<div class="empty-list">
                        Unable to load users.<br>
                        Check Firebase Firestore rules.
                    </div>`;

            }

        );

}


/* =====================================================
   FRIEND LISTENERS
===================================================== */

function startFriendListeners(){

    if(!currentUser) return;


    if(unsubscribeFriends)
        unsubscribeFriends();

    if(unsubscribeIncoming)
        unsubscribeIncoming();

    if(unsubscribeOutgoing)
        unsubscribeOutgoing();


    /* ================= FRIENDS ================= */

    unsubscribeFriends =
        db
        .collection("friends")
        .where(
            "users",
            "array-contains",
            currentUser.uid
        )
        .onSnapshot(function(snapshot){

            friendIds.clear();

            snapshot.forEach(function(doc){

                const data = doc.data();

                if(
                    Array.isArray(data.users)
                ){

                    data.users.forEach(function(uid){

                        if(uid !== currentUser.uid){

                            friendIds.add(uid);

                        }

                    });

                }

            });

            updateRequestBadge();

            renderCurrentTab();

        });


    /* ================= INCOMING ================= */

    unsubscribeIncoming =
        db
        .collection("friendRequests")
        .where(
            "toUid",
            "==",
            currentUser.uid
        )
        .onSnapshot(function(snapshot){

            incomingRequests.clear();

            snapshot.forEach(function(doc){

                const data = doc.data();

                if(data.status === "pending"){

                    incomingRequests.set(
                        data.fromUid,
                        {
                            id:doc.id,
                            ...data
                        }
                    );

                }

            });

            updateRequestBadge();

            renderCurrentTab();

        });


    /* ================= OUTGOING ================= */

    unsubscribeOutgoing =
        db
        .collection("friendRequests")
        .where(
            "fromUid",
            "==",
            currentUser.uid
        )
        .onSnapshot(function(snapshot){

            outgoingRequests.clear();

            snapshot.forEach(function(doc){

                const data = doc.data();

                if(data.status === "pending"){

                    outgoingRequests.set(
                        data.toUid,
                        {
                            id:doc.id,
                            ...data
                        }
                    );

                }

            });

            renderCurrentTab();

        });

}

/* =====================================================
   FILTER
===================================================== */

function matchesSearch(user){

    const value =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    if(!value) return true;


    return (
        (user.name || "")
            .toLowerCase()
            .includes(value)
        ||
        (user.email || "")
            .toLowerCase()
            .includes(value)
        ||
        (user.about || "")
            .toLowerCase()
            .includes(value)
    );

}


/* =====================================================
   USER ROW
===================================================== */

function createUserRow(user, mode){

    const row =
        document.createElement("div");

    row.className = "user-row";


    const img =
        document.createElement("img");

    img.src =
        avatarURL(user.photoURL);


    const main =
        document.createElement("div");

    main.className = "user-main";


    const name =
        document.createElement("strong");

    name.textContent =
        user.name || "User";


    const small =
        document.createElement("small");


    const statusLine =
        document.createElement("span");

    statusLine.className =
        "status-line";


    const dot =
        document.createElement("span");

    dot.className =
        "status-dot " +
        (user.online ? "online" : "");


    const statusText =
        document.createElement("span");


    statusText.textContent =
        user.online
        ? "Online"
        : formatLastSeen(user.lastSeen);


    statusLine.appendChild(dot);

    statusLine.appendChild(statusText);

    small.appendChild(statusLine);

    main.appendChild(name);

    main.appendChild(small);


    const actions =
        document.createElement("div");

    actions.className =
        "action-area";


    /* ================= FRIEND ================= */

    if(friendIds.has(user.id)){

        const button =
            document.createElement("button");

        button.className =
            "small-btn friend-btn";

        button.textContent =
            mode === "friends"
            ? "Chat"
            : "Friends";


        button.onclick =
            function(event){

                event.stopPropagation();

                selectUser(user);

            };


        actions.appendChild(button);


        row.onclick =
            function(){

                selectUser(user);

            };


    }


    /* ================= INCOMING ================= */

    else if(incomingRequests.has(user.id)){

        const accept =
            document.createElement("button");

        accept.className =
            "small-btn accept-btn";

        accept.textContent =
            "Accept";


        accept.onclick =
            function(event){

                event.stopPropagation();

                acceptFriendRequest(user.id);

            };


        const reject =
            document.createElement("button");

        reject.className =
            "small-btn reject-btn";

        reject.textContent =
            "Reject";


        reject.onclick =
            function(event){

                event.stopPropagation();

                rejectFriendRequest(user.id);

            };


        actions.appendChild(accept);

        actions.appendChild(reject);

    }


    /* ================= SENT ================= */

    else if(outgoingRequests.has(user.id)){

        const button =
            document.createElement("button");

        button.className =
            "small-btn sent-btn";

        button.textContent =
            "Request Sent";


        button.onclick =
            function(event){

                event.stopPropagation();

                cancelFriendRequest(user.id);

            };


        actions.appendChild(button);

    }


    /* ================= NONE ================= */

    else{

        const button =
            document.createElement("button");

        button.className =
            "small-btn add-btn";

        button.textContent =
            "Add Friend";


        button.onclick =
            function(event){

                event.stopPropagation();

                sendFriendRequest(user.id);

            };


        actions.appendChild(button);

    }


    row.appendChild(img);

    row.appendChild(main);

    row.appendChild(actions);


    return row;

}


/* =====================================================
   PEOPLE
===================================================== */

function renderPeople(){

    const box =
        document.getElementById("users");

    box.innerHTML = "";


    const list =
        allUsers.filter(function(user){

            return matchesSearch(user);

        });


    if(!list.length){

        box.innerHTML =
            `<div class="empty-list">
                No people found.
            </div>`;

        return;

    }


    list.forEach(function(user){

        box.appendChild(
            createUserRow(user,"people")
        );

    });

}


/* =====================================================
   FRIENDS
===================================================== */

function renderFriends(){

    const box =
        document.getElementById("users");

    box.innerHTML = "";


    const list =
        allUsers.filter(function(user){

            return (
                friendIds.has(user.id)
                &&
                matchesSearch(user)
            );

        });


    if(!list.length){

        box.innerHTML =
            `<div class="empty-list">
                No friends yet.<br>
                Add people from People tab.
            </div>`;

        return;

    }


    list.forEach(function(user){

        box.appendChild(
            createUserRow(user,"friends")
        );

    });

}


/* =====================================================
   REQUESTS
===================================================== */

function renderRequests(){

    const box =
        document.getElementById("users");

    box.innerHTML = "";


    let found = false;


    /* ================= INCOMING ================= */

    const incomingTitle =
        document.createElement("div");

    incomingTitle.style.padding =
        "12px 15px";

    incomingTitle.style.fontWeight =
        "bold";

    incomingTitle.textContent =
        "Friend Requests";


    box.appendChild(incomingTitle);


    allUsers.forEach(function(user){

        if(
            incomingRequests.has(user.id)
            &&
            !friendIds.has(user.id)
            &&
            matchesSearch(user)
        ){

            found = true;

            box.appendChild(
                createUserRow(user,"requests")
            );

        }

    });


    /* ================= SENT ================= */

    const sentTitle =
        document.createElement("div");

    sentTitle.style.padding =
        "12px 15px";

    sentTitle.style.fontWeight =
        "bold";

    sentTitle.textContent =
        "Sent Requests";


    box.appendChild(sentTitle);


    allUsers.forEach(function(user){

        if(
            outgoingRequests.has(user.id)
            &&
            !friendIds.has(user.id)
            &&
            matchesSearch(user)
        ){

            found = true;

            box.appendChild(
                createUserRow(user,"requests")
            );

        }

    });


    if(!found){

        box.innerHTML =
            `<div class="empty-list">
                No pending requests.
            </div>`;

    }

}

/* =====================================================
   FRIEND REQUEST ID
===================================================== */

function requestId(fromUid,toUid){

    return fromUid + "_" + toUid;

}


function pairId(a,b){

    return [a,b]
        .sort()
        .join("_");

}


/* =====================================================
   SEND FRIEND REQUEST
===================================================== */

async function sendFriendRequest(uid){

    if(!currentUser) return;

    if(uid === currentUser.uid) return;


    if(friendIds.has(uid)){

        alert("Already friends.");

        return;

    }


    if(incomingRequests.has(uid)){

        alert("This person already sent you a request. Accept it from Requests.");

        return;

    }


    if(outgoingRequests.has(uid)){

        return;

    }


    try{

        const id =
            requestId(
                currentUser.uid,
                uid
            );


        await db
            .collection("friendRequests")
            .doc(id)
            .set({

                fromUid:
                    currentUser.uid,

                toUid:
                    uid,

                status:
                    "pending",

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp(),

                updatedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


    }catch(error){

        console.error(error);

        alert(
            friendlyError(error)
        );

    }

}


/* =====================================================
   CANCEL REQUEST
===================================================== */

async function cancelFriendRequest(uid){

    if(!currentUser) return;


    try{

        await db
            .collection("friendRequests")
            .doc(
                requestId(
                    currentUser.uid,
                    uid
                )
            )
            .delete();


    }catch(error){

        console.error(error);

        alert(
            friendlyError(error)
        );

    }

}


/* =====================================================
   ACCEPT FRIEND
===================================================== */

async function acceptFriendRequest(uid){

    if(!currentUser) return;


    const requestRef =
        db
        .collection("friendRequests")
        .doc(
            requestId(
                uid,
                currentUser.uid
            )
        );


    const friendRef =
        db
        .collection("friends")
        .doc(
            pairId(
                uid,
                currentUser.uid
            )
        );


    try{

        await db.runTransaction(
            async function(transaction){

                const requestSnap =
                    await transaction.get(
                        requestRef
                    );


                if(
                    !requestSnap.exists
                    ||
                    requestSnap.data().status !== "pending"
                ){

                    throw new Error(
                        "Friend request is no longer available."
                    );

                }


                transaction.set(
                    friendRef,
                    {

                        users:[
                            uid,
                            currentUser.uid
                        ].sort(),

                        createdAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    },
                    {merge:true}
                );


                transaction.update(
                    requestRef,
                    {

                        status:"accepted",

                        updatedAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    }
                );

            }
        );


    }catch(error){

        console.error(error);

        alert(
            friendlyError(error)
        );

    }

}

}


/* =====================================================
   SELECT USER
===================================================== */

function selectUser(user){

    if(!currentUser) return;


    if(!friendIds.has(user.id)){

        alert(
            "Please add this person as a friend first."
        );

        return;

    }


    selectedUser = user;


    document
        .getElementById("app")
        .classList.add("chat-open");


    document.getElementById("chatName").textContent =
        user.name || "User";


    document.getElementById("chatAvatar").src =
        avatarURL(user.photoURL);


    listenSelectedUserStatus();

    loadMessages();

}


/* =====================================================
   USER STATUS
===================================================== */

function listenSelectedUserStatus(){

    if(unsubscribeChatUser){

        unsubscribeChatUser();

        unsubscribeChatUser = null;

    }


    if(!selectedUser) return;


    unsubscribeChatUser =
        db
        .collection("users")
        .doc(selectedUser.id)
        .onSnapshot(function(snapshot){

            if(!snapshot.exists) return;


            const data =
                snapshot.data();


            selectedUser = {
                ...selectedUser,
                ...data
            };


            document.getElementById("chatName").textContent =
                data.name || selectedUser.name || "User";


            document.getElementById("chatAvatar").src =
                avatarURL(data.photoURL);


            document.getElementById("chatStatus").textContent =
                data.online
                ? "Online"
                : formatLastSeen(data.lastSeen);

        });

}


/* =====================================================
   LAST SEEN
===================================================== */

function formatLastSeen(timestamp){

    if(!timestamp)
        return "Offline";


    try{

        const date =
            timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


        return "Last seen " +
            date.toLocaleString();

    }catch(error){

        return "Offline";

    }

}

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

    if(!currentUser || !selectedUser)
        return;


    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    const id =
        chatId(
            currentUser.uid,
            selectedUser.id
        );


    unsubscribeMessages =
        db
        .collection("chats")
        .doc(id)
        .collection("messages")
        .orderBy("createdAt","asc")
        .onSnapshot(

            function(snapshot){

                const box =
                    document.getElementById("messages");

                box.innerHTML = "";


                snapshot.forEach(function(doc){

                    renderMessage(
                        doc.id,
                        doc.data(),
                        box
                    );

                });


                box.scrollTop =
                    box.scrollHeight;

            },

            function(error){

                console.error(error);

            }

        );


    listenTyping();

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(id,data,box){

    const mine =
        data.senderId === currentUser.uid;


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (mine ? "mine" : "theirs");


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    if(data.type === "text"){

        bubble.textContent =
            data.text || "";

    }

    else if(data.type === "image"){

        const img =
            document.createElement("img");

        img.src =
            data.url;

        img.alt =
            "Image";

        bubble.appendChild(img);

    }

    else if(data.type === "video"){

        const video =
            document.createElement("video");

        video.src =
            data.url;

        video.controls = true;

        video.playsInline = true;

        bubble.appendChild(video);

    }

    else if(data.type === "audio"){

        const audio =
            document.createElement("audio");

        audio.src =
            data.url;

        audio.controls = true;

        bubble.appendChild(audio);

    }


    wrapper.appendChild(bubble);


    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(data.createdAt);


    wrapper.appendChild(time);


    if(mine){

        const del =
            document.createElement("div");

        del.className =
            "delete-msg";

        del.textContent =
            "Delete";


        del.onclick =
            function(){

                deleteMessage(id);

            };


        wrapper.appendChild(del);

    }


    box.appendChild(wrapper);

}


/* =====================================================
   MESSAGE TIME
===================================================== */

function formatMessageTime(timestamp){

    if(!timestamp)
        return "";


    try{

        const date =
            timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "";

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    if(!currentUser || !selectedUser)
        return;


    if(!friendIds.has(selectedUser.id)){

        alert("You can chat only with friends.");

        return;

async function toggleRecording(){

    if(mediaRecorder){

        mediaRecorder.stop();

        return;

    }


    if(!currentUser || !selectedUser){

        alert("Open a friend chat first.");

        return;

    }


    if(!friendIds.has(selectedUser.id)){

        alert("Add friend first.");

        return;

    }


    try{

        recordingStream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


        audioChunks = [];


        let mime =
            "audio/webm";


        if(
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ){

            mime =
                "audio/webm;codecs=opus";

        }


        mediaRecorder =
            new MediaRecorder(
                recordingStream,
                {mimeType:mime}
            );


        mediaRecorder.ondataavailable =
            function(event){

                if(event.data.size > 0){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function(){

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );


                recordingStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                mediaRecorder = null;


                document
                    .getElementById("voiceButton")
                    .textContent = "🎤";


                await sendVoice(blob);

            };


        mediaRecorder.start();


        document
            .getElementById("voiceButton")
            .textContent = "⏹";


    }catch(error){

        console.error(error);

        alert(
            "Microphone permission is required."
        );

    }

}

/* =====================================================
   START CALL
===================================================== */

async function startCall(videoCall){

    if(!currentUser || !selectedUser){

        alert("Select a friend first.");

        return;

    }


    if(!friendIds.has(selectedUser.id)){

        alert("You can call friends only.");

        return;

    }


    try{

        currentCallVideo =
            videoCall;

        currentCallPeerUid =
            selectedUser.id;


        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:true,

                video:videoCall

            });


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(function(track){

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });


        peerConnection.ontrack =
            function(event){

                document
                    .getElementById("remoteVideo")
                    .srcObject =
                    event.streams[0];

            };


        const callRef =
            db
            .collection("calls")
            .doc();


        currentCallId =
            callRef.id;


        const offerCandidates =
            callRef
            .collection("offerCandidates");


        const answerCandidates =
            callRef
            .collection("answerCandidates");


        peerConnection.onicecandidate =
            function(event){

                if(event.candidate){

                    offerCandidates.add(
                        event.candidate.toJSON()
                    );

                }

            };


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
            .setLocalDescription(offer);


        await callRef.set({

            callerId:
                currentUser.uid,

            receiverId:
                selectedUser.id,

            type:
                videoCall
                ? "video"
                : "voice",

            offer:{
                type:offer.type,
                sdp:offer.sdp
            },

            status:"calling",

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });


        showCallScreen(
            videoCall,
            "Calling " +
            (selectedUser.name || "Friend") +
            "..."
        );


        unsubscribeCallDoc =
            callRef.onSnapshot(
                async function(snapshot){

                    const data =
                        snapshot.data();


                    if(!data)
                        return;


                    if(
                        data.status === "answered"
                        &&
                        data.answer
                        &&
                        !peerConnection.currentRemoteDescription
                    ){

                        await peerConnection
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data.answer
                                )
                            );


                        await flushRemoteCandidates();

                    }


                    if(
                        data.status === "ended"
                    ){

                        endCallLocal();

                    }

                }
            );


        const unsubAnswer =
            answerCandidates.onSnapshot(
                function(snapshot){

                    snapshot.docChanges()
                    .forEach(
                        async function(change){

                            if(
                                change.type === "added"
                            ){

                                const candidate =
                                    new RTCIceCandidate(
                                        change.doc.data()
                                    );


                                if(
                                    peerConnection
                                    &&
                                    peerConnection.remoteDescription
                                ){

                                    try{

                                        await peerConnection
                                            .addIceCandidate(
                                                candidate
                                            );

                                    }catch(error){

                                        console.error(error);

                                    }

                                }else{

                                    pendingRemoteCandidates
                                        .push(candidate);

                                }

                            }

                        }
                    );

                }
            );


        candidateUnsubscribes.push(
            unsubAnswer
        );


    }catch(error){

        console.error(error);

        alert(
            "Could not start call. Check microphone/camera permission."
        );

        endCallLocal();

    }

}

    }


    unsubscribeCalls =
        db
        .collection("calls")
        .where(
            "receiverId",
            "==",
            currentUser.uid
        )
        .onSnapshot(function(snapshot){

            snapshot.docChanges()
            .forEach(function(change){

                const data =
                    change.doc.data();


                if(
                    change.type === "added"
                    &&
                    data.status === "calling"
                ){

                    if(
                        currentCallId
                        ||
                        pendingIncomingCall
                    ){

                        return;

                    }


                    pendingIncomingCall = {

                        id:change.doc.id,

                        ...data

                    };


                    showIncomingCall(
                        pendingIncomingCall
                    );

                }


                if(
                    change.type === "modified"
                    &&
                    pendingIncomingCall
                    &&
                    pendingIncomingCall.id ===
                        change.doc.id
                    &&
                    data.status !== "calling"
                ){

                    hideIncomingCall();

                }

            });

        });

}

    }


    if(unsubscribeOutgoing){

        unsubscribeOutgoing();

        unsubscribeOutgoing = null;

    }


    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    if(unsubscribeTyping){

        unsubscribeTyping();

        unsubscribeTyping = null;

    }


    if(unsubscribeChatUser){

        unsubscribeChatUser();

        unsubscribeChatUser = null;

    }


    if(unsubscribeCalls){

        unsubscribeCalls();

        unsubscribeCalls = null;

    }


    cleanupCallListeners();


    if(mediaRecorder){

        try{

            mediaRecorder.stop();

        }catch(error){}

        mediaRecorder = null;

    }


    if(recordingStream){

        recordingStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        recordingStream = null;

    }


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(error){}

        peerConnection = null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        localStream = null;

    }


    clearTimeout(typingTimer);

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    if(!currentUser)
        return;


    try{

        await updateOnline(false);

    }catch(error){

        console.error(error);

    }


    cleanupRealtimeListeners();


    selectedUser = null;


    document.getElementById(
        "messages"
    ).innerHTML =
        `<div class="empty-list">
            Select a friend to start chatting
        </div>`;


    try{

        await auth.signOut();

    }catch(error){

        console.error(error);

        alert(
            friendlyError(error)
        );

    }

}
