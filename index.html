<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Messenger</title>

<!-- ================= FIREBASE ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --blue:#0084ff;
    --blue-dark:#006fe6;
    --light:#f0f2f5;
    --border:#e4e6eb;
    --text:#050505;
    --muted:#65676b;
    --green:#31a24c;
    --danger:#e41e3f;
}

body{
    background:#eef1f5;
    color:var(--text);
    overflow:hidden;
}

/* =====================================================
   COMMON
===================================================== */

button,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
}

.hidden{
    display:none!important;
}

/* =====================================================
   LOGIN
===================================================== */

.auth{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,132,255,.25),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(0,132,255,.20),transparent 30%),
        linear-gradient(135deg,#f4f8ff,#eef4fb);
    padding:20px;
}

.auth-box{
    width:420px;
    max-width:100%;
    background:#fff;
    border-radius:22px;
    padding:34px 30px;
    box-shadow:0 18px 60px rgba(0,0,0,.14);
}

.auth-logo{
    width:72px;
    height:72px;
    margin:0 auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00a2ff,#006eff);
    color:#fff;
    font-size:40px;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,132,255,.3);
}

.auth-box h1{
    text-align:center;
    font-size:29px;
    margin-bottom:5px;
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:24px;
}

.auth-input{
    width:100%;
    height:50px;
    border:1px solid #ccd0d5;
    border-radius:12px;
    padding:0 15px;
    font-size:15px;
    outline:none;
    margin-bottom:12px;
    transition:.2s;
}

.auth-input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(0,132,255,.12);
}

.password-wrap{
    position:relative;
}

.password-wrap .auth-input{
    padding-right:50px;
}

.password-eye{
    position:absolute;
    right:10px;
    top:5px;
    width:40px;
    height:40px;
    background:transparent;
    color:#65676b;
    font-size:18px;
}

.auth-main-btn{
    width:100%;
    height:50px;
    border-radius:12px;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:700;
    transition:.2s;
}

.auth-main-btn:hover{
    background:var(--blue-dark);
}

.auth-main-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.auth-switch{
    text-align:center;
    margin-top:18px;
    color:var(--blue);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.auth-switch:hover{
    text-decoration:underline;
}

.auth-error{
    min-height:20px;
    color:#e41e3f;
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.auth-loading{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:10px;
}

/* =====================================================
   MAIN APP
===================================================== */

.app{
    width:100%;
    height:100vh;
    display:flex;
    background:#fff;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:350px;
    min-width:350px;
    height:100vh;
    border-right:1px solid var(--border);
    background:#fff;
    display:flex;
    flex-direction:column;
}

.sidebar-top{
    padding:18px 15px 12px;
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#00a2ff,#006eff);
    color:#fff;
    font-size:22px;
    font-weight:900;
}

.brand-title{
    font-size:21px;
    font-weight:800;
}

.top-actions{
    display:flex;
    gap:6px;
}

.circle-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    color:#050505;
    transition:.2s;
}

.circle-btn:hover{
    background:#e4e6eb;
}

.my-profile{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.my-profile .profile-info{
    flex:1;
    min-width:0;
}

.profile-info strong{
    display:block;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-online{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--green);
    margin-top:3px;
}

.online-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    display:inline-block;
}

.search-box{
    position:relative;
}

.search-box span{
    position:absolute;
    left:14px;
    top:12px;
    color:#65676b;
    font-size:16px;
}

.search-box input{
    width:100%;
    height:44px;
    border:0;
    outline:0;
    border-radius:22px;
    background:#f0f2f5;
    padding:0 15px 0 40px;
    font-size:14px;
}

.user-list{
    flex:1;
    overflow-y:auto;
    padding:5px 8px 15px;
}

.user-list::-webkit-scrollbar,
.messages::-webkit-scrollbar{
    width:7px;
}

.user-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{
    background:#c8ccd1;
    border-radius:10px;
}

.user-card{
    width:100%;
    border-radius:12px;
    padding:9px;
    display:flex;
    align-items:center;
    gap:11px;
    background:#fff;
    cursor:pointer;
    text-align:left;
    margin-bottom:2px;
    transition:.15s;
}

.user-card:hover{
    background:#f2f3f5;
}

.user-card.active{
    background:#e7f3ff;
}

.user-card-avatar-wrap{
    position:relative;
}

.user-card-avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    object-fit:cover;
}

.user-card-status{
    position:absolute;
    right:1px;
    bottom:1px;
    width:13px;
    height:13px;
    background:var(--green);
    border:2px solid #fff;
    border-radius:50%;
}

.user-card-info{
    flex:1;
    min-width:0;
}

.user-card-name{
    display:block;
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-card-last{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.no-users{
    text-align:center;
    color:#65676b;
    padding:35px 15px;
    font-size:14px;
}

/* =====================================================
   CHAT AREA
===================================================== */

.chat{
    flex:1;
    min-width:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#fff;
}

.chat-header{
    height:74px;
    min-height:74px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:10px 18px;
    gap:11px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
    z-index:3;
}

.mobile-back{
    display:none;
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f0f2f5;
    font-size:22px;
}

.chat-avatar-wrap{
    position:relative;
}

.chat-header .avatar{
    width:46px;
    height:46px;
}

.chat-header .header-online-dot{
    position:absolute;
    right:0;
    bottom:0;
    width:12px;
    height:12px;
    border:2px solid white;
    border-radius:50%;
    background:var(--green);
}

.chat-user{
    flex:1;
    min-width:0;
}

.chat-user strong{
    display:block;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-status{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
}

.typing-status{
    color:var(--blue);
    font-size:12px;
    font-weight:600;
    margin-top:3px;
    display:none;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.header-call-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#e7f3ff;
    color:var(--blue);
    font-size:18px;
}

.header-call-btn:hover{
    background:#d5eaff;
}

/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1;
    overflow-y:auto;
    padding:22px 24px;
    background:#fff;
    display:flex;
    flex-direction:column;
}

.empty-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#65676b;
    text-align:center;
}

.empty-chat-logo{
    width:78px;
    height:78px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7f3ff;
    color:var(--blue);
    font-size:36px;
    margin-bottom:14px;
}

.empty-chat strong{
    color:#050505;
    font-size:17px;
    margin-bottom:5px;
}

.message-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
    margin-bottom:3px;
    max-width:80%;
}

.message-row.mine{
    margin-left:auto;
    flex-direction:row-reverse;
}

.message-mini-avatar{
    width:28px;
    height:28px;
    min-width:28px;
    border-radius:50%;
    object-fit:cover;
}

.message-content{
    position:relative;
    max-width:100%;
}

.message-bubble{
    padding:9px 13px;
    border-radius:18px;
    background:#e4e6eb;
    color:#050505;
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
    white-space:pre-wrap;
}

.message-row.mine .message-bubble{
    background:var(--blue);
    color:#fff;
    border-bottom-right-radius:5px;
}

.message-row:not(.mine) .message-bubble{
    border-bottom-left-radius:5px;
}

.message-media{
    max-width:300px;
    max-height:330px;
    border-radius:15px;
    display:block;
    object-fit:cover;
    cursor:pointer;
    background:#eee;
}

.message-row.mine .message-media{
    border-bottom-right-radius:5px;
}

.message-audio{
    width:260px;
    max-width:100%;
    height:40px;
}

.message-time{
    font-size:10px;
    color:#8a8d91;
    margin:3px 9px 6px;
}

.message-row.mine .message-time{
    text-align:right;
}

.delete-message{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    right:-36px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#f0f2f5;
    color:#65676b;
    display:none;
    font-size:13px;
}

.message-row:hover .delete-message{
    display:block;
}

.message-day{
    text-align:center;
    color:#8a8d91;
    font-size:11px;
    margin:12px 0;
}

/* =====================================================
   COMPOSER
===================================================== */

.composer{
    min-height:70px;
    border-top:1px solid var(--border);
    padding:11px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
}

.composer-input-wrap{
    flex:1;
    position:relative;
}

.composer input{
    width:100%;
    height:46px;
    border:0;
    outline:0;
    border-radius:23px;
    background:#f0f2f5;
    padding:0 16px;
    font-size:14px;
}

.composer-btn{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:50%;
    background:transparent;
    color:var(--blue);
    font-size:19px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.composer-btn:hover{
    background:#f0f2f5;
}

.composer-btn.file{
    position:relative;
    overflow:hidden;
}

.composer-btn.send{
    background:var(--blue);
    color:#fff;
}

.composer-btn.send:hover{
    background:var(--blue-dark);
}

.recording{
    background:#ffe7ed!important;
    color:#e41e3f!important;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.08)}
}

/* =====================================================
   PROFILE MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:430px;
    max-width:100%;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    padding:25px;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.modal-box h2{
    text-align:center;
    margin-bottom:20px;
}

.profile-photo-wrap{
    position:relative;
    width:100px;
    height:100px;
    margin:0 auto 20px;
}

.profile-photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

.profile-photo-label{
    position:absolute;
    right:0;
    bottom:0;
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--blue);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border:3px solid #fff;
}

.modal-input{
    width:100%;
    height:46px;
    border:1px solid #ccd0d5;
    border-radius:10px;
    outline:none;
    padding:0 13px;
    margin-bottom:11px;
}

.modal-input:focus{
    border-color:var(--blue);
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.modal-btn{
    flex:1;
    height:44px;
    border-radius:10px;
    background:var(--blue);
    color:#fff;
    font-weight:700;
}

.modal-btn.close{
    background:#e4e6eb;
    color:#050505;
}

/* =====================================================
   INCOMING CALL
===================================================== */

.incoming-call{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:300;
    padding:20px;
}

.incoming-call.show{
    display:flex;
}

.incoming-box{
    width:350px;
    max-width:100%;
    background:#fff;
    border-radius:22px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 20px 80px rgba(0,0,0,.35);
}

.incoming-box img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}

.incoming-box h2{
    font-size:21px;
    margin-bottom:7px;
}

.incoming-box p{
    color:#65676b;
    margin-bottom:25px;
}

.incoming-actions{
    display:flex;
    justify-content:center;
    gap:25px;
}

.incoming-action{
    width:58px;
    height:58px;
    border-radius:50%;
    color:#fff;
    font-size:23px;
}

.incoming-action.accept{
    background:#31a24c;
}

.incoming-action.reject{
    background:#e41e3f;
}

/* =====================================================
   CALL SCREEN
===================================================== */

.call-screen{
    position:fixed;
    inset:0;
    background:#111;
    display:none;
    z-index:400;
    overflow:hidden;
}

.call-screen.show{
    display:block;
}

#remoteVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.local-video{
    position:absolute;
    top:20px;
    right:20px;
    width:180px;
    height:240px;
    object-fit:cover;
    border-radius:14px;
    background:#222;
    border:2px solid rgba(255,255,255,.6);
    box-shadow:0 8px 30px rgba(0,0,0,.5);
}

.call-info{
    position:absolute;
    top:25px;
    left:25px;
    color:#fff;
    z-index:2;
}

.call-info h2{
    font-size:20px;
}

.call-info p{
    margin-top:5px;
    color:#ddd;
    font-size:13px;
}

.call-controls{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:15px;
}

.call-control{
    width:54px;
    height:54px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:20px;
    backdrop-filter:blur(8px);
}

.call-control:hover{
    background:rgba(255,255,255,.28);
}

.call-control.end{
    background:#e41e3f;
}

.call-control.end:hover{
    background:#c91836;
}

.call-message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:18px;
    text-align:center;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    background:#050505;
    color:#fff;
    padding:11px 18px;
    border-radius:22px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:750px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat{
        position:fixed;
        inset:0;
        width:100%;
        transform:translateX(100%);
        transition:.25s ease;
        z-index:20;
    }

    .app.chat-open .chat{
        transform:translateX(0);
    }

    .app.chat-open .sidebar{
        display:none;
    }

    .mobile-back{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .messages{
        padding:16px 12px;
    }

    .message-row{
        max-width:88%;
    }

    .message-media{
        max-width:245px;
        max-height:280px;
    }

    .composer{
        padding:8px;
        gap:4px;
    }

    .composer-btn{
        width:36px;
        min-width:36px;
        height:36px;
    }

    .composer input{
        height:42px;
    }

    .local-video{
        width:110px;
        height:155px;
        top:15px;
        right:15px;
    }

    .call-controls{
        bottom:25px;
    }
}

@media(max-width:420px){

    .auth-box{
        padding:28px 20px;
    }

    .brand-title{
        font-size:19px;
    }

    .sidebar-top{
        padding:14px 12px 10px;
    }

    .chat-header{
        padding:9px 10px;
    }

    .header-call-btn{
        width:36px;
        height:36px;
    }

    .message-mini-avatar{
        width:24px;
        height:24px;
        min-width:24px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN / REGISTER
===================================================== -->

<div class="auth" id="authScreen">

    <div class="auth-box">

        <div class="auth-logo">M</div>

        <h1>Smart Messenger</h1>

        <div class="auth-subtitle" id="authTitle">
            Create your account
        </div>

        <div id="registerFields">

            <input
                class="auth-input"
                id="name"
                type="text"
                placeholder="Full name"
                autocomplete="name"
            >

        </div>

        <input
            class="auth-input"
            id="email"
            type="email"
            placeholder="Email address"
            autocomplete="email"
        >

        <div class="password-wrap">

            <input
                class="auth-input"
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button

<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDjgt2oKenX2VokbpurU8DfSYKGLq7Wfuc",
    authDomain: "smart-store-2e455.firebaseapp.com",
    projectId: "smart-store-2e455",

    appId: "1:498458496108:web:989851f4be63cbcc7a1c49"
};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();


/* =====================================================
   DEFAULT AVATAR
===================================================== */

const DEFAULT_AVATAR =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
            <rect width="200" height="200" fill="#e4e6eb"/>
            <circle cx="100" cy="76" r="38" fill="#9da3ae"/>
            <path d="M35 190c7-48 35-70 65-70s58 22 65 70"
                  fill="#9da3ae"/>
        </svg>
    `);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;
let selectedUser = null;

let allUsers = [];

let unsubscribeUsers = null;
let unsubscribeMessages = null;
let unsubscribeTyping = null;
let unsubscribeCalls = null;

let candidateUnsubs = [];

let isRegister = true;

let localStream = null;
let peerConnection = null;

let currentCallId = null;
let currentCallVideo = false;

let incomingCallId = null;
let incomingCallData = null;

let mediaRecorder = null;
let audioChunks = [];

let typingTimer = null;
let callTimer = null;

let endingCall = false;


/* =====================================================
   HELPERS
===================================================== */

function $(id){
    return document.getElementById(id);
}


function avatar(url){
    return url || DEFAULT_AVATAR;
}


function showToast(message){

    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(function(){
        toast.classList.remove("show");
    },2500);
}


function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(timestamp){

    if(!timestamp){
        return "";
    }

    const date =
        timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString([],{
        hour:"numeric",
        minute:"2-digit"
    });
}


function formatLastSeen(timestamp){

    if(!timestamp){
        return "Offline";
    }

    const date =
        timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    const diff = Date.now() - date.getTime();

    if(diff < 60000){
        return "Active just now";
    }

    if(diff < 3600000){
        return "Active " +
            Math.floor(diff / 60000) +
            " min ago";
    }

    if(diff < 86400000){
        return "Active " +
            Math.floor(diff / 3600000) +
            " hr ago";
    }

    return "Active " +
        date.toLocaleDateString();
}


function chatId(uid1,uid2){

    return [uid1,uid2]
        .sort()
        .join("_");
}


/* =====================================================
   PASSWORD
===================================================== */

function togglePassword(){

    const input = $("password");
    const eye = $("passwordEye");

    if(input.type === "password"){

        input.type = "text";
        eye.textContent = "🙈";

    }else{

        input.type = "password";
        eye.textContent = "👁";

    }
}


/* =====================================================
   AUTH TOGGLE
===================================================== */

function toggleAuth(){

    isRegister = !isRegister;

    $("registerFields").style.display =
        isRegister ? "block" : "none";

    $("authTitle").textContent =
        isRegister
        ? "Create your account"
        : "Welcome back";

    $("authButton").textContent =
        isRegister
        ? "Create Account"
        : "Login";

    $("switchText").textContent =
        isRegister
        ? "Already have an account? Login"
        : "Don't have an account? Create one";

    $("authError").textContent = "";

    $("password").value = "";

    $("authLoading").textContent = "";
}


/* =====================================================
   AUTH ERROR
===================================================== */

function friendlyError(error){

    const code = error && error.code
        ? error.code
        : "";

    switch(code){

        case "auth/email-already-in-use":
            return "This email is already registered.";

        case "auth/invalid-email":
            return "Please enter a valid email.";

        case "auth/weak-password":
            return "Password should be at least 6 characters.";

        case "auth/invalid-credential":
            return "Email or password is incorrect.";

        case "auth/user-not-found":
            return "No account found with this email.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":
            return "Network error. Check your internet connection.";

        case "auth/operation-not-allowed":
            return "Email/Password login is not enabled in Firebase Authentication.";

        default:
            return error && error.message
                ? error.message
                : "Something went wrong.";
    }
}


/* =====================================================
   AUTH BUTTON LOADING
===================================================== */

function setAuthBusy(busy){

    const button = $("authButton");

    button.disabled = busy;

    if(busy){

        button.textContent =
            isRegister
            ? "Creating..."
            : "Logging in...";

        $("authLoading").textContent =
            "Please wait...";

    }else{

        button.textContent =
            isRegister
            ? "Create Account"
            : "Login";

        $("authLoading").textContent = "";
    }
}


/* =====================================================
   REGISTER / LOGIN
===================================================== */

async function authAction(){

    const email =
        $("email").value.trim();

    const password =
        $("password").value;

    const name =
        $("name").value.trim();

    $("authError").textContent = "";

    if(!email){

        $("authError").textContent =
            "Please enter your email.";

        return;
    }

    if(!password){

        $("authError").textContent =
            "Please enter your password.";

        return;
    }

    if(isRegister && !name){

        $("authError").textContent =
            "Please enter your name.";

        return;
    }

    if(password.length < 6){

        $("authError").textContent =
            "Password must be at least 6 characters.";

        return;
    }

    setAuthBusy(true);

    try{

        if(isRegister){

            const result =
                await auth.createUserWithEmailAndPassword(
                    email,
                    password
                );

            const user = result.user;

            await db
                .collection("users")
                .doc(user.uid)
                .set({

                    uid:user.uid,

                    name:name,

                    email:user.email,

                    about:"Available on Smart Messenger",

                    photoURL:"",

                    online:true,

                    lastSeen:
                        firebase.firestore.FieldValue.serverTimestamp(),

                    createdAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });

            await user.updateProfile({
                displayName:name
            });

            showToast("Account created successfully.");

        }else{

            await auth.signInWithEmailAndPassword(
                email,
                password
            );

            showToast("Login successful.");

        }

    }catch(error){

        $("authError").textContent =
            friendlyError(error);

    }finally{

        setAuthBusy(false);

    }
}


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(async function(user){

    if(user){

        currentUser = user;

        $("authScreen").classList.add("hidden");
        $("app").classList.remove("hidden");

        await ensureUserDocument();

        await updateOnline(true);

        await loadMyProfile();

        loadUsers();

        listenForCalls();

    }else{

        currentUser = null;

        cleanupEverything();

        $("authScreen").classList.remove("hidden");
        $("app").classList.add("hidden");

    }

});


/* =====================================================
   ENSURE USER DOCUMENT
===================================================== */

async function ensureUserDocument(){

    if(!currentUser){
        return;
    }

    const ref =
        db.collection("users").doc(currentUser.uid);

    const snap =
        await ref.get();

    if(!snap.exists){

        await ref.set({

            uid:currentUser.uid,

            name:
                currentUser.displayName ||
                currentUser.email.split("@")[0],

            email:currentUser.email,

            about:"Available on Smart Messenger",

            photoURL:
                currentUser.photoURL || "",

            online:true,

            lastSeen:
                firebase.firestore.FieldValue.serverTimestamp(),

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });

    }

}


/* =====================================================
   ONLINE STATUS
===================================================== */

async function updateOnline(status){

    if(!currentUser){
        return;
    }

    try{

        await db
            .collection("users")
            .doc(currentUser.uid)
            .set({

                online:status,

                lastSeen:
                    firebase.firestore.FieldValue.serverTimestamp()

            },{
                merge:true
            });

    }catch(error){

        console.log(
            "Presence update error:",
            error
        );

    }

}


document.addEventListener(
    "visibilitychange",
    function(){

        if(currentUser){

            updateOnline(
                !document.hidden
            );

        }

    }
);


window.addEventListener(
    "beforeunload",
    function(){

        if(currentUser){
            updateOnline(false);
        }

    }
);


/* =====================================================
   LOAD MY PROFILE
===================================================== */

async function loadMyProfile(){

    if(!currentUser){
        return;
    }

    try{

        const snap =
            await db
                .collection("users")
                .doc(currentUser.uid)
                .get();

        if(!snap.exists){
            return;
        }

        const data = snap.data();

        $("myName").textContent =
            data.name ||
            currentUser.displayName ||
            "User";

        $("myAvatar").src =
            avatar(data.photoURL);

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   LOAD USERS
===================================================== */

function loadUsers(){

    if(unsubscribeUsers){
        unsubscribeUsers();
    }

    unsubscribeUsers =
        db
            .collection("users")
            .orderBy("name")
            .onSnapshot(

                function(snapshot){

                    allUsers = [];

                    snapshot.forEach(function(doc){

                        const data = doc.data();

                        if(
                            currentUser &&
                            data.uid !== currentUser.uid
                        ){

                            allUsers.push(data);

                        }

                    });

                    renderUsers(allUsers);

                    if(selectedUser){

                        const updated =
                            allUsers.find(
                                u => u.uid === selectedUser.uid
                            );

                        if(updated){

                            selectedUser = updated;

                            updateChatHeader();

                        }

                    }

                },

                function(error){

                    console.log(
                        "Users listener:",
                        error
                    );

                    if(error.code === "failed-precondition"){

                        showToast(
                            "Firebase index required. Open the index link shown in console."
                        );

                    }

                }

            );

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(list){

    const container = $("users");

    container.innerHTML = "";

    if(!list.length){

        const empty =
            document.createElement("div");

        empty.className = "no-users";

        empty.textContent =
            "No people found.";

        container.appendChild(empty);

        return;
    }


    list.forEach(function(user){

        const button =
            document.createElement("button");

        button.className = "user-card";

        if(
            selectedUser &&
            selectedUser.uid === user.uid
        ){

            button.classList.add("active");

        }


        const avatarWrap =
            document.createElement("div");

        avatarWrap.className =
            "user-card-avatar-wrap";


        const img =
            document.createElement("img");

        img.className =
            "user-card-avatar";

        img.src =
            avatar(user.photoURL);

        img.onerror = function(){
            this.src = DEFAULT_AVATAR;
        };


        avatarWrap.appendChild(img);


        if(user.online){

            const status =
                document.createElement("span");

            status.className =
                "user-card-status";

            avatarWrap.appendChild(status);

        }


        const info =
            document.createElement("div");

        info.className =
            "user-card-info";


        const name =
            document.createElement("span");

        name.className =
            "user-card-name";

        name.textContent =
            user.name || "User";


        const last =
            document.createElement("span");

        last.className =
            "user-card-last";

        last.textContent =
            user.online
            ? "Active now"
            : formatLastSeen(user.lastSeen);


        info.appendChild(name);
        info.appendChild(last);


        button.appendChild(avatarWrap);
        button.appendChild(info);


        button.onclick = function(){

            selectUser(user);

        };


        container.appendChild(button);

    });

}


/* =====================================================
   SEARCH USERS
===================================================== */

function searchUsers(){

    const query =
        $("searchUsers")
            .value
            .trim()
            .toLowerCase();

    if(!query){

        renderUsers(allUsers);

        return;
    }

    const filtered =
        allUsers.filter(function(user){

            const name =
                String(user.name || "")
                    .toLowerCase();

            const email =
                String(user.email || "")
                    .toLowerCase();

            return (
                name.includes(query) ||
                email.includes(query)
            );

        });

    renderUsers(filtered);

}


/* =====================================================
   SELECT USER
===================================================== */

function selectUser(user){

    selectedUser = user;

    $("app").classList.add("chat-open");

    updateChatHeader();

    listenTyping();

    loadMessages();

    renderUsers(
        allUsers
    );

}


/* =====================================================
   CHAT HEADER
===================================================== */

function updateChatHeader(){

    if(!selectedUser){
        return;
    }

    $("chatName").textContent =
        selectedUser.name || "User";

    $("chatAvatar").src =
        avatar(selectedUser.photoURL);

    $("chatAvatar").onerror = function(){
        this.src = DEFAULT_AVATAR;
    };


    if(selectedUser.online){

        $("chatStatus").textContent =
            "Active now";

        $("chatOnlineDot")
            .classList.remove("hidden");

    }else{

        $("chatStatus").textContent =
            formatLastSeen(
                selectedUser.lastSeen
            );

        $("chatOnlineDot")
            .classList.add("hidden");

    }

}


/* =====================================================
   UPDATE CHAT STATUS
===================================================== */

async function updateChatStatus(){

    if(!selectedUser){
        return;
    }

    try{

        const snap =
            await db
                .collection("users")
                .doc(selectedUser.uid)
                .get();

        if(snap.exists){

            selectedUser = snap.data();

            updateChatHeader();

        }

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   CLOSE MOBILE CHAT
===================================================== */

function closeChat(){

    $("app").classList.remove("chat-open");

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

    if(!currentUser || !selectedUser){
        return;
    }

    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    const id =
        chatId(
            currentUser.uid,
            selectedUser.uid
        );


    unsubscribeMessages =
        db
            .collection("chats")
            .doc(id)
            .collection("messages")
            .orderBy("createdAt","asc")
            .onSnapshot(

                function(snapshot){

                    renderMessages(
                        snapshot
                    );

                },

                function(error){

                    console.log(
                        "Message listener:",
                        error
                    );

                }

            );

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(snapshot){

    const box = $("messages");

    box.innerHTML = "";

    if(snapshot.empty){

        const empty =
            document.createElement("div");

        empty.className =
            "empty-chat";

        empty.innerHTML = `
            <div class="empty-chat-logo">M</div>
            <strong>Start a conversation</strong>
            <span>Send a message to ${escapeHTML(
                selectedUser ? selectedUser.name : "this person"
            )}</span>
        `;

        box.appendChild(empty);

        return;
    }


    let lastDate = "";


    snapshot.forEach(function(doc){

        const message =
            doc.data();

        const messageDate =
            message.createdAt &&
            message.createdAt.toDate
            ? message.createdAt
                .toDate()
                .toLocaleDateString()
            : "";


        if(
            messageDate &&
            messageDate !== lastDate
        ){

            const day =
                document.createElement("div");

            day.className =
                "message-day";

            day.textContent =
                message.createdAt
                    .toDate()
                    .toLocaleDateString(
                        [],
                        {
                            weekday:"short",
                            month:"short",
                            day:"numeric"
                        }
                    );

            box.appendChild(day);

            lastDate = messageDate;

        }


        const row =
            document.createElement("div");

        row.className =
            "message-row";


        const mine =
            currentUser &&
            message.senderId === currentUser.uid;


        if(mine){

            row.classList.add("mine");

        }


        const miniAvatar =
            document.createElement("img");

        miniAvatar.className =
            "message-mini-avatar";

        miniAvatar.src =
            mine
            ? avatar(
                currentUser.photoURL
            )
            : avatar(
                selectedUser &&
                selectedUser.photoURL
            );

        miniAvatar.onerror = function(){
            this.src = DEFAULT_AVATAR;
        };


        const content =
            document.createElement("div");

        content.className =
            "message-content";


        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";


        /* TEXT */

        if(message.type === "text"){

            bubble.textContent =
                message.text || "";

        }


        /* IMAGE */

        else if(message.type === "image"){

            const img =
                document.createElement("img");

            img.className =
                "message-media";

            img.src =
                message.url;

            img.alt =
                "Image";

            img.loading =
                "lazy";

            img.onclick = function(){

                window.open(
                    message.url,
                    "_blank"
                );

            };

            bubble.appendChild(img);

        }


        /* VIDEO */

        else if(message.type === "video"){

            const video =
                document.createElement("video");

            video.className =
                "message-media";

            video.src =
                message.url;

            video.controls =
                true;

            video.playsInline =
                true;

            bubble.appendChild(video);

        }


        /* AUDIO */

        else if(message.type === "audio"){

            const audio =
                document.createElement("audio");

            audio.className =
                "message-audio";

            audio.src =
                message.url;

            audio.controls =
                true;

            bubble.appendChild(audio);

        }


        content.appendChild(bubble);


        const time =
            document.createElement("div");

        time.className =
            "message-time";

        time.textContent =
            formatTime(
                message.createdAt
            );


        content.appendChild(time);


        /* DELETE OWN MESSAGE */

        if(mine){

            const deleteBtn =
                document.createElement("button");

            deleteBtn.className =
                "delete-message";

            deleteBtn.textContent =
                "🗑";

            deleteBtn.title =
                "Delete message";

            deleteBtn.onclick =
                function(){

                    deleteMessage(
                        doc.id
                    );

                };

            content.appendChild(deleteBtn);

        }


        row.appendChild(miniAvatar);
        row.appendChild(content);

        box.appendChild(row);

    });


    box.scrollTop =
        box.scrollHeight;

}

/* =====================================================
   VOICE RECORDING
===================================================== */

async function toggleRecording(){

    if(mediaRecorder){

        if(
            mediaRecorder.state === "recording"
        ){

            mediaRecorder.stop();

        }

        return;
    }


    if(!selectedUser){

        showToast(
            "Select a person first."
        );

        return;
    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "Microphone is not available. Use HTTPS."
        );

        return;
    }


    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });


        audioChunks = [];


        let mimeType = "";

        if(
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ){

            mimeType =
                "audio/webm;codecs=opus";

        }else if(
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ){

            mimeType =
                "audio/webm";

        }


        mediaRecorder =
            mimeType
            ? new MediaRecorder(
                stream,
                {mimeType:mimeType}
            )
            : new MediaRecorder(stream);


        mediaRecorder.ondataavailable =
            function(event){

                if(event.data.size > 0){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function(){

                try{

                    const type =
                        mediaRecorder.mimeType ||
                        "audio/webm";

                    const blob =
                        new Blob(
                            audioChunks,
                            {type:type}
                        );


                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );


                    const extension =
                        type.includes("ogg")
                        ? "ogg"
                        : "webm";


                    const path =
                        "voice/" +
                        currentUser.uid +
                        "/" +
                        Date.now() +
                        "." +
                        extension;


                    showToast(
                        "Uploading voice..."
                    );


                    const ref =
                        storage
                            .ref()
                            .child(path);


                    const snapshot =
                        await ref.put(blob);


                    const url =
                        await snapshot.ref
                            .getDownloadURL();


                    const id =
                        chatId(
                            currentUser.uid,
                            selectedUser.uid
                        );


                    await db
                        .collection("chats")
                        .doc(id)
                        .collection("messages")
                        .add({

                            senderId:
                                currentUser.uid,

                            receiverId:
                                selectedUser.uid,

                            type:"audio",

                            url:url,

                            createdAt:
                                firebase.firestore.FieldValue.serverTimestamp()

                        });


                    showToast(
                        "Voice message sent."
                    );

                }catch(error){

                    console.log(error);

                    showToast(
                        "Voice upload failed."
                    );

                }finally{

                    mediaRecorder = null;

                    audioChunks = [];

                    $("voiceButton")
                        .classList.remove(
                            "recording"
                        );

                    $("voiceButton").textContent =
                        "🎤";

                }

            };


        mediaRecorder.start();

        $("voiceButton")
            .classList.add("recording");

        $("voiceButton").textContent =
            "⏹";

        showToast(
            "Recording... tap again to stop."
        );

    }catch(error){

        console.log(error);

        showToast(
            "Microphone permission denied."
        );

    }

}

===================================================== */

function cleanupCall(){

    clearTimeout(callTimer);

    callTimer = null;

    clearCandidateListeners();


    if(peerConnection){

        try{
            peerConnection.onicecandidate = null;
            peerConnection.ontrack = null;
            peerConnection.close();
        }catch(e){}

    }

    peerConnection = null;


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }

    localStream = null;


    $("remoteVideo").srcObject = null;

    $("localVideo").srcObject = null;


    $("callScreen")
        .classList.remove("show");


    currentCallId = null;

    currentCallVideo = false;

    endingCall = false;

}


/* =====================================================
   START CALL
===================================================== */

async function startCall(video){

    if(!currentUser || !selectedUser){

        showToast(
            "Select a person first."
        );

        return;
    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "Calls require HTTPS and browser permission."
        );

        return;
    }


    if(currentCallId){

        showToast(
            "You are already in a call."
        );

        return;
    }


    currentCallVideo = video;

    endingCall = false;


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        video
                        ? {
                            width:{ideal:1280},
                            height:{ideal:720}
                        }
                        : false

                });


        $("localVideo").srcObject =
            localStream;


        $("localVideo").style.display =
            video
            ? "block"
            : "none";


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        peerConnection.ontrack =
            function(event){

                if(
                    event.streams &&
                    event.streams[0]
                ){

                    $("remoteVideo").srcObject =
                        event.streams[0];

                }

            };


        const callRef =
            db
                .collection("calls")
                .doc();


        currentCallId =
            callRef.id;


        $("callPersonName").textContent =
            selectedUser.name || "User";


        $("callText").textContent =
            video
            ? "Starting video call..."
            : "Starting voice call...";


        showCallScreen();


        peerConnection.onicecandidate =
            async function(event){

                if(
                    event.candidate
                ){

                    await callRef
                        .collection(
                            "offerCandidates"
                        )
                        .add(
                            event.candidate.toJSON()
                        );

                }

            };


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        /*
         * প্রথমে creating status।
         * offer তৈরি হওয়ার পর calling করা হচ্ছে।
         * এতে receiver offer পাওয়ার আগেই call accept করার সমস্যা কমে।
         */

        await callRef.set({

            callerId:
                currentUser.uid,

            callerName:
                $("myName").textContent,

            callerPhoto:
                $("myAvatar").src || "",

            receiverId:
                selectedUser.uid,

            receiverName:
                selectedUser.name || "User",

            receiverPhoto:
                selectedUser.photoURL || "",

            video:video,

            status:"creating",

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });


        await callRef.update({

            offer:{
                type:offer.type,
                sdp:offer.sdp
            },

            status:"calling"

        });


        const answerUnsub =
            callRef.onSnapshot(
                async function(snapshot){

                    const data =
                        snapshot.data();

                    if(!data){
                        return;
                    }


                    if(
                        data.answer &&
                        !peerConnection.currentRemoteDescription
                    ){

                        try{

                            await peerConnection
                                .setRemoteDescription(
                                    new RTCSessionDescription(
                                        data.answer
                                    )
                                );

                            $("callText").textContent =
                                "Connected";

                        }catch(error){

                            console.log(error);

                        }

                    }


                    if(
                        data.status === "ended"
                    ){

                        cleanupCall();

                    }

                }
            );


        candidateUnsubs.push(
            answerUnsub
        );


        const answerCandidatesUnsub =
            callRef
                .collection("answerCandidates")
                .onSnapshot(
                    function(snapshot){

                        snapshot.docChanges()
                            .forEach(
                                async function(change){

                                    if(
                                        change.type !== "added"
                                    ){
                                        return;
                                    }

                                    try{

                                        await peerConnection
                                            .addIceCandidate(
                                                new RTCIceCandidate(
                                                    change.doc.data()
                                                )
                                            );

                                    }catch(error){

                                        console.log(
                                            "ICE error:",
                                            error
                                        );

                                    }

                                }
                            );

                    }
                );


        candidateUnsubs.push(
            answerCandidatesUnsub
        );


        callTimer =
            setTimeout(
                async function(){

                    if(currentCallId){

                        showToast(
                            "No answer."
                        );

                        await endCall();

                    }

                },
                30000
            );


    }catch(error){

        console.log(error);

        cleanupCall();

        if(
            error.name ===
            "NotAllowedError"
        ){

            showToast(
                "Camera/microphone permission denied."
            );

        }else{

            showToast(
                "Could not start call."
            );

        }

    }

}

            )
            .onSnapshot(

                function(snapshot){

                    snapshot.docChanges()
                        .forEach(
                            function(change){

                                if(
                                    change.type !== "added"
                                ){
                                    return;
                                }


                                if(
                                    currentCallId ||
                                    incomingCallId
                                ){

                                    return;

                                }


                                showIncomingCall(
                                    change.doc.id,
                                    change.doc.data()
                                );

                            }
                        );

                },

                function(error){

                    console.log(
                        "Call listener:",
                        error
                    );

                }

            );

}

                    firebase.firestore.FieldValue.serverTimestamp()

            });

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   ACCEPT INCOMING
===================================================== */

async function acceptIncoming(){

    if(
        !incomingCallId ||
        !incomingCallData
    ){

        return;
    }


    const callId =
        incomingCallId;

    const data =
        incomingCallData;


    incomingCallId = null;

    incomingCallData = null;


    $("incomingCall")
        .classList.remove("show");


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "Calls require HTTPS."
        );

        return;

    }


    currentCallId =
        callId;

    currentCallVideo =
        !!data.video;

    endingCall = false;


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        data.video
                        ? {
                            width:{ideal:1280},
                            height:{ideal:720}
                        }
                        : false

                });


        $("localVideo").srcObject =
            localStream;


        $("localVideo").style.display =
            data.video
            ? "block"
            : "none";


        $("callPersonName").textContent =
            data.callerName ||
            "Caller";


        $("callText").textContent =
            data.video
            ? "Connecting video call..."
            : "Connecting voice call...";


        showCallScreen();


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        peerConnection.ontrack =
            function(event){

                if(
                    event.streams &&
                    event.streams[0]
                ){

                    $("remoteVideo").srcObject =
                        event.streams[0];

                }

            };


        const callRef =
            db
                .collection("calls")
                .doc(callId);


        peerConnection.onicecandidate =
            async function(event){

                if(
                    event.candidate
                ){

                    await callRef
                        .collection(
                            "answerCandidates"
                        )
                        .add(
                            event.candidate.toJSON()
                        );

                }

            };


        const offerCandidatesUnsub =
            callRef
                .collection("offerCandidates")
                .onSnapshot(
                    function(snapshot){

                        snapshot.docChanges()
                            .forEach(
                                async function(change){

                                    if(
                                        change.type !== "added"
                                    ){
                                        return;
                                    }

                                    try{

                                        await peerConnection
                                            .addIceCandidate(
                                                new RTCIceCandidate(
                                                    change.doc.data()
                                                )
                                            );

                                    }catch(error){

                                        console.log(
                                            "Offer ICE:",
                                            error
                                        );

                                    }

                                }
                            );

                    }
                );


        candidateUnsubs.push(
            offerCandidatesUnsub
        );


        const snapshot =
            await callRef.get();


        const callData =
            snapshot.data();


        if(
            !callData ||
            !callData.offer
        ){

            throw new Error(
                "Call offer not found."
            );

        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    callData.offer
                )
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await callRef.update({

            answer:{
                type:answer.type,
                sdp:answer.sdp
            },

            status:"connected"

        });


        $("callText").textContent =
            "Connected";


        callTimer =
            setTimeout(
                async function(){

                    if(currentCallId){

                        await endCall();

                    }

                },
                60 * 60 * 1000
            );


    }catch(error){

        console.log(error);

        try{

            await db
                .collection("calls")
                .doc(callId)
                .update({
                    status:"ended"
                });

        }catch(e){}


        cleanupCall();

        showToast(
            "Could not accept call."
        );

    }

}


/* =====================================================
   MICROPHONE
===================================================== */

function toggleMic(){

    if(!localStream){
        return;
    }


    const tracks =
        localStream.getAudioTracks();


    if(!tracks.length){
        return;
    }


    const enabled =
        !tracks[0].enabled;


    tracks.forEach(
        track =>
            track.enabled = enabled
    );


    $("micButton").textContent =
        enabled
        ? "🎙️"
        : "🔇";

}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

    if(!localStream){
        return;
    }


    const tracks =
        localStream.getVideoTracks();


    if(!tracks.length){

        showToast(
            "Camera is not active in this call."
        );

        return;

    }


    const enabled =
        !tracks[0].enabled;


    tracks.forEach(
        track =>
            track.enabled = enabled
    );


    $("cameraButton").textContent =
        enabled
        ? "📹"
        : "🚫";

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

    if(endingCall){
        return;
    }

    endingCall = true;


    const id =
        currentCallId;


    try{

        if(id){

            await db
                .collection("calls")
                .doc(id)
                .update({

                    status:"ended",

                    endedAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });

        }

    }catch(error){

        console.log(
            "End call update:",
            error
        );

    }finally{

        cleanupCall();

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        await updateOnline(false);

        await auth.signOut();

        showToast(
            "Logged out."
        );

    }catch(error){

        console.log(error);

        showToast(
            "Logout failed."
        );

    }

}


/* =====================================================
   CLEANUP EVERYTHING
===================================================== */

function cleanupEverything(){

    if(unsubscribeUsers){

        unsubscribeUsers();

        unsubscribeUsers = null;

    }


    if(unsubscribeMessages){

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    if(unsubscribeTyping){

        unsubscribeTyping();

        unsubscribeTyping = null;

    }


    if(unsubscribeCalls){

        unsubscribeCalls();

        unsubscribeCalls = null;

    }


    clearCandidateListeners();

    cleanupCall();


    selectedUser = null;

    allUsers = [];

    $("users").innerHTML = "";

}
