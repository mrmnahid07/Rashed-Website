<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Smart Messenger</title>

<!-- ================= FIREBASE ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
    color:#111;
    height:100dvh;
}


/* =====================================================
   AUTH
===================================================== */

.auth-screen{
    width:100%;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:linear-gradient(
        135deg,
        #1877f2,
        #4f9cff,
        #00b894
    );
}

.auth-box{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 15px 50px rgba(0,0,0,.18);
}

.logo{
    text-align:center;
    font-size:31px;
    font-weight:800;
    color:#1877f2;
    margin-bottom:7px;
}

.logo-sub{
    text-align:center;
    color:#777;
    margin-bottom:24px;
    font-size:14px;
}

.auth-box input{
    width:100%;
    height:50px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    margin-bottom:12px;
}

.auth-box input:focus{
    border-color:#1877f2;
}

.auth-btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:12px;
    background:#1877f2;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.auth-switch{
    text-align:center;
    margin-top:18px;
    color:#555;
    font-size:14px;
}

.auth-switch button{
    border:0;
    background:none;
    color:#1877f2;
    font-weight:700;
    cursor:pointer;
}

.auth-error{
    color:#d93025;
    font-size:13px;
    margin-bottom:10px;
    text-align:center;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100dvh;
    min-height:100dvh;
    display:flex;
    overflow:hidden;
    background:#fff;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:350px;
    min-width:350px;
    height:100dvh;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.profile-top{
    min-height:68px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid #eee;
}

.profile-top img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    cursor:pointer;
}

.profile-info{
    flex:1;
    min-width:0;
    cursor:pointer;
}

.profile-name{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-status{
    color:#31a24c;
    font-size:12px;
    margin-top:3px;
}

.logout-btn{
    border:0;
    background:#f1f2f6;
    color:#d93025;
    border-radius:10px;
    min-width:42px;
    height:42px;
    cursor:pointer;
    font-size:17px;
}

.search-box{
    padding:10px;
    border-bottom:1px solid #eee;
}

.search-box input{
    width:100%;
    height:44px;
    border:0;
    outline:none;
    border-radius:22px;
    background:#f0f2f5;
    padding:0 16px;
    font-size:16px;
}

.tabs{
    display:flex;
    padding:8px;
    gap:6px;
    border-bottom:1px solid #eee;
}

.tab{
    flex:1;
    height:40px;
    border:0;
    border-radius:10px;
    background:#f0f2f5;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    position:relative;
}

.tab.active{
    background:#1877f2;
    color:#fff;
}

.badge{
    position:absolute;
    right:3px;
    top:2px;
    min-width:18px;
    height:18px;
    line-height:18px;
    border-radius:10px;
    background:#e41e3f;
    color:#fff;
    font-size:10px;
    display:none;
}

.user-list{
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain;
}


/* =====================================================
   USER ROW
===================================================== */

.user-row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 12px;
    min-height:66px;
    cursor:pointer;
    border-bottom:1px solid #f4f4f4;
}

.user-row:active{
    background:#f0f2f5;
}

.user-row img{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    flex:none;
}

.user-details{
    flex:1;
    min-width:0;
}

.user-name{
    font-weight:700;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-about{
    color:#777;
    font-size:12px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.online-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#31a24c;
    margin-right:4px;
}

.offline-text{
    color:#999;
}

.row-actions{
    display:flex;
    gap:5px;
}

.small-btn{
    min-height:36px;
    padding:0 10px;
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.add-btn{
    background:#1877f2;
    color:#fff;
}

.accept-btn{
    background:#31a24c;
    color:#fff;
}

.reject-btn,
.cancel-btn{
    background:#f0f2f5;
    color:#333;
}


/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;
    height:100dvh;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#fff;
}

.chat-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    text-align:center;
    padding:20px;
}

.chat-header{
    min-height:68px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border-bottom:1px solid #ddd;
    background:#fff;
    flex:none;
}

.back-btn{
    display:none;
    border:0;
    background:#f0f2f5;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:19px;
    cursor:pointer;
}

.chat-header img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
}

.chat-user-info{
    flex:1;
    min-width:0;
}

.chat-user-name{
    font-weight:700;
    font-size:15px;
}

.chat-user-status{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.call-buttons{
    display:flex;
    gap:6px;
}

.call-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    cursor:pointer;
    font-size:17px;
}


/* =====================================================
   CALL STATUS INSIDE CHAT
===================================================== */

.chat-call-status{
    display:none;
    background:#1877f2;
    color:#fff;
    padding:10px 14px;
    text-align:center;
    font-size:13px;
    font-weight:600;
    animation:callPulse 1.2s infinite;
}

@keyframes callPulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.65;
    }

    100%{
        opacity:1;
    }

}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1;
    overflow-y:auto;
    padding:16px 14px;
    background:#f7f8fa;
    overscroll-behavior:contain;
}

.message-wrap{
    display:flex;
    margin:7px 0;
}

.message-wrap.mine{
    justify-content:flex-end;
}

.message{
    max-width:70%;
    padding:9px 12px;
    border-radius:17px;
    background:#e4e6eb;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.message-wrap.mine .message{
    background:#1877f2;
    color:#fff;
}

.message-time{
    display:block;
    font-size:9px;
    opacity:.65;
    margin-top:4px;
}

.message img,
.message video{
    display:block;
    max-width:100%;
    max-height:280px;
    border-radius:10px;
    margin-bottom:4px;
}

.message audio{
    max-width:220px;
}

.message-delete{
    font-size:10px;
    margin-left:8px;
    cursor:pointer;
    opacity:.7;
}

.typing{
    min-height:22px;
    padding:0 14px;
    font-size:12px;
    color:#777;
    background:#f7f8fa;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 9px;
    padding-bottom:calc(
        8px + env(safe-area-inset-bottom)
    );
    border-top:1px solid #ddd;
    background:#fff;
    flex:none;
}

.message-input{
    flex:1;
    min-width:0;
    height:44px;
    border:0;
    outline:none;
    border-radius:22px;
    background:#f0f2f5;
    padding:0 14px;
    font-size:16px;
}

.composer-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    cursor:pointer;
    font-size:17px;
}

.send-btn{
    height:42px;
    min-width:52px;
    padding:0 12px;
    border:0;
    border-radius:21px;
    background:#1877f2;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.file-input{
    display:none;
}


/* =====================================================
   PROFILE MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:16px;
}

.modal-box{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:18px;
    padding:20px;
}

.modal-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
}

.modal-box input,
.modal-box textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    outline:none;
    margin-bottom:12px;
    font-size:15px;
}

.modal-box textarea{
    min-height:90px;
    resize:none;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.modal-actions button{
    flex:1;
    height:44px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.save-btn{
    background:#1877f2;
    color:#fff;
}

.close-btn{
    background:#f0f2f5;
}


/* =====================================================
   INCOMING CALL
===================================================== */

.call-modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:200;
    padding:16px;
}

.call-box{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:22px;
    padding:27px 20px;
    text-align:center;
    animation:callBox .25s ease;
}

@keyframes callBox{

    from{
        transform:scale(.85);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.call-avatar{
    width:95px;
    height:95px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
    border:4px solid #1877f2;
}

.call-title{
    font-size:21px;
    font-weight:700;
}

.call-type{
    color:#777;
    margin:7px 0 22px;
}

.call-actions{
    display:flex;
    justify-content:center;
    gap:18px;
}

.call-actions button{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
}

.answer-call{
    background:#31a24c;
    color:#fff;
}

.reject-call{
    background:#e41e3f;
    color:#fff;
}


/* =====================================================
   VIDEO CALL
===================================================== */

.video-modal{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    z-index:300;
}

.remote-video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

.local-video{
    position:absolute;
    right:12px;
    top:12px;
    width:110px;
    height:150px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid #fff;
    background:#222;
}

.end-call{
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    width:62px;
    height:62px;
    border:0;
    border-radius:50%;
    background:#e41e3f;
    color:#fff;
    font-size:22px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .app{
        position:relative;
        height:100dvh;
        min-height:100dvh;
    }

    .sidebar{
        width:100%;
        min-width:100%;
        height:100dvh;
        border:0;
    }

    .chat{
        position:fixed;
        inset:0;
        width:100%;
        height:100dvh;
        min-height:100dvh;
        background:#fff;
        transform:translateX(100%);
        transition:transform .25s ease;
        z-index:20;
    }

    .app.chat-open .chat{
        transform:translateX(0);
    }

    .back-btn{
        display:block;
        flex:none;
    }

    .profile-top{
        min-height:62px;
        padding:8px 10px;
    }

    .search-box{
        padding:8px 10px;
    }

    .tabs{
        padding:7px;
    }

    .user-row{
        min-height:68px;
        padding:10px;
    }

    .user-row img{
        width:48px;
        height:48px;
    }

    .small-btn{
        min-height:38px;
        padding:0 8px;
    }

    .chat-header{
        min-height:62px;
        padding:8px 9px;
        padding-top:calc(
            8px + env(safe-area-inset-top)
        );
    }

    .chat-header img{
        width:42px;
        height:42px;
    }

    .call-buttons{
        gap:3px;
    }

    .call-btn{
        width:39px;
        height:39px;
    }

    .messages{
        padding:12px 9px;
    }

    .message{
        max-width:85%;
        font-size:14px;
    }

    .composer{
        min-height:58px;
        padding-left:7px;
        padding-right:7px;
    }

    .message-input{
        min-width:0;
        height:44px;
        font-size:16px;
    }

    .composer-btn{
        width:40px;
        min-width:40px;
        height:40px;
    }

    .send-btn{
        min-width:48px;
        padding:0 10px;
        font-size:13px;
    }

    .local-video{
        width:95px;
        height:130px;
        right:8px;
        top:8px;
    }

    .auth-screen{
        align-items:flex-start;
        padding-top:30px;
    }

    .auth-box{
        border-radius:18px;
        padding:25px 18px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

    .profile-name{
        font-size:14px;
    }

    .logout-btn{
        min-width:38px;
        width:38px;
    }

    .tab{
        font-size:11px;
    }

    .call-btn{
        width:35px;
        height:35px;
    }

    .composer-btn{
        width:36px;
        min-width:36px;
    }

    .send-btn{
        min-width:44px;
        padding:0 8px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     AUTH SCREEN
===================================================== -->

<div id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="logo">
            Smart Messenger
        </div>

        <div class="logo-sub">
            Connect • Chat • Call
        </div>

        <div id="authError"
             class="auth-error"></div>


        <!-- LOGIN -->

        <div id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                class="auth-btn"
                onclick="loginUser()"
            >
                Login
            </button>

            <div class="auth-switch">
                Don't have an account?

                <button onclick="showRegister()">
                    Create Account
                </button>
            </div>

        </div>


        <!-- REGISTER -->

        <div id="registerForm"
             style="display:none;">

            <input
                id="registerName"
                type="text"
                placeholder="Your name"
                autocomplete="name"
            >

            <input
                id="registerEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <button
                class="auth-btn"
                onclick="registerUser()"
            >
                Create Account
            </button>

            <div class="auth-switch">
                Already have an account?

                <button onclick="showLogin()">
                    Login
                </button>
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     MAIN APP
===================================================== -->

<div id="app"
     class="app"
     style="display:none;">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="profile-top">

            <img
                id="myAvatar"
                src=""
                alt="Profile"
                onclick="openProfileModal()"
            >

            <div
                class="profile-info"
                onclick="openProfileModal()"
            >

                <div
                    id="myName"
                    class="profile-name"
                >
                    User
                </div>

                <div class="profile-status">
                    ● Online
                </div>

            </div>

            <button
                class="logout-btn"
                onclick="logoutUser()"
            >
                ↪
            </button>

        </div>


        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="Search people..."
                oninput="searchPeople()"
            >

        </div>


        <div class="tabs">

            <button
                id="peopleTab"
                class="tab active"
                onclick="showTab('people')"
            >
                People
            </button>

            <button
                id="friendsTab"
                class="tab"
                onclick="showTab('friends')"
            >
                Friends
            </button>

            <button
                id="requestsTab"
                class="tab"
                onclick="showTab('requests')"
            >
                Requests

                <span
                    id="requestBadge"
                    class="badge"
                >
                    0
                </span>

            </button>

        </div>


        <div
            id="userList"
            class="user-list"
        ></div>

    </aside>


    <!-- =================================================
         CHAT
    ================================================== -->

    <main class="chat">


        <div
            id="chatEmpty"
            class="chat-empty"
        >

            <div>

                <h2>
                    Smart Messenger
                </h2>

                <p style="margin-top:8px;">
                    Add a friend and start chatting.
                </p>

            </div>

        </div>


        <div
            id="chatArea"
            style="
                display:none;
                height:100%;
                flex-direction:column;
            "
        >


            <!-- CHAT CALL STATUS -->

            <div
                id="chatCallStatus"
                class="chat-call-status"
            >
                📞 Calling...
            </div>


            <!-- CHAT HEADER -->

            <div class="chat-header">

                <button
                    class="back-btn"
                    onclick="closeChat()"
                >
                    ←
                </button>


                <img
                    id="chatAvatar"
                    src=""
                    alt=""
                >


                <div class="chat-user-info">

                    <div
                        id="chatUserName"
                        class="chat-user-name"
                    >
                        User
                    </div>

                    <div
                        id="chatUserStatus"
                        class="chat-user-status"
                    >
                        Offline
                    </div>

                </div>


                <div class="call-buttons">

                    <button
                        class="call-btn"
                        onclick="startCall('audio')"
                        title="Voice Call"
                    >
                        📞
                    </button>

                    <button
                        class="call-btn"
                        onclick="startCall('video')"
                        title="Video Call"
                    >
                        📹
                    </button>

                </div>

            </div>


            <!-- MESSAGES -->

            <div
                id="messages"
                class="messages"
            ></div>


            <!-- TYPING -->

            <div
                id="typing"
                class="typing"
            ></div>


            <!-- COMPOSER -->

            <div class="composer">

                <label
                    class="composer-btn"
                    title="Send file"

/* =====================================================

let currentUser = null;

let currentProfile = null;

let allUsers = [];

let friends = [];

/* =====================================================

function $(id){

/* =====================================================
   LOGIN / REGISTER UI
===================================================== */

function showLogin(){

    $("loginForm").style.display =
        "block";

    $("registerForm").style.display =
        "none";

    $("authError").textContent =
        "";

}


function showRegister(){

    $("registerForm").style.display =
        "block";

    $("authError").textContent =

/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

    const email =
        $("loginEmail")
        .value
        .trim();

    const password =
        $("loginPassword")
        .value;


    if(!email || !password){

        $("authError").textContent =
            "Please enter email and password.";

        return;

    }


    try{

        await auth
            .signInWithEmailAndPassword(
                email,
                password
            );

    }catch(error){

        console.error(error);

        $("authError").textContent =
            getAuthError(error);

    }

}


/* =====================================================
   REGISTER
===================================================== */

async function registerUser(){

    const name =
        $("registerName")
        .value
        .trim();

    const email =
        $("registerEmail")
        .value
        .trim();

    const password =
        $("registerPassword")
        .value;


    if(!name ||
       !email ||
       !password){

        $("authError").textContent =
            "Please fill all fields.";

        return;

    }


    if(password.length < 6){

        $("authError").textContent =
            "Password must be at least 6 characters.";

        return;

    }


    try{

        const result =
            await auth
            .createUserWithEmailAndPassword(
                email,
                password
            );


        await db
            .collection("users")
            .doc(result.user.uid)
            .set({

                uid:
                    result.user.uid,

                name:
                    name,

                email:
                    email,

                about:
                    "",

                photoURL:
                    "",

                online:
                    true,

                lastSeen:
                    firebase.firestore.FieldValue
                    .serverTimestamp(),

                createdAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            });

    }catch(error){

        console.error(error);

        $("authError").textContent =
            getAuthError(error);

    }

}


/* =====================================================
   AUTH ERROR
===================================================== */

function getAuthError(error){

    const code =
        error.code || "";


    if(code.includes(
        "email-already-in-use"
    ))
        return "This email is already registered.";


    if(code.includes(
        "invalid-email"
    ))
        return "Invalid email address.";


    if(code.includes(
        "wrong-password"
    ))
        return "Wrong password.";


    if(code.includes(
        "user-not-found"
    ))
        return "Account not found.";


    if(code.includes(
        "weak-password"
    ))
        return "Password is too weak.";


    if(code.includes(
        "operation-not-allowed"
    ))
        return "Enable Email/Password Authentication in Firebase.";


    return error.message ||
        "Something went wrong.";

}


/* =====================================================
   AUTH STATE
===================================================== */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
);


auth.onAuthStateChanged(
async user => {

    if(user){

        currentUser =
            user;


        $("authScreen")
            .style
            .display =
            "none";


        $("app")
            .style
            .display =
            "flex";


        await loadMyProfile();

        await setMyOnline(true);

        await loadUsers();

        await loadFriends();

        await loadRequests();

        listenForIncomingCalls();

        showTab("people");


    }else{

        currentUser =
            null;

        currentProfile =
            null;

        $("app")
            .style
            .display =
            "none";


        $("authScreen")
            .style
            .display =
            "flex";

    }

});


/* =====================================================
   LOGOUT
===================================================== */

async function logoutUser(){

    try{

        if(currentUser){

            await setMyOnline(false);

        }


        stopRingtone();

        cleanupCall();


        await auth.signOut();

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   MY PROFILE
===================================================== */

async function loadMyProfile(){

    if(!currentUser)
        return;


    const ref =
        db
        .collection("users")
        .doc(currentUser.uid);


    const snap =
        await ref.get();


    if(snap.exists){

        currentProfile =
            snap.data();

    }else{

        currentProfile = {

            uid:
                currentUser.uid,

            name:
                currentUser.displayName ||
                currentUser.email
                    .split("@")[0],

            email:
                currentUser.email,

            about:
                "",

            photoURL:
                ""

        };


        await ref.set(
            {
                ...currentProfile,

                online:
                    true,

                createdAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            },
            {
                merge:true
            }
        );

    }


    renderMyProfile();

}


function renderMyProfile(){

    if(!currentProfile)
        return;


    $("myName").textContent =
        currentProfile.name ||
        "User";


    $("myAvatar").src =
        currentProfile.photoURL ||
        defaultAvatar;

}


/* =====================================================
   ONLINE
===================================================== */

async function setMyOnline(status){

    if(!currentUser)
        return;


    try{

        await db
            .collection("users")
            .doc(currentUser.uid)
            .set({

                online:
                    status,

                lastSeen:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            },{
                merge:true
            });

    }catch(error){

        console.error(error);

    }

}


document.addEventListener(
    "visibilitychange",
    () => {

        if(!currentUser)
            return;


        setMyOnline(
            document.visibilityState ===
            "visible"
        );

    }
);


window.addEventListener(
    "beforeunload",
    () => {

        if(currentUser){

            db
            .collection("users")
            .doc(currentUser.uid)
            .set({

                online:false,

                lastSeen:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            },{
                merge:true
            });

        }

    }
);


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

    if(!currentUser)
        return;


    const snap =
        await db
        .collection("users")
        .get();


    allUsers = [];


    snap.forEach(doc => {

        const data =
            doc.data();


        if(doc.id !==
           currentUser.uid){

            allUsers.push({

                id:
                    doc.id,

                ...data

            });

        }

    });


    renderCurrentTab();

}


/* =====================================================
   FRIEND DOC ID
===================================================== */

function friendDocId(a,b){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


/* =====================================================
   LOAD FRIENDS
===================================================== */

async function loadFriends(){

    if(!currentUser)
        return;


    const snap =
        await db
        .collection("friends")
        .where(
            "users",
            "array-contains",
            currentUser.uid
        )
        .get();


    friends = [];

    friendIds =
        new Set();


    snap.forEach(doc => {

        const data =
            doc.data();


        const otherUid =
            data.users.find(
                uid =>
                    uid !==
                    currentUser.uid
            );


        if(otherUid){

            friendIds.add(
                otherUid
            );


            const user =
                allUsers.find(
                    u =>
                        u.id ===
                        otherUid
                );


            if(user){

                friends.push(
                    user
                );

            }

        }

    });


    renderCurrentTab();

}


/* =====================================================
   LOAD REQUESTS
===================================================== */

async function loadRequests(){

    if(!currentUser)
        return;


    const incomingSnap =
        await db
        .collection("friendRequests")
        .where(
            "toUid",
            "==",
            currentUser.uid
        )
        .get();


    incomingRequests = [];


    incomingSnap.forEach(doc => {

        const data =
            doc.data();


        if(
            data.status ===
            "pending"
        ){

            incomingRequests.push({

                id:
                    doc.id,

                ...data

            });

        }

    });


    const outgoingSnap =
        await db
        .collection("friendRequests")
        .where(
            "fromUid",
            "==",
            currentUser.uid
        )
        .get();


    outgoingRequests = [];


    outgoingSnap.forEach(doc => {

        const data =
            doc.data();


        if(
            data.status ===
            "pending"
        ){

            outgoingRequests.push({

                id:
                    doc.id,

                ...data

            });

        }

    });


    updateRequestBadge();

    renderCurrentTab();

}


/* =====================================================
   REQUEST BADGE
===================================================== */

function updateRequestBadge(){

    const badge =
        $("requestBadge");


    if(
        incomingRequests.length >
        0
    ){

        badge.style.display =
            "block";

        badge.textContent =
            incomingRequests.length;

    }else{

        badge.style.display =
            "none";

    }

}


/* =====================================================
   TAB
===================================================== */

function showTab(tab){

    currentTab =
        tab;


    document
        .querySelectorAll(".tab")
        .forEach(
            btn =>
                btn.classList
                   .remove("active")
        );


    if(tab === "people")
        $("peopleTab")
            .classList
            .add("active");


    if(tab === "friends")
        $("friendsTab")
            .classList
            .add("active");


    if(tab === "requests")
        $("requestsTab")
            .classList
            .add("active");


    $("searchInput").value =
        "";


    renderCurrentTab();

}


function renderCurrentTab(){

    if(currentTab ===
       "people"){

        renderPeople(
            allUsers
        );

    }

    else if(
        currentTab ===
        "friends"
    ){

        renderFriends();

    }

    else if(
        currentTab ===
        "requests"
    ){

        renderRequests();

    }

}


/* =====================================================
   SEARCH
===================================================== */

function searchPeople(){

    currentTab =
        "people";


    document
        .querySelectorAll(".tab")
        .forEach(
            btn =>
                btn.classList
                   .remove("active")
        );


    $("peopleTab")
        .classList
        .add("active");


    const value =
        $("searchInput")
        .value
        .trim()
        .toLowerCase();


    if(!value){

        renderPeople(
            allUsers
        );

        return;

    }


    const filtered =
        allUsers.filter(
            user =>

                (user.name || "")
                    .toLowerCase()
                    .includes(value)

                ||

                (user.email || "")
                    .toLowerCase()
                    .includes(value)

                ||

                (user.about || "")
                    .toLowerCase()
                    .includes(value)
        );


    renderPeople(
        filtered
    );

}


/* =====================================================
   RENDER PEOPLE
===================================================== */

function renderPeople(users){

    const list =
        $("userList");


    list.innerHTML =
        "";


    if(users.length === 0){

        list.innerHTML = `
            <div style="
                padding:30px;
                text-align:center;
                color:#888;
            ">
                No users found.
            </div>
        `;

        return;

    }


    users.forEach(user => {

        list.appendChild(
            createUserRow(
                user,
                "people"
            )
        );

    });

}


/* =====================================================
   RENDER FRIENDS
===================================================== */

function renderFriends(){

    const list =
        $("userList");


    list.innerHTML =
        "";


    if(friends.length === 0){

        list.innerHTML = `
            <div style="
                padding:30px;
                text-align:center;
                color:#888;
            ">
                No friends yet.
            </div>
        `;

        return;

    }


    friends.forEach(user => {

            createUserRow(

            )
        );

    });

}


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests(){

    const list =
        $("userList");


    list.innerHTML =
        "";


    if(
        incomingRequests.length === 0 &&
        outgoingRequests.length === 0
    ){

        list.innerHTML = `
            <div style="
                padding:30px;
                text-align:center;
                color:#888;
            ">
                No friend requests.
            </div>
        `;

        return;

    }


    if(incomingRequests.length){

        const title =
            document.createElement(
                "div"
            );


        title.style.padding =
            "12px";

        title.style.fontWeight =
            "700";

        title.style.color =
            "#555";

        title.textContent =
            "Friend Requests";


        list.appendChild(
            title
        );


        incomingRequests.forEach(
            req => {

                const user =
                    allUsers.find(

                    );

                        )
                    );

                }

            }
        );

    }


    if(outgoingRequests.length){

        const title =
            document.createElement(
                "div"
            );


        title.style.padding =
            "12px";

        title.style.fontWeight =
            "700";

        title.style.color =
            "#555";

        title.textContent =
            "Sent Requests";


        list.appendChild(
            title
        );


        outgoingRequests.forEach(
            req => {

                const user =
                    allUsers.find(
                        u =>
                            u.id ===
                            req.toUid
                    );


                if(user){

                    list.appendChild(
                        createUserRow(
                            user,
                            "outgoing-request"
                        )
                    );

                }

            }
        );

    }

}


/* =====================================================
   CREATE USER ROW
===================================================== */

function createUserRow(
    user,
    type
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "user-row";


    const img =
        document.createElement(
            "img"
        );

    img.src =
        user.photoURL ||
        defaultAvatar;


    img.onerror = () => {

        img.src =
            defaultAvatar;

    };


    const details =
        document.createElement(
            "div"
        );

    details.className =
        "user-details";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "user-name";

    name.textContent =
        user.name ||
        "User";


    const about =
        document.createElement(
            "div"
        );

    about.className =
        "user-about";


    if(user.online){

        about.innerHTML =
            `<span class="online-dot"></span>Online`;

    }else{

        about.textContent =
            user.about ||
            "Offline";

        about.classList.add(
            "offline-text"
        );

    }


    details.appendChild(
        name
    );

    details.appendChild(
        about
    );


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "row-actions";


    if(type === "friends"){

        const btn =
            document.createElement(
                "button"
            );

        btn.className =
            "small-btn add-btn";

        btn.textContent =
            "Chat";


        btn.onclick =
            event => {

                event.stopPropagation();

                selectUser(
                    user
                );

            };


        actions.appendChild(
            btn
        );


        row.onclick = () =>
            selectUser(user);

    }


    else if(type === "people"){

        if(friendIds.has(
            user.id
        )){

            const btn =
                document.createElement(
                    "button"
                );

            btn.className =
                "small-btn add-btn";

            btn.textContent =
                "Chat";


            btn.onclick =
                event => {

                    event.stopPropagation();

                    selectUser(
                        user
                    );

                };


            actions.appendChild(
                btn
            );


            row.onclick = () =>
                selectUser(user);

        }

        else{

            const outgoing =
                outgoingRequests.find(
                    r =>
                        r.toUid ===
                        user.id
                );


            const incoming =
                incomingRequests.find(
                    r =>
                        r.fromUid ===
                        user.id
                );


            if(outgoing){

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.className =
                    "small-btn cancel-btn";

                btn.textContent =
                    "Sent";


                btn.onclick =
                    event => {

                        event.stopPropagation();

                        cancelFriendRequest(
                            outgoing.id
                        );

                    };


                actions.appendChild(
                    btn
                );

            }

            else if(incoming){

                const accept =
                    document.createElement(
                        "button"
                    );

                accept.className =
                    "small-btn accept-btn";

                accept.textContent =
                    "Accept";


                accept.onclick =
                    event => {

                        event.stopPropagation();

                        acceptFriendRequest(
                            incoming
                        );

                    };


                const reject =
                    document.createElement(
                        "button"
                    );

                reject.className =
                    "small-btn reject-btn";

                reject.textContent =
                    "Reject";


                reject.onclick =
                    event => {

                        event.stopPropagation();

                        rejectFriendRequest(
                            incoming.id
                        );

                    };


                actions.appendChild(
                    accept
                );

                actions.appendChild(
                    reject
                );

            }

            else{

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.className =
                    "small-btn add-btn";

                btn.textContent =
                    "Add";


                btn.onclick =
                    event => {

                        event.stopPropagation();

                        sendFriendRequest(
                            user.id
                        );

                    };


                actions.appendChild(
                    btn
                );

            }

        }

    }


    else if(
        type ===
        "incoming-request"
    ){

        const accept =
            document.createElement(
                "button"
            );

        accept.className =
            "small-btn accept-btn";

        accept.textContent =
            "Accept";


        accept.onclick =
            event => {

                event.stopPropagation();

                const req =
                    incomingRequests.find(
                        r =>
                            r.fromUid ===
                            user.id
                    );


                if(req){

                    acceptFriendRequest(
                        req
                    );

                }

            };


        const reject =
            document.createElement(
                "button"
            );

        reject.className =
            "small-btn reject-btn";

        reject.textContent =
            "Reject";


        reject.onclick =
            event => {

                event.stopPropagation();

                const req =
                    incomingRequests.find(
                        r =>
                            r.fromUid ===
                            user.id
                    );


                if(req){

                    rejectFriendRequest(
                        req.id
                    );

                }

            };


        actions.appendChild(
            accept
        );

        actions.appendChild(
            reject
        );

    }


    else if(
        type ===
        "outgoing-request"
    ){

        const btn =
            document.createElement(
                "button"
            );

        btn.className =
            "small-btn cancel-btn";

        btn.textContent =
            "Cancel";


        btn.onclick =
            event => {

                event.stopPropagation();

                const req =
                    outgoingRequests.find(
                        r =>
                            r.toUid ===
                            user.id
                    );


                if(req){

                    cancelFriendRequest(
                        req.id
                    );

                }

            };


        actions.appendChild(
            btn
        );

    }


    row.appendChild(
        img
    );

    row.appendChild(
        details
    );

    row.appendChild(
        actions
    );


    return row;

}


/* =====================================================
   SEND FRIEND REQUEST
===================================================== */

async function sendFriendRequest(
    toUid
){

    if(!currentUser ||
       !toUid)
        return;


    if(friendIds.has(
        toUid
    )){

        alert(
            "Already friends."
        );

        return;

    }


    const id =
        currentUser.uid +
        "_" +
        toUid;


    const ref =
        db
        .collection("friendRequests")
        .doc(id);


    const existing =
        await ref.get();


    if(
        existing.exists &&
        existing.data().status ===
        "pending"
    ){

        return;

    }


    await ref.set({

        fromUid:
            currentUser.uid,

        toUid:
            toUid,

        status:
            "pending",

        createdAt:
            firebase.firestore.FieldValue
            .serverTimestamp(),

        updatedAt:
            firebase.firestore.FieldValue
            .serverTimestamp()

    });


    await loadRequests();

}


/* =====================================================
   CANCEL FRIEND REQUEST
===================================================== */

async function cancelFriendRequest(
    requestId
){

    if(!requestId)
        return;


    await db
        .collection("friendRequests")
        .doc(requestId)
        .update({

            status:
                "cancelled",

            updatedAt:
                firebase.firestore.FieldValue
                .serverTimestamp()

        });


    await loadRequests();

}


/* =====================================================
   ACCEPT FRIEND
===================================================== */

async function acceptFriendRequest(
    request
){

    if(!currentUser ||
       !request)
        return;


    const friendId =
        friendDocId(
            currentUser.uid,
            request.fromUid
        );


    await db.runTransaction(
        async transaction => {

            const requestRef =
                db
                .collection("friendRequests")
                .doc(request.id);


            const friendRef =
                db
                .collection("friends")
                .doc(friendId);


            const reqSnap =
                await transaction.get(
                    requestRef
                );


            if(!reqSnap.exists){

                throw new Error(
                    "Request not found."
                );

            }


            transaction.set(
                friendRef,
                {

                    users:[
                        currentUser.uid,
                        request.fromUid
                    ],

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                },
                {
                    merge:true
                }
            );


            transaction.update(
                requestRef,
                {

                    status:
                        "accepted",

                    updatedAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                }
            );

        }
    );


    await loadFriends();

    await loadRequests();

}

}

function renderMessage(
    id,

){

        document.createElement(
            "div"
        );


    wrap.className =
        "message-wrap " +
        (
            data.senderId ===
            currentUser.uid
                ? "mine"
                : ""
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message";


    if(data.type === "image"){

        const img =
            document.createElement(
                "img"
            );

        img.src =
            data.fileUrl;

        bubble.appendChild(
            img
        );


        if(data.text){

            const text =
                document.createElement(
                    "div"
                );

            text.textContent =
                data.text;

            bubble.appendChild(
                text
            );

        }

    }

    else if(
        data.type ===
        "video"
    ){

        const video =
            document.createElement(
                "video"
            );

        video.src =
            data.fileUrl;

        video.controls =
            true;

        video.playsInline =
            true;

        bubble.appendChild(
            video
        );

    }

    else if(
        data.type ===
        "audio"
    ){

        const audio =
            document.createElement(
                "audio"
            );

        audio.src =
            data.fileUrl;

        audio.controls =
            true;

        bubble.appendChild(
            audio
        );

    }

    else{

        const text =
            document.createElement(
                "div"
            );

        text.textContent =
            data.text ||
            "";

        bubble.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            data.createdAt
        );


    bubble.appendChild(
        time
    );


    if(
        data.senderId ===
        currentUser.uid
    ){

        const del =
            document.createElement(
                "span"
            );

        del.className =
            "message-delete";

        del.textContent =
            "Delete";


        del.onclick =
            () =>
                deleteMessage(
                    id
                );


        bubble.appendChild(
            del
        );

    }


    wrap.appendChild(
        bubble
    );


    $("messages")
        .appendChild(
            wrap
        );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(
    timestamp
){

    if(!timestamp)
        return "";


    const date =
        timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


    return date.toLocaleTimeString(
        [],
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );

}

async function startRecording(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices
            .getUserMedia
    ){

        alert(
            "Microphone is not supported."
        );

        return;

    }


    if(!selectedUser){

        alert(
            "Select a friend first."
        );

        return;

    }


    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


        recordedChunks =
            [];


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data.size >
                    0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async () => {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );


                await uploadVoice(
                    blob
                );

            };


        mediaRecorder.start();


        recording =
            true;


        $("voiceBtn")
            .textContent =
            "⏹";

    }catch(error){

        console.error(
            error
        );

        alert(
            "Microphone permission denied."
        );

    }

}


function stopRecording(){

    if(
        mediaRecorder &&
        recording
    ){

        mediaRecorder.stop();

        recording =
            false;

        $("voiceBtn")
            .textContent =
            "🎤";

    }

}

/* =====================================================
   START CALL
===================================================== */

async function startCall(
    type
){

    if(!currentUser ||
       !selectedUser)
        return;


    if(!friendIds.has(
        selectedUser.id
    )){

        alert(
            "You can call only friends."
        );

        return;

    }


    try{

        stopRingtone();


        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:true,

                video:
                    type ===
                    "video"

            });


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        peerConnection.ontrack =
            event => {

                remoteStream =
                    event.streams[0];

                $("remoteVideo")
                    .srcObject =
                    remoteStream;

            };


        currentCallId =
            db
            .collection("calls")
            .doc()
            .id;


        peerConnection.onicecandidate =
            async event => {

                if(
                    event.candidate
                ){

                    await db
                        .collection("calls")
                        .doc(
                            currentCallId
                        )
                        .collection(
                            "callerCandidates"
                        )
                        .add(
                            event.candidate
                            .toJSON()
                        );

                }

            };


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await db
            .collection("calls")
            .doc(
                currentCallId
            )
            .set({

                callerId:
                    currentUser.uid,

                receiverId:
                    selectedUser.id,

                type:
                    type,

                offer:{

                    type:
                        offer.type,

                    sdp:
                        offer.sdp

                },

                status:
                    "ringing",

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });


        showOutgoingCallStatus(
            type
        );


        listenCallerAnswer(
            currentCallId
        );


        listenReceiverCandidates(
            currentCallId
        );


        $("localVideo")
            .srcObject =
            localStream;


        $("videoModal")
            .style
            .display =
            "block";


    }catch(error){

        console.error(
            error
        );

        alert(
            "Call failed: " +
            error.message
        );


        cleanupCall();

    }

}
