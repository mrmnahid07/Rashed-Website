<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Messenger</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:#eef2f7;
 color:#172033;
}

button,input{
 font-family:inherit;
}

button{
 cursor:pointer;
}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);
}

.auth-box{
 width:410px;
 max-width:100%;
 background:white;
 padding:35px;
 border-radius:25px;
 box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo{
 width:70px;
 height:70px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:20px;
 background:#4f46e5;
 color:white;
 font-size:34px;
 font-weight:bold;
}

.auth-box h1{
 text-align:center;
 margin-top:15px;
}

.auth-box p{
 text-align:center;
 color:#718096;
 margin:8px 0 25px;
}

input{
 width:100%;
 padding:13px;
 border:1px solid #d9deea;
 border-radius:12px;
 margin-bottom:12px;
 outline:none;
}

input:focus{
 border-color:#4f46e5;
}

button{
 border:0;
 padding:13px;
 border-radius:12px;
 background:#4f46e5;
 color:white;
 font-weight:bold;
}

.auth-box button{
 width:100%;
}

.switch{
 text-align:center;
 color:#4f46e5;
 cursor:pointer;
 margin-top:12px;
}

.app{
 display:none;
 height:100vh;
 overflow:hidden;
}

.sidebar{
 width:330px;
 background:white;
 border-right:1px solid #e4e8f0;
 display:flex;
 flex-direction:column;
}

.top{
 padding:18px;
 border-bottom:1px solid #edf0f5;
}

.my-profile{
 display:flex;
 align-items:center;
 gap:12px;
}

.avatar{
 width:48px;
 height:48px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.profile-info{
 flex:1;
}

.profile-info strong{
 display:block;
}

.online{
 color:#16a34a;
 font-size:12px;
}

.search{
 margin-top:15px;
}

.search input{
 margin:0;
 background:#f4f6fa;
 border:0;
}

.users{
 flex:1;
 overflow:auto;
}

.user{
 padding:14px 18px;
 display:flex;
 gap:12px;
 align-items:center;
 cursor:pointer;
}

.user:hover,
.user.active{
 background:#eef2ff;
}

.info{
 flex:1;
}

.info strong{
 display:block;
}

.last{
 font-size:12px;
 color:#8a94a6;
}

.chat{
 flex:1;
 display:flex;
 flex-direction:column;
 min-width:0;
}

.chat-header{
 height:76px;
 padding:12px 20px;
 background:white;
 border-bottom:1px solid #e5e9f0;
 display:flex;
 align-items:center;
 gap:12px;
}

.chat-user{
 flex:1;
}

.call-buttons{
 display:flex;
 gap:8px;
}

.call-buttons button{
 width:44px;
 height:44px;
 padding:0;
 border-radius:50%;
}

.messages{
 flex:1;
 padding:20px;
 overflow:auto;
 background:#f5f7fb;
}

.empty{
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#8993a5;
 text-align:center;
}

.msg{
 display:flex;
 margin-bottom:12px;
}

.msg.mine{
 justify-content:flex-end;
}

.bubble{
 max-width:70%;
 padding:11px 14px;
 border-radius:17px;
 background:white;
 box-shadow:0 2px 8px rgba(0,0,0,.05);
 position:relative;
}

.mine .bubble{
 background:#4f46e5;
 color:white;
}

.bubble img,
.bubble video{
 max-width:260px;
 max-height:300px;
 border-radius:12px;
 display:block;
}

.time{
 display:block;
 font-size:10px;
 opacity:.65;
 margin-top:5px;
}

.delete-btn{
 background:transparent;
 color:inherit;
 padding:0;
 margin:5px 0 0;
 font-size:11px;
}

.composer{
 background:white;
 padding:12px;
 display:flex;
 gap:8px;
 align-items:center;
}

.composer input{
 flex:1;
 margin:0;
}

.icon-btn{
 width:44px!important;
 height:44px;
 padding:0;
 margin:0;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
}

.send{
 width:50px!important;
}

.recording{
 background:#dc2626!important;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:90;
 background:rgba(0,0,0,.5);
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-box{
 background:white;
 width:400px;
 max-width:100%;
 padding:25px;
 border-radius:20px;
}

.modal-box button{
 width:100%;
 margin-top:5px;
}

.close{
 background:#64748b!important;
}

.call-screen{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#111827;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}

.call-screen video{
 width:90%;
 max-width:900px;
 max-height:70vh;
 background:black;
 border-radius:20px;
}

.local-video{
 position:absolute!important;
 right:20px;
 bottom:90px;
 width:180px!important;
 height:130px;
 object-fit:cover;
 border:2px solid white;
}

.call-controls{
 position:absolute;
 bottom:25px;
 display:flex;
 gap:10px;
}

.call-controls button{
 width:55px;
 height:55px;
 border-radius:50%;
 padding:0;
}

.end{
 background:#dc2626!important;
}

.mobile-back{
 display:none;
 width:40px;
}

#typingStatus{
 color:#4f46e5;
 font-size:11px;
}

@media(max-width:700px){

 .sidebar{
  width:100%;
 }

 .chat{
  display:none;
 }

 .app.chat-open .sidebar{
  display:none;
 }

 .app.chat-open .chat{
  display:flex;
 }

 .mobile-back{
  display:block;
 }

 .bubble{
  max-width:85%;
 }

 .call-buttons button{
  width:40px;
  height:40px;
 }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="auth" id="authScreen">

<div class="auth-box">

<div class="logo">M</div>

<h1>Smart Messenger</h1>

<p id="authTitle">Create your account</p>

<div id="registerFields">
<input id="name" placeholder="Your name">
</div>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="authAction()" id="authButton">
Create Account
</button>

<div class="switch"
onclick="toggleAuth()"
id="switchText">
Already have an account? Login
</div>

<div id="authError"
style="color:#dc2626;text-align:center;margin-top:12px">
</div>

</div>
</div>


<!-- ================= APP ================= -->

<div class="app" id="app">

<div class="sidebar">

<div class="top">

<div class="my-profile">

<img class="avatar"
id="myAvatar"
src="https://via.placeholder.com/100">

<div class="profile-info">

<strong id="myName">User</strong>

<span class="online">● Online</span>

</div>

<button
style="width:42px;padding:10px"
onclick="openProfile()">
⚙
</button>

</div>

<div class="search">

<input
id="searchUsers"
placeholder="Search people..."
oninput="searchUsers()">

</div>

<button
onclick="logout()"
style="width:100%;margin-top:10px;background:#dc2626">
Logout
</button>

</div>

<div class="users" id="users"></div>

</div>


<!-- ================= CHAT ================= -->

<div class="chat">

<div class="chat-header">

<button
class="mobile-back"
onclick="closeChat()">
←
</button>

<img class="avatar"
id="chatAvatar"
src="https://via.placeholder.com/100">

<div class="chat-user">

<strong id="chatName">
Select a person
</strong>

<div class="last" id="chatStatus"></div>

<div id="typingStatus"></div>

</div>

<div class="call-buttons">

<button onclick="startCall(false)">
📞
</button>

<button onclick="startCall(true)">
📹
</button>

</div>

</div>

<div class="messages" id="messages">

<div class="empty">
Select someone to start chatting
</div>

</div>

<div class="composer">

<label class="icon-btn"
style="background:#4f46e5;color:white">

📎

<input
type="file"
id="fileInput"
accept="image/*,video/*"
style="display:none"
onchange="sendFile(event)">

</label>

<button
class="icon-btn"
id="voiceButton"
onclick="toggleRecording()">
🎤
</button>

<input
id="messageInput"
placeholder="Write a message..."
onkeydown="handleEnter(event)"
oninput="typing()">

<button
class="icon-btn send"
onclick="sendMessage()">
➤
</button>

</div>

</div>
</div>


<!-- ================= PROFILE ================= -->

<div class="modal" id="profileModal">

<div class="modal-box">

<h2>My Profile</h2>

<br>

<img
class="avatar"
id="profilePreview"
style="width:90px;height:90px;display:block;margin:auto"
src="https://via.placeholder.com/100">

<br>

<input
id="profileName"
placeholder="Name">

<input
id="profileAbout"
placeholder="About">

<input
type="file"
id="profilePhoto"
accept="image/*">

<button onclick="saveProfile()">
Save Profile
</button>

<button
class="close"
onclick="closeProfile()">
Close
</button>

</div>
</div>


<!-- ================= CALL ================= -->

<div class="call-screen" id="callScreen">

<video
id="remoteVideo"
autoplay
playsinline>
</video>

<video
id="localVideo"
class="local-video"
autoplay
muted
playsinline>
</video>

<div
id="callText"
style="color:white;font-size:20px;margin-bottom:20px">
Calling...
</div>

<div class="call-controls">

<button onclick="toggleMic()">
🎙️
</button>

<button onclick="toggleCamera()">
📹
</button>

<button
class="end"
onclick="endCall()">
☎
</button>

</div>
</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

 apiKey:
 "AIzaSyDjgt2oKenX2VokbpurU8DfSYKGLq7Wfuc",

 authDomain:
 "smart-store-2e455.firebaseapp.com",

 projectId:
 "smart-store-2e455",

 storageBucket:
 "smart-store-2e455.firebasestorage.app",

 messagingSenderId:
 "498458496108",

 appId:
 "1:498458496108:web:989851f4be63cbcc7a1c49"

};


/* =====================================================
   FIREBASE INIT
===================================================== */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

const storage = firebase.storage();


/*
 IMPORTANT:
 This is your Firebase Authentication UID.
 It is NOT the API key and does not bypass login.
*/

const MY_UID =
"KKowbhqUTDOhslyIwVxtxxK29fW2";


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let selectedUser = null;

let unsubscribeMessages = null;

let unsubscribeTyping = null;

let isRegister = true;

let allUsers = [];

let localStream = null;

let peerConnection = null;

let currentCallId = null;

let currentCallVideo = false;

let mediaRecorder = null;

let audioChunks = [];

let typingTimer;


/* =====================================================
   AUTH
===================================================== */

function toggleAuth(){

 isRegister = !isRegister;

 document.getElementById("registerFields")
 .style.display =
 isRegister ? "block" : "none";

 document.getElementById("authTitle")
 .textContent =
 isRegister
 ? "Create your account"
 : "Login to Smart Messenger";

 document.getElementById("authButton")
 .textContent =
 isRegister
 ? "Create Account"
 : "Login";

 document.getElementById("switchText")
 .textContent =
 isRegister
 ? "Already have an account? Login"
 : "Don't have an account? Create one";

 document.getElementById("authError")
 .textContent="";
}


async function authAction(){

 const email =
 document.getElementById("email")
 .value.trim();

 const password =
 document.getElementById("password")
 .value;

 const error =
 document.getElementById("authError");

 error.textContent="";

 if(!email || !password){

  error.textContent =
  "Email and password required.";

  return;
 }

 try{

  if(isRegister){

   const name =
   document.getElementById("name")
   .value.trim();

   if(!name){

    error.textContent =
    "Enter your name.";

    return;
   }

   const result =
   await auth
   .createUserWithEmailAndPassword(
    email,
    password
   );

   await db
   .collection("users")
   .doc(result.user.uid)
   .set({

    uid:result.user.uid,

    name:name,

    email:email,

    about:"Available",

    photoURL:"",

    online:true,

    lastSeen:
    firebase.firestore.FieldValue
    .serverTimestamp(),

    createdAt:
    firebase.firestore.FieldValue
    .serverTimestamp()

   });

  }else{

   await auth
   .signInWithEmailAndPassword(
    email,
    password
   );

  }

 }catch(err){

  error.textContent =
  friendlyError(err);

 }
}


function friendlyError(err){

 if(err.code === "auth/email-already-in-use")
  return "This email is already registered.";

 if(err.code === "auth/invalid-email")
  return "Invalid email address.";

 if(err.code === "auth/weak-password")
  return "Password should be at least 6 characters.";

 if(err.code === "auth/invalid-credential")
  return "Wrong email or password.";

 if(err.code === "auth/api-key-not-valid")
  return "Firebase API key is invalid.";

 return err.message;
}


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(async user=>{

 if(user){

  currentUser=user;

  document.getElementById("authScreen")
  .style.display="none";

  document.getElementById("app")
  .style.display="flex";

  await updateOnline(true);

  await loadMyProfile();

  loadUsers();

  listenForCalls();

 }else{

  currentUser=null;

  document.getElementById("authScreen")
  .style.display="flex";

  document.getElementById("app")
  .style.display="none";

 }

});


/* =====================================================
   ONLINE / LAST SEEN
===================================================== */

async function updateOnline(status){

 if(!currentUser) return;

 try{

  await db
  .collection("users")
  .doc(currentUser.uid)
  .set({

   online:status,

   lastSeen:
   firebase.firestore.FieldValue
   .serverTimestamp()

  },{merge:true});

 }catch(e){

  console.log(e);

 }
}


window.addEventListener(
"beforeunload",
()=>{

 if(currentUser){

  updateOnline(false);

 }

});


/* =====================================================
   MY PROFILE
===================================================== */

async function loadMyProfile(){

 const doc =
 await db
 .collection("users")
 .doc(currentUser.uid)
 .get();

 if(!doc.exists) return;

 const data=doc.data();

 document.getElementById("myName")
 .textContent=data.name || "User";

 document.getElementById("myAvatar")
 .src=data.photoURL ||
 "https://via.placeholder.com/100";

}


/* =====================================================
   USERS
===================================================== */

function loadUsers(){

 db.collection("users")
 .orderBy("name")
 .onSnapshot(snapshot=>{

  allUsers=[];

  snapshot.forEach(doc=>{

   if(doc.id !== currentUser.uid){

    allUsers.push({
     id:doc.id,
     ...doc.data()
    });

   }

  });

  renderUsers(allUsers);

 },err=>{

  console.log("Users error:",err);

 });

}


function renderUsers(list){

 const box =
 document.getElementById("users");

 box.innerHTML="";

 list.forEach(user=>{

  const div =
  document.createElement("div");

  div.className="user";

  if(
   selectedUser &&
   selectedUser.id===user.id
  ){
   div.classList.add("active");
  }

  const avatar =
  user.photoURL ||
  "https://via.placeholder.com/100";

  const status =
  user.online
  ? "● Online"
  : formatLastSeen(user.lastSeen);

  div.innerHTML=`

   <img class="avatar"
   src="${escapeHTML(avatar)}">

   <div class="info">

    <strong>
    ${escapeHTML(user.name || "User")}
    </strong>

    <span class="last">
    ${escapeHTML(status)}
    </span>

   </div>

  `;

  div.onclick=()=>selectUser(user);

  box.appendChild(div);

 });

}


function searchUsers(){

 const q =
 document.getElementById("searchUsers")
 .value.toLowerCase();

 renderUsers(
  allUsers.filter(user=>
   (user.name || "")
   .toLowerCase()
   .includes(q)
  )
 );

}


/* =====================================================
   SELECT USER
===================================================== */

function selectUser(user){

 selectedUser=user;

 document.getElementById("app")
 .classList.add("chat-open");

 document.getElementById("chatName")
 .textContent=user.name || "User";

 document.getElementById("chatAvatar")
 .src=user.photoURL ||
 "https://via.placeholder.com/100";

 updateChatStatus();

 listenTyping();

 loadMessages();

 renderUsers(
  allUsers.filter(u=>
   u.name
   ?.toLowerCase()
   .includes(
    document.getElementById("searchUsers")
    .value.toLowerCase()
   )
  )
 );

}


async function updateChatStatus(){

 if(!selectedUser) return;

 const doc =
 await db
 .collection("users")
 .doc(selectedUser.id)
 .get();

 if(!doc.exists) return;

 const data=doc.data();

 document.getElementById("chatStatus")
 .textContent =
 data.online
 ? "● Online"
 : formatLastSeen(data.lastSeen);

}


function formatLastSeen(timestamp){

 if(!timestamp || !timestamp.toDate)
  return "Offline";

 return "Last seen " +
 timestamp.toDate()
 .toLocaleString([],{
  dateStyle:"short",
  timeStyle:"short"
 });
}


function closeChat(){

 document.getElementById("app")
 .classList.remove("chat-open");

}


/* =====================================================
   CHAT ID
===================================================== */

function chatId(a,b){

 return [a,b].sort().join("_");

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

 if(!selectedUser) return;

 if(unsubscribeMessages)
  unsubscribeMessages();

 const id =
 chatId(
  currentUser.uid,
  selectedUser.id
 );

 unsubscribeMessages =
 db.collection("chats")
 .doc(id)
 .collection("messages")
 .orderBy("createdAt")
 .onSnapshot(snapshot=>{

  const box =
  document.getElementById("messages");

  box.innerHTML="";

  if(snapshot.empty){

   box.innerHTML=
   `<div class="empty">
   No messages yet.<br>
   Start chatting!
   </div>`;

  }

  snapshot.forEach(doc=>{

   renderMessage(
    doc.data(),
    doc.id,
    box
   );

  });

  box.scrollTop=box.scrollHeight;

 },err=>{

  console.log("Message error:",err);

 });

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(m,id,box){

 const div =
 document.createElement("div");

 const mine =
 m.senderId===currentUser.uid;

 div.className=
 "msg "+(mine ? "mine":"");

 let content="";

 if(m.type==="text"){

  content=
  `<div>${escapeHTML(m.text)}</div>`;

 }

 if(m.type==="image"){

  content=
  `<img
   src="${escapeHTML(m.url)}"
   alt="image"
   onclick="window.open(this.src,'_blank')">`;

 }

 if(m.type==="video"){

  content=
  `<video
   src="${escapeHTML(m.url)}"
   controls>
   </video>`;

 }

 if(m.type==="audio"){

  content=
  `<audio
   src="${escapeHTML(m.url)}"
   controls>
   </audio>`;

 }

 const time =
 m.createdAt &&
 m.createdAt.toDate
 ? m.createdAt.toDate()
 .toLocaleTimeString([],{
  hour:"2-digit",
  minute:"2-digit"
 })
 : "";

 div.innerHTML=`

  <div class="bubble">

   ${content}

   <span class="time">
   ${time}
   </span>

   ${
    mine
    ? `<button
       class="delete-btn"
       onclick="deleteMessage('${id}')">
       Delete
       </button>`
    : ""
   }

  </div>

 `;

 box.appendChild(div);

}


/* =====================================================
   SEND TEXT
===================================================== */

async function sendMessage(){

 if(!selectedUser){

  alert("Select a person first.");

  return;
 }

 const input =
 document.getElementById("messageInput");

 const text =
 input.value.trim();

 if(!text) return;

 const id =
 chatId(
  currentUser.uid,
  selectedUser.id
 );

 try{

  await db
  .collection("chats")
  .doc(id)
  .collection("messages")
  .add({

   senderId:currentUser.uid,

   receiverId:selectedUser.id,

   text:text,

   type:"text",

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });

  input.value="";

 }catch(err){

  alert(err.message);

 }

}


function handleEnter(e){

 if(e.key==="Enter"){

  e.preventDefault();

  sendMessage();

 }

}


/* =====================================================
   DELETE MESSAGE
===================================================== */

async function deleteMessage(id){

 if(!selectedUser) return;

 if(!confirm("Delete this message?"))
  return;

 const chat =
 chatId(
  currentUser.uid,
  selectedUser.id
 );

 try{

  await db
  .collection("chats")
  .doc(chat)
  .collection("messages")
  .doc(id)
  .delete();

 }catch(err){

  alert(err.message);

 }

}


/* =====================================================
   IMAGE / VIDEO
===================================================== */

async function sendFile(event){

 if(!selectedUser){

  alert("Select a person first.");

  event.target.value="";

  return;
 }

 const file=event.target.files[0];

 if(!file) return;

 if(file.size>100*1024*1024){

  alert("Maximum file size is 100MB.");

  event.target.value="";

  return;
 }

 if(
  !file.type.startsWith("image/") &&
  !file.type.startsWith("video/")
 ){

  alert("Only image or video allowed.");

  event.target.value="";

  return;
 }

 try{

  const path =
  `chatFiles/${currentUser.uid}/`
  +Date.now()+"_"+file.name;

  const ref=storage.ref(path);

  await ref.put(file);

  const url=
  await ref.getDownloadURL();

  const type=
  file.type.startsWith("image/")
  ? "image"
  : "video";

  const chat =
  chatId(
   currentUser.uid,
   selectedUser.id
  );

  await db
  .collection("chats")
  .doc(chat)
  .collection("messages")
  .add({

   senderId:currentUser.uid,

   receiverId:selectedUser.id,

   url:url,

  });

 }catch(err){

 }

}


/* =====================================================
   VOICE MESSAGE
===================================================== */

async function toggleRecording(){

 if(!selectedUser){

  alert("Select a person first.");

  return;
 }

 if(mediaRecorder &&
 mediaRecorder.state==="recording"){

  mediaRecorder.stop();

  document.getElementById("voiceButton")
  .classList.remove("recording");

  document.getElementById("voiceButton")
  .textContent="🎤";

  return;
 }

 try{

  const stream =
  await navigator.mediaDevices
  .getUserMedia({audio:true});

  audioChunks=[];

  mediaRecorder =
  new MediaRecorder(stream);

  mediaRecorder.ondataavailable=e=>{

   if(e.data.size>0)
    audioChunks.push(e.data);

  };

  mediaRecorder.onstop=async()=>{

   stream.getTracks().forEach(
    track=>track.stop()
   );

   const blob =
   new Blob(
    audioChunks,
    {type:"audio/webm"}
   );

   try{

    const path=
    `voice/${currentUser.uid}/`
    +Date.now()+".webm";

    const ref=
    storage.ref(path);

    await ref.put(blob);

    const url=
    await ref.getDownloadURL();

    const chat=
    chatId(
     currentUser.uid,
     selectedUser.id
    );

    await db
    .collection("chats")
    .doc(chat)
    .collection("messages")
    .add({

     senderId:currentUser.uid,

     receiverId:selectedUser.id,

     type:"audio",

     url:url,

     createdAt:
     firebase.firestore.FieldValue
     .serverTimestamp()

    });

   }catch(err){

    alert(err.message);

   }

  };

  mediaRecorder.start();

  document.getElementById("voiceButton")
  .classList.add("recording");

  document.getElementById("voiceButton")
  .textContent="⏹";

 }catch(err){

  alert(
   "Microphone permission required."
  );

 }

}

 document.getElementById("profileName")
 .value.trim();

 document.getElementById("profileAbout")
 .value.trim();

  alert("Name required.");

  return;

 .files[0];

 .collection("users")
 .doc(currentUser.uid)

const rtcConfig={

 iceServers:[

  },

/* =====================================================
   START CALL
===================================================== */

async function startCall(video){

 if(!selectedUser){

  alert("Select a person first.");

  return;
 }

 currentCallVideo=video;

 currentCallId=
 db.collection("calls")
 .doc().id;

 try{

  localStream=
  await navigator.mediaDevices
  .getUserMedia({

   audio:true,

   video:video

  });

  document.getElementById("localVideo")
  .srcObject=localStream;

  document.getElementById("localVideo")
  .style.display=
  video ? "block":"none";

  peerConnection=
  new RTCPeerConnection(rtcConfig);

  localStream
  .getTracks()
  .forEach(track=>{

   peerConnection.addTrack(
    track,
    localStream
   );

  });

  peerConnection.ontrack=e=>{

   document.getElementById("remoteVideo")
   .srcObject=e.streams[0];

  };

  const callRef=
  db.collection("calls")
  .doc(currentCallId);

  const offerCandidates=
  callRef.collection(
   "offerCandidates"
  );

  const answerCandidates=
  callRef.collection(
   "answerCandidates"
  );

  peerConnection.onicecandidate=e=>{

   if(e.candidate){

    offerCandidates.add(
     e.candidate.toJSON()
    );

   }

  };

  const offer=
  await peerConnection.createOffer();

  await peerConnection
  .setLocalDescription(offer);

  await callRef.set({

   callerId:currentUser.uid,

   receiverId:selectedUser.id,

   video:video,

   offer:{
    type:offer.type,
    sdp:offer.sdp
   },

   status:"calling",

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });

  answerCandidates
  .onSnapshot(snapshot=>{

   snapshot.docChanges()
   .forEach(change=>{

    if(change.type==="added"){

     peerConnection
     .addIceCandidate(
      new RTCIceCandidate(
       change.doc.data()
      )
     );

    }

   });

  });

  callRef.onSnapshot(async snapshot=>{

   const data=snapshot.data();

   if(!data) return;

   if(
    data.answer &&
    !peerConnection
    .currentRemoteDescription
   ){

    await peerConnection
    .setRemoteDescription(
     new RTCSessionDescription(
      data.answer
     )
    );

   }

   if(data.status==="ended"){

    endCallLocal();

   }

  });

  showCallScreen(
   "Calling "+selectedUser.name
  );

 }catch(err){

  alert(
   "Camera/Microphone error: "
   +err.message
  );

 }

}

function listenForCalls(){

 });

}


async function receiveCall(callId,data){

 const answer=
 confirm(
  "Incoming "+
  (data.video ? "video":"voice")+
  " call. Answer?"
 );

 if(!answer){

  await db
  .collection("calls")
  .doc(callId)
  .update({
   status:"ended"
  });

  return;
 }

 currentCallId=callId;

 currentCallVideo=data.video;

 try{

  localStream=
  await navigator.mediaDevices
  .getUserMedia({

   audio:true,

   video:data.video

  });

  document.getElementById("localVideo")
  .srcObject=localStream;

  document.getElementById("localVideo")
  .style.display=
  data.video ? "block":"none";

  peerConnection=
  new RTCPeerConnection(rtcConfig);

  localStream
  .getTracks()
  .forEach(track=>{

   peerConnection.addTrack(
    track,
    localStream
   );

  });

  peerConnection.ontrack=e=>{

   document.getElementById("remoteVideo")
   .srcObject=e.streams[0];

  };

  const callRef=
  db.collection("calls")
  .doc(callId);

  const offerCandidates=
  callRef.collection(
   "offerCandidates"
  );

  const answerCandidates=
  callRef.collection(
   "answerCandidates"
  );

  peerConnection.onicecandidate=e=>{

   if(e.candidate){

    answerCandidates.add(
     e.candidate.toJSON()
    );

   }

  };

  await peerConnection
  .setRemoteDescription(
   new RTCSessionDescription(
    data.offer
   )
  );

  const answer=
  await peerConnection
  .createAnswer();

  await peerConnection
  .setLocalDescription(answer);

  await callRef.update({

   answer:{
    type:answer.type,
    sdp:answer.sdp
   },

   status:"connected"

  });

  offerCandidates
  .onSnapshot(snapshot=>{

   snapshot.docChanges()
   .forEach(change=>{

    if(change.type==="added"){

     peerConnection
     .addIceCandidate(
      new RTCIceCandidate(
       change.doc.data()
      )
     );

    }

   });

  });

  showCallScreen(
   "Connected"
  );

 }catch(err){

  alert(err.message);

 }

}


/* =====================================================
   CALL UI
===================================================== */

function showCallScreen(text){

 document.getElementById("callText")
 .textContent=text;

 document.getElementById("callScreen")
 .style.display="flex";

}


function toggleMic(){

 if(!localStream) return;

 localStream
 .getAudioTracks()
 .forEach(track=>{

  track.enabled=
  !track.enabled;

 });

}


function toggleCamera(){

 if(!localStream) return;

 localStream
 .getVideoTracks()
 .forEach(track=>{

  track.enabled=
  !track.enabled;

 });

}


async function endCall(){

 if(currentCallId){

  try{

   await db
   .collection("calls")
   .doc(currentCallId)
   .set({

    status:"ended"

   },{merge:true});

  }catch(e){

   console.log(e);

  }

 }

 endCallLocal();

}


function endCallLocal(){

 if(localStream){

  localStream
  .getTracks()
  .forEach(track=>track.stop());

 }

 if(peerConnection){

  peerConnection.close();

 }

 localStream=null;

 peerConnection=null;

 currentCallId=null;

 document.getElementById("remoteVideo")
 .srcObject=null;

 document.getElementById("localVideo")
 .srcObject=null;

 document.getElementById("callScreen")
 .style.display="none";

}

/* =====================================================

function escapeHTML(str){

 return String(str)

 .replaceAll("&","&amp;")

 .replaceAll("<","&lt;")

 .replaceAll(">","&gt;")

 .replaceAll('"',"&quot;")

 .replaceAll("'","&#039;");

}
