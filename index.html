/* =====================================================
   CALLER ANSWER
===================================================== */

function listenCallerAnswer(
    callId
){

    const unsubscribe =
        db
        .collection("calls")
        .doc(callId)
        .onSnapshot(
            async snapshot => {

                const data =
                    snapshot.data();


                if(!data)
                    return;


                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection
                        .currentRemoteDescription
                ){

                    await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                data.answer
                            )
                        );


                    $("chatCallStatus")
                        .textContent =
                        "🔵 Call connected";

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    alert(
                        "Call rejected."
                    );

                    cleanupCall();

                }


                if(
                    data.status ===
                    "ended"
                ){

                    cleanupCall();

                }

            }
        );


    callUnsubscribers.push(
        unsubscribe
    );

}


/* =====================================================
   RECEIVER ICE
===================================================== */

function listenReceiverCandidates(
    callId
){

    const unsubscribe =
        db
        .collection("calls")
        .doc(callId)
        .collection(
            "receiverCandidates"
        )
        .onSnapshot(
            snapshot => {

                snapshot
                    .docChanges()
                    .forEach(
                        async change => {

                            if(
                                change.type ===
                                "added" &&
                                peerConnection
                            ){

                                try{

                                    await peerConnection
                                        .addIceCandidate(
                                            new RTCIceCandidate(
                                                change.doc.data()
                                            )
                                        );

                                }catch(error){

                                    console.error(
                                        error
                                    );

                                }

                            }

                        }
                    );

            }
        );


    callUnsubscribers.push(
        unsubscribe
    );

}


/* =====================================================
   INCOMING CALL LISTENER
===================================================== */

function listenForIncomingCalls(){

    if(unsubscribeIncomingCalls){

        unsubscribeIncomingCalls();

    }


    unsubscribeIncomingCalls =
        db
        .collection("calls")
        .where(
            "receiverId",
            "==",
            currentUser.uid
        )
        .onSnapshot(
            snapshot => {

                snapshot
                    .docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.status ===
                                "ringing"
                            ){

                                showIncomingCall(
                                    change.doc.id,
                                    data
                                );

                            }

                        }
                    );

            }
        );

}


/* =====================================================
   INCOMING CALL DISPLAY + RING
===================================================== */

function showIncomingCall(
    callId,
    data
){

    /*
       Save incoming call
    */

    incomingCallData = {

        callId:
            callId,

        ...data

    };


    currentCallId =
        callId;


    const caller =
        allUsers.find(
            u =>
                u.id ===
                data.callerId
        );


    const callerName =
        caller?.name ||
        "Someone";


    const callerPhoto =
        caller?.photoURL ||
        defaultAvatar;


    /*
       ==========================
       POPUP DISPLAY
       ==========================
    */

    $("incomingCallAvatar")
        .src =
        callerPhoto;


    $("incomingCallName")
        .textContent =
        callerName;


    $("incomingCallType")
        .textContent =
        data.type === "video"
            ? "📹 Incoming video call"
            : "📞 Incoming voice call";


    $("incomingCallModal")
        .style
        .display =
        "flex";


    /*
       ==========================
       CHAT DISPLAY
       ==========================
    */

    $("chatCallStatus")
        .style
        .display =
        "block";


    $("chatCallStatus")
        .textContent =
        data.type === "video"
            ? "📹 " +
              callerName +
              " is calling you..."
            : "📞 " +
              callerName +
              " is calling you...";


    /*
       ==========================
       OPEN CHAT AUTOMATICALLY
       ==========================
    */

    if(caller){

        selectedUser =
            caller;


        $("chatEmpty")
            .style
            .display =
            "none";


        $("chatArea")
            .style
            .display =
            "flex";


        $("chatAvatar")
            .src =
            callerPhoto;


        $("chatUserName")
            .textContent =
            callerName;


        updateChatStatus(
            caller
        );


        $("app")
            .classList
            .add("chat-open");


        loadMessages();

    }


    /*
       ==========================
       RING
       ==========================
    */

    startRingtone();

}


/* =====================================================
   START RINGTONE
===================================================== */

function startRingtone(){

    const ringtone =
        $("callRingtone");


    if(!ringtone)
        return;


    ringtone.currentTime =
        0;


    const playPromise =
        ringtone.play();


    if(
        playPromise &&
        typeof playPromise.catch ===
        "function"
    ){

        playPromise.catch(
            error => {

                console.log(
                    "Browser blocked autoplay:",
                    error
                );

            }
        );

    }

}


/* =====================================================
   STOP RINGTONE
===================================================== */

function stopRingtone(){

    const ringtone =
        $("callRingtone");


    if(!ringtone)
        return;


    ringtone.pause();

    ringtone.currentTime =
        0;

}


/* =====================================================
   ACCEPT INCOMING CALL
===================================================== */

async function acceptIncomingCall(){

    if(!incomingCallData)
        return;


    const call =
        incomingCallData;


    /*
       STOP RING
    */

    stopRingtone();


    $("incomingCallModal")
        .style
        .display =
        "none";


    $("chatCallStatus")
        .style
        .display =
        "block";


    $("chatCallStatus")
        .textContent =
        "🔵 Connecting call...";


    try{

        const caller =
            allUsers.find(
                u =>
                    u.id ===
                    call.callerId
            );


        if(caller){

            selectedUser =
                caller;


            $("chatEmpty")
                .style
                .display =
                "none";


            $("chatArea")
                .style
                .display =
                "flex";


            $("chatAvatar")
                .src =
                caller.photoURL ||
                defaultAvatar;


            $("chatUserName")
                .textContent =
                caller.name ||
                "User";


            $("app")
                .classList
                .add("chat-open");

        }


        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:true,

                video:
                    call.type ===
                    "video"

            });


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        peerConnection.ontrack =
            event => {

                remoteStream =
                    event.streams[0];

                $("remoteVideo")
                    .srcObject =
                    remoteStream;

            };


        peerConnection.onicecandidate =
            async event => {

                if(
                    event.candidate
                ){

                    await db
                        .collection("calls")
                        .doc(
                            call.callId
                        )
                        .collection(
                            "receiverCandidates"
                        )
                        .add(
                            event.candidate
                            .toJSON()
                        );

                }

            };


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    call.offer
                )
            );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await db
            .collection("calls")
            .doc(
                call.callId
            )
            .update({

                answer:{

                    type:
                        answer.type,

                    sdp:
                        answer.sdp

                },

                status:
                    "connected"

            });


        listenCallerCandidates(
            call.callId
        );


        $("localVideo")
            .srcObject =
            localStream;


        $("videoModal")
            .style
            .display =
            "block";


        $("chatCallStatus")
            .textContent =
            "🔵 Call connected";


        incomingCallData =
            null;


    }catch(error){

        console.error(
            error
        );


        alert(
            "Could not answer call: " +
            error.message
        );


        cleanupCall();

    }

}


/* =====================================================
   LISTEN CALLER CANDIDATES
===================================================== */

function listenCallerCandidates(
    callId
){

    const unsubscribe =
        db
        .collection("calls")
        .doc(callId)
        .collection(
            "callerCandidates"
        )
        .onSnapshot(
            snapshot => {

                snapshot
                    .docChanges()
                    .forEach(
                        async change => {

                            if(
                                change.type ===
                                "added" &&
                                peerConnection
                            ){

                                try{

                                    await peerConnection
                                        .addIceCandidate(
                                            new RTCIceCandidate(
                                                change.doc.data()
                                            )
                                        );

                                }catch(error){

                                    console.error(
                                        error
                                    );

                                }

                            }

                        }
                    );

            }
        );


    callUnsubscribers.push(
        unsubscribe
    );

}


/* =====================================================
   REJECT INCOMING CALL
===================================================== */

async function rejectIncomingCall(){

    stopRingtone();


    if(!incomingCallData)
        return;


    try{

        await db
            .collection("calls")
            .doc(
                incomingCallData.callId
            )
            .update({

                status:
                    "rejected"

            });

    }catch(error){

        console.error(
            error
        );

    }


    incomingCallData =
        null;


    currentCallId =
        null;


    $("incomingCallModal")
        .style
        .display =
        "none";


    $("chatCallStatus")
        .style
        .display =
        "none";

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

    stopRingtone();


    try{

        if(currentCallId){

            await db
                .collection("calls")
                .doc(
                    currentCallId
                )
                .update({

                    status:
                        "ended"

                });

        }

    }catch(error){

        console.error(
            error
        );

    }


    cleanupCall();

}


/* =====================================================
   CLEANUP CALL
===================================================== */

function cleanupCall(){

    stopRingtone();


    callUnsubscribers
        .forEach(
            unsubscribe => {

                try{

                    unsubscribe();

                }catch(e){}

            }
        );


    callUnsubscribers =
        [];


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(e){}

    }


    localStream =
        null;

    remoteStream =
        null;

    peerConnection =
        null;

    currentCallId =
        null;

    incomingCallData =
        null;


    $("localVideo")
        .srcObject =
        null;


    $("remoteVideo")
        .srcObject =
        null;


    $("videoModal")
        .style
        .display =
        "none";


    $("incomingCallModal")
        .style
        .display =
        "none";


    $("chatCallStatus")
        .style
        .display =
        "none";

}


/* =====================================================
   MOBILE KEYBOARD
===================================================== */

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        () => {

            document.documentElement
                .style
                .setProperty(
                    "--keyboard-height",
                    Math.max(
                        0,
                        window.innerHeight -
                        window.visualViewport.height
                    ) +
                    "px"
                );

        }
    );

}


/* =====================================================
   INITIAL
===================================================== */

showLogin();
