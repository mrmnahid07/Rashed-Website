<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Messenger</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:#eef2f7;
 color:#172033;
}

button,input{
 font-family:inherit;
}

button{
 cursor:pointer;
 border:0;
}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#0084ff,#006aff,#7c3aed);
}

.auth-box{
 width:420px;
 max-width:100%;
 background:white;
 padding:35px;
 border-radius:25px;
 box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo{
 width:74px;
 height:74px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:22px;
 background:linear-gradient(135deg,#0084ff,#006aff);
 color:white;
 font-size:38px;
 font-weight:bold;
 box-shadow:0 10px 25px rgba(0,132,255,.3);
}

.auth-box h1{
 text-align:center;
 margin-top:15px;
}

.auth-box p{
 text-align:center;
 color:#718096;
 margin:8px 0 25px;
}

input{
 width:100%;
 padding:13px;
 border:1px solid #d9deea;
 border-radius:12px;
 margin-bottom:12px;
 outline:none;
}

input:focus{
 border-color:#0084ff;
 box-shadow:0 0 0 3px rgba(0,132,255,.08);
}

button{
 padding:13px;
 border-radius:12px;
 background:#0084ff;
 color:white;
 font-weight:bold;
}

button:hover{
 opacity:.93;
}

.switch{
 text-align:center;
 color:#0084ff;
 cursor:pointer;
 margin-top:14px;
 font-weight:bold;
}

#authError{
 min-height:20px;
}

.app{
 display:none;
 height:100vh;
 overflow:hidden;
 background:#fff;
}

.sidebar{
 width:350px;
 background:white;
 border-right:1px solid #e4e8f0;
 display:flex;
 flex-direction:column;
}

.top{
 padding:18px;
 border-bottom:1px solid #edf0f5;
}

.my-profile{
 display:flex;
 align-items:center;
 gap:12px;
}

.avatar{
 width:48px;
 height:48px;
 border-radius:50%;
 object-fit:cover;
 background:#e7edf5;
 border:1px solid #e1e6ee;
}

.profile-info{
 flex:1;
 min-width:0;
}

.profile-info strong{
 display:block;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.online{
 color:#16a34a;
 font-size:12px;
}

.search{
 margin-top:15px;
}

.search input{
 margin:0;
 background:#f0f2f5;
 border:0;
 border-radius:22px;
 padding:12px 16px;
}

.nav-tabs{
 display:flex;
 gap:6px;
 margin-top:12px;
}

.nav-tabs button{
 flex:1;
 padding:10px 5px;
 background:#f0f2f5;
 color:#4b5563;
 font-size:12px;
}

.nav-tabs button.active{
 background:#0084ff;
 color:white;
}

.users{
 flex:1;
 overflow:auto;
}

.user{
 padding:12px 16px;
 display:flex;
 gap:12px;
 align-items:center;
 cursor:pointer;
 border-bottom:1px solid #f3f4f6;
}

.user:hover,
.user.active{
 background:#eef6ff;
}

.info{
 flex:1;
 min-width:0;
}

.info strong{
 display:block;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.last{
 font-size:12px;
 color:#8a94a6;
 margin-top:3px;
}

.user-action{
 flex-shrink:0;
}

.user-action button{
 padding:8px 11px;
 border-radius:18px;
 font-size:11px;
}

.add-btn{
 background:#0084ff;
}

.sent-btn{
 background:#e5e7eb;
 color:#374151;
}

.friend-btn{
 background:#16a34a;
}

.accept-btn{
 background:#16a34a;
 margin-right:4px;
}

.reject-btn{
 background:#ef4444;
}

.empty-list{
 padding:35px 20px;
 text-align:center;
 color:#8993a5;
}

.chat{
 flex:1;
 display:flex;
 flex-direction:column;
 min-width:0;
}

.chat-header{
 height:76px;
 padding:12px 20px;
 background:white;
 border-bottom:1px solid #e5e9f0;
 display:flex;
 align-items:center;
 gap:12px;
}

.chat-user{
 flex:1;
 min-width:0;
}

.chat-user strong{
 display:block;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.call-buttons{
 display:flex;
 gap:8px;
}

.call-buttons button{
 width:44px;
 height:44px;
 padding:0;
 border-radius:50%;
 background:#eef6ff;
 color:#0084ff;
}

.messages{
 flex:1;
 padding:20px;
 overflow:auto;
 background:#f5f7fb;
}

.empty{
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#8993a5;
 text-align:center;
}

.msg{
 display:flex;
 margin-bottom:12px;
}

.msg.mine{
 justify-content:flex-end;
}

.bubble{
 max-width:70%;
 padding:11px 14px;
 border-radius:18px;
 background:white;
 box-shadow:0 2px 8px rgba(0,0,0,.05);
 position:relative;
 word-break:break-word;
}

.mine .bubble{
 background:#0084ff;
 color:white;
}

.bubble img,
.bubble video{
 max-width:260px;
 max-height:300px;
 border-radius:12px;
 display:block;
 cursor:pointer;
}

.bubble audio{
 max-width:250px;
}

.time{
 display:block;
 font-size:10px;
 opacity:.65;
 margin-top:5px;
}

.delete-btn{
 background:transparent;
 color:inherit;
 padding:0;
 margin:5px 0 0;
 font-size:11px;
}

.composer{
 background:white;
 padding:12px;
 display:flex;
 gap:8px;
 align-items:center;
 border-top:1px solid #edf0f5;
}

.composer input{
 flex:1;
 margin:0;
 border-radius:24px;
 background:#f0f2f5;
 border:0;
}

.icon-btn{
 width:44px!important;
 height:44px;
 padding:0;
 margin:0;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
}

.send{
 width:50px!important;
}

.recording{
 background:#dc2626!important;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:90;
 background:rgba(0,0,0,.5);
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-box{
 background:white;
 width:400px;
 max-width:100%;
 padding:25px;
 border-radius:20px;
 box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-box button{
 width:100%;
 margin-top:6px;
}

.close{
 background:#64748b!important;
}

.incoming-call{
 display:none;
 position:fixed;
 inset:0;
 z-index:120;
 background:rgba(15,23,42,.72);
 align-items:center;
 justify-content:center;
 padding:20px;
}

.incoming-box{
 width:350px;
 max-width:100%;
 background:white;
 border-radius:25px;
 padding:30px 25px;
 text-align:center;
 box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.incoming-avatar{
 width:85px;
 height:85px;
 border-radius:50%;
 object-fit:cover;
 margin-bottom:15px;
}

.incoming-box h2{
 margin-bottom:7px;
}

.incoming-box p{
 color:#64748b;
 margin-bottom:20px;
}

.incoming-actions{
 display:flex;
 gap:10px;
}

.incoming-actions button{
 flex:1;
}

.accept-call{
 background:#16a34a;
}

.reject-call{
 background:#dc2626;
}

.call-screen{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#111827;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}

.call-screen video{
 width:90%;
 max-width:900px;
 max-height:70vh;
 background:black;
 border-radius:20px;
}

.local-video{
 position:absolute!important;
 right:20px;
 bottom:90px;
 width:180px!important;
 height:130px;
 object-fit:cover;
 border:2px solid white;
}

.call-controls{
 position:absolute;
 bottom:25px;
 display:flex;
 gap:10px;
}

.call-controls button{
 width:55px;
 height:55px;
 border-radius:50%;
 padding:0;
}

.end{
 background:#dc2626!important;
}

.mobile-back{
 display:none;
 width:40px;
}

#typingStatus{
 color:#0084ff;
 font-size:11px;
}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 z-index:300;
 background:#111827;
 color:white;
 padding:13px 18px;
 border-radius:12px;
 display:none;
 box-shadow:0 10px 30px rgba(0,0,0,.25);
 max-width:300px;
}

.badge{
 background:#ef4444;
 color:white;
 min-width:18px;
 height:18px;
 border-radius:50%;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 font-size:10px;
 margin-left:3px;
}

@media(max-width:700px){

 .sidebar{
  width:100%;
 }

 .chat{
  display:none;
 }

 .app.chat-open .sidebar{
  display:none;
 }

 .app.chat-open .chat{
  display:flex;
 }

 .mobile-back{
  display:block;
  background:#eef2f5;
  color:#172033;
  padding:8px;
 }

 .bubble{
  max-width:85%;
 }

 .call-buttons button{
  width:40px;
  height:40px;
 }

 .chat-header{
  padding:10px;
 }

 .composer{
  padding:8px;
 }

 .composer input{
  min-width:0;
 }

 .nav-tabs button{
  font-size:11px;
 }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="auth" id="authScreen">

 <div class="auth-box">

  <div class="logo">M</div>

  <h1>Smart Messenger</h1>

  <p id="authTitle">Create your account</p>

  <div id="registerFields">
   <input id="name" placeholder="Your name">
  </div>

  <input id="email" type="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button onclick="authAction()" id="authButton">
   Create Account
  </button>

  <div class="switch"
  onclick="toggleAuth()"
  id="switchText">
   Already have an account? Login
  </div>

  <div id="authError"
  style="color:#dc2626;text-align:center;margin-top:12px">
  </div>

 </div>
</div>


<!-- ================= APP ================= -->

<div class="app" id="app">

 <div class="sidebar">

  <div class="top">

   <div class="my-profile">

    <img class="avatar" id="myAvatar">

    <div class="profile-info">
     <strong id="myName">User</strong>
     <span class="online">● Online</span>
    </div>

    <button
    style="width:42px;padding:10px"
    onclick="openProfile()">
     ⚙
    </button>

   </div>

   <div class="search">
    <input
    id="searchUsers"
    placeholder="Search people..."
    oninput="searchUsers()">
   </div>

   <div class="nav-tabs">

    <button id="tabPeople"
    class="active"
    onclick="changeTab('people')">
     🔎 People
    </button>

    <button id="tabFriends"
    onclick="changeTab('friends')">
     👥 Friends
    </button>

    <button id="tabRequests"
    onclick="changeTab('requests')">
     📨 Requests
     <span id="requestBadge"></span>
    </button>

   </div>

   <button
   onclick="logout()"
   style="width:100%;margin-top:10px;background:#dc2626">
    Logout
   </button>

  </div>

  <div class="users" id="users"></div>

 </div>


 <!-- ================= CHAT ================= -->

 <div class="chat">

  <div class="chat-header">

   <button
   class="mobile-back"
   onclick="closeChat()">
    ←
   </button>

   <img class="avatar" id="chatAvatar">

   <div class="chat-user">

    <strong id="chatName">
     Select a friend
    </strong>

    <div class="last" id="chatStatus"></div>

    <div id="typingStatus"></div>

   </div>

   <div class="call-buttons">

    <button onclick="startCall(false)">
     📞
    </button>

    <button onclick="startCall(true)">
     📹
    </button>

   </div>

  </div>

  <div class="messages" id="messages">

   <div class="empty">
    <div>
     <h3>Welcome to Smart Messenger</h3>
     <br>
     Add a friend and start chatting.
    </div>
   </div>

  </div>

  <div class="composer">

   <label class="icon-btn"
   style="background:#0084ff;color:white">

    📎

    <input
    type="file"
    id="fileInput"
    accept="image/*,video/*"
    style="display:none"
    onchange="sendFile(event)">

   </label>

   <button
   class="icon-btn"
   id="voiceButton"
   onclick="toggleRecording()">
    🎤
   </button>

   <input
   id="messageInput"
   placeholder="Write a message..."
   onkeydown="handleEnter(event)"
   oninput="typing()">

   <button
   class="icon-btn send"
   onclick="sendMessage()">
    ➤
   </button>

  </div>

 </div>
</div>


<!-- ================= PROFILE ================= -->

<div class="modal" id="profileModal">

 <div class="modal-box">

  <h2>My Profile</h2>

  <br>

  <img
  class="avatar"
  id="profilePreview"
  style="width:90px;height:90px;display:block;margin:auto">

  <br>

  <input
  id="profileName"
  placeholder="Name">

  <input
  id="profileAbout"
  placeholder="About">

  <input
  type="file"
  id="profilePhoto"
  accept="image/*">

  <button onclick="saveProfile()">
   Save Profile
  </button>

  <button
  class="close"
  onclick="closeProfile()">
   Close
  </button>

 </div>
</div>


<!-- ================= INCOMING CALL ================= -->

<div class="incoming-call" id="incomingCall">

 <div class="incoming-box">

  <img
  class="incoming-avatar"
  id="incomingAvatar">

  <h2 id="incomingName">
   Incoming Call
  </h2>

  <p id="incomingType">
   Incoming voice call
  </p>

  <div class="incoming-actions">

   <button
   class="accept-call"
   onclick="acceptIncomingCall()">
    📞 Accept
   </button>

   <button
   class="reject-call"
   onclick="rejectIncomingCall()">
    ❌ Reject
   </button>

  </div>

 </div>
</div>


<!-- ================= CALL ================= -->

<div class="call-screen" id="callScreen">

 <video
 id="remoteVideo"
 autoplay
 playsinline>
 </video>

 <video
 id="localVideo"
 class="local-video"
 autoplay
 muted
 playsinline>
 </video>

 <div
 id="callText"
 style="color:white;font-size:20px;margin-bottom:20px">
  Calling...
 </div>

 <div class="call-controls">

  <button onclick="toggleMic()">
   🎙️
  </button>

  <button onclick="toggleCamera()">
   📹
  </button>

  <button
  class="end"
  onclick="endCall()">
   ☎
  </button>

 </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

 apiKey:
 "AIzaSyDjgt2oKenX2VokbpurU8DfSYKGLq7Wfuc",

 authDomain:
 "smart-store-2e455.firebaseapp.com",

 projectId:
 "smart-store-2e455",

 storageBucket:
 "smart-store-2e455.firebasestorage.app",

 messagingSenderId:
 "498458496108",

 appId:
 "1:498458496108:web:989851f4be63cbcc7a1c49"

};


/* =====================================================
   FIREBASE INIT
===================================================== */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

const storage = firebase.storage();


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let selectedUser = null;

let unsubscribeMessages = null;

let unsubscribeTyping = null;

let unsubscribeUsers = null;

let unsubscribeIncomingCalls = null;

let unsubscribeMyRequests = null;

let unsubscribeSentRequests = null;

let unsubscribeFriends = null;

let isRegister = true;

let allUsers = [];

let friendIds = new Set();

let incomingRequests = [];

let sentRequests = [];

let currentTab = "people";

let localStream = null;

let peerConnection = null;

let currentCallId = null;

let currentCallVideo = false;

let mediaRecorder = null;

let audioChunks = [];

let typingTimer;

let callListeners = [];

let pendingIncomingCall = null;


/* =====================================================
   DEFAULT AVATAR
   External placeholder ব্যবহার করা হয়নি
===================================================== */

function avatarSVG(name="User"){

 const letter =
 String(name || "U")
 .trim()
 .charAt(0)
 .toUpperCase() || "U";

 const svg =
 `<svg xmlns="http://www.w3.org/2000/svg"
 width="200" height="200" viewBox="0 0 200 200">
 <rect width="200" height="200" rx="100" fill="#dbeafe"/>
 <text x="100" y="125"
 text-anchor="middle"
 font-size="85"
 font-family="Arial"
 font-weight="bold"
 fill="#2563eb">${letter}</text>
 </svg>`;

 return "data:image/svg+xml;charset=UTF-8,"
 + encodeURIComponent(svg);
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

 const box =
 document.getElementById("toast");

 box.textContent=message;

 box.style.display="block";

 clearTimeout(box._timer);

 box._timer=setTimeout(()=>{

  box.style.display="none";

 },3000);
}


/* =====================================================
   AUTH
===================================================== */

function toggleAuth(){

 isRegister=!isRegister;

 document.getElementById("registerFields")
 .style.display=
 isRegister ? "block":"none";

 document.getElementById("authTitle")
 .textContent=
 isRegister
 ? "Create your account"
 : "Login to Smart Messenger";

 document.getElementById("authButton")
 .textContent=
 isRegister
 ? "Create Account"
 : "Login";

 document.getElementById("switchText")
 .textContent=
 isRegister
 ? "Already have an account? Login"
 : "Don't have an account? Create one";

 document.getElementById("authError")
 .textContent="";

}


async function authAction(){

 const email =
 document.getElementById("email")
 .value.trim();

 const password =
 document.getElementById("password")
 .value;

 const error =
 document.getElementById("authError");

 const button =
 document.getElementById("authButton");

 error.textContent="";

 if(!email || !password){

  error.textContent=
  "Email and password required.";

  return;
 }

 if(password.length<6){

  error.textContent=
  "Password must be at least 6 characters.";

  return;
 }

 button.disabled=true;

 button.textContent=
 isRegister
 ? "Creating..."
 : "Logging in...";

 try{

  if(isRegister){

   const name =
   document.getElementById("name")
   .value.trim();

   if(!name){

    error.textContent=
    "Enter your name.";

    button.disabled=false;

    button.textContent="Create Account";

    return;
   }

   const result =
   await auth
   .createUserWithEmailAndPassword(
    email,
    password
   );

   await db
   .collection("users")
   .doc(result.user.uid)
   .set({

    uid:result.user.uid,

    name:name,

    email:email,

    about:"Available",

    photoURL:"",

    online:true,

    lastSeen:
    firebase.firestore.FieldValue
    .serverTimestamp(),

    createdAt:
    firebase.firestore.FieldValue
    .serverTimestamp()

   });

  }else{

   await auth
   .signInWithEmailAndPassword(
    email,
    password
   );

  }

 }catch(err){

  error.textContent=
  friendlyError(err);

 }finally{

  button.disabled=false;

  button.textContent=
  isRegister
  ? "Create Account"
  : "Login";

 }

}


function friendlyError(err){

 switch(err.code){

  case "auth/email-already-in-use":
   return "This email is already registered.";

  case "auth/invalid-email":
   return "Invalid email address.";

  case "auth/weak-password":
   return "Password should be at least 6 characters.";

  case "auth/invalid-credential":
   return "Wrong email or password.";

  case "auth/user-not-found":
   return "Account not found.";

  case "auth/wrong-password":
   return "Wrong password.";

  case "auth/operation-not-allowed":
   return "Firebase Email/Password Sign-in is not enabled.";

  case "auth/network-request-failed":
   return "Internet connection problem.";

  case "auth/too-many-requests":
   return "Too many attempts. Try again later.";

  case "permission-denied":
   return "Firebase permission denied. Check Firestore rules.";

  default:
   return err.message || "Something went wrong.";

 }

}


/* =====================================================
   AUTH STATE
===================================================== */

auth.onAuthStateChanged(async user=>{

 if(user){

  currentUser=user;

  document.getElementById("authScreen")
  .style.display="none";

  document.getElementById("app")
  .style.display="flex";

  await ensureUserDocument();

  await updateOnline(true);

  await loadMyProfile();

  startRealtimeSystems();

 }else{

  cleanupAllListeners();

  currentUser=null;

  document.getElementById("authScreen")
  .style.display="flex";

  document.getElementById("app")
  .style.display="none";

 }

});


/* =====================================================
   ENSURE USER DOCUMENT
===================================================== */

async function ensureUserDocument(){

 if(!currentUser) return;

 const ref=
 db.collection("users")
 .doc(currentUser.uid);

 const doc=
 await ref.get();

 if(!doc.exists){

  await ref.set({

   uid:currentUser.uid,

   name:
   currentUser.displayName ||
   currentUser.email.split("@")[0],

   email:
   currentUser.email || "",

   about:"Available",

   photoURL:"",

   online:true,

   lastSeen:
   firebase.firestore.FieldValue
   .serverTimestamp(),

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });

 }

}


/* =====================================================
   ONLINE / LAST SEEN
===================================================== */

async function updateOnline(status){

 if(!currentUser) return;

 try{

  await db
  .collection("users")
  .doc(currentUser.uid)
  .set({

   online:status,

   lastSeen:

 );

 if(sent)

/* =====================================================
   SEND FRIEND REQUEST
===================================================== */

async function sendFriendRequest(uid){

 if(!currentUser) return;

 if(uid===currentUser.uid){

  showToast("You cannot add yourself.");

  return;

 }

 if(friendIds.has(uid)){

  showToast("Already friends.");

  return;

 }

 const existing=
 await db
 .collection("friendRequests")
 .doc(
  requestId(
   currentUser.uid,
   uid
  )
 )
 .get();

 if(
  existing.exists &&
  existing.data().status==="pending"
 ){

  showToast("Friend request already sent.");

  return;

 }

 /*
 Incoming pending থাকলে automatically accept করার
 সুযোগ দেওয়া হচ্ছে।
 */

 const reverse=
 await db
 .collection("friendRequests")
 .doc(
  requestId(
   uid,
   currentUser.uid
  )
 )
 .get();

 if(
  reverse.exists &&
  reverse.data().status==="pending"
 ){

  await acceptFriendRequest(
   reverse.id,
   uid
  );

  return;

 }

 try{

  await db
  .collection("friendRequests")
  .doc(
   requestId(
    currentUser.uid,
    uid
   )
  )
  .set({

   fromUid:currentUser.uid,

   toUid:uid,

   status:"pending",

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });

  showToast("Friend request sent ✓");

 }catch(err){

  showToast(
   "Could not send request: "+
   err.message
  );

 }

}

/* =====================================================
   ACCEPT REQUEST
===================================================== */

async function acceptFriendRequest(
 reqDocId,
 otherUid
){

 if(!currentUser) return;

 try{

  const batch=
  db.batch();

  const friendRef=
  db
  .collection("friends")
  .doc(
   friendshipId(
    currentUser.uid,
    otherUid
   )
  );

  batch.set(
   friendRef,
   {

    users:[
     currentUser.uid,
     otherUid
    ],

    createdAt:
    firebase.firestore.FieldValue
    .serverTimestamp()

   },
   {merge:true}
  );

  const requestRef=
  db
  .collection("friendRequests")
  .doc(reqDocId);

  batch.update(
   requestRef,
   {

    status:"accepted",

    acceptedAt:
    firebase.firestore.FieldValue
    .serverTimestamp()

   }
  );

  await batch.commit();

  showToast("Friend added successfully ✓");

 }catch(err){

  showToast(
   "Accept failed: "+
   err.message
  );

 }

}

  .add({

/* =====================================================
   VOICE MESSAGE
===================================================== */

async function toggleRecording(){

 if(!selectedUser){

  alert("Select a friend first.");

  return;

 }

 if(
  !friendIds.has(selectedUser.id)
 ){

  alert("You can only send voice to friends.");

  return;

 }

 if(
  mediaRecorder &&
  mediaRecorder.state==="recording"
 ){

  mediaRecorder.stop();

  document.getElementById("voiceButton")
  .classList.remove("recording");

  document.getElementById("voiceButton")
  .textContent="🎤";

  return;

 }

 try{

  const stream=
  await navigator.mediaDevices
  .getUserMedia({
   audio:true
  });

  audioChunks=[];

  mediaRecorder=
  new MediaRecorder(stream);

  mediaRecorder.ondataavailable=e=>{

   if(e.data.size>0){

    audioChunks.push(e.data);

   }

  };

  mediaRecorder.onstop=async()=>{

   stream.getTracks()
   .forEach(track=>track.stop());

   const blob=
   new Blob(
    audioChunks,
    {type:"audio/webm"}
   );

   try{

    const path=
    `voice/${currentUser.uid}/`
    +Date.now()+".webm";

    const ref=
    storage.ref(path);

    await ref.put(blob);

    const url=
    await ref.getDownloadURL();

    const chat=
    chatId(
     currentUser.uid,
     selectedUser.id
    );

    await db
    .collection("chats")
    .doc(chat)
    .collection("messages")
    .add({

     senderId:
     currentUser.uid,

     receiverId:
     selectedUser.id,

     type:"audio",

     url:url,

     createdAt:
     firebase.firestore.FieldValue
     .serverTimestamp()

    });

   }catch(err){

    alert(err.message);

   }

  };

  mediaRecorder.start();

  document.getElementById("voiceButton")
  .classList.add("recording");

  document.getElementById("voiceButton")
  .textContent="⏹";

 }catch(err){

  alert(
   "Microphone permission required."
  );

 }

}

 typingTimer=
 setTimeout(
  stopTyping,
  1200
 );

}


async function stopTyping(){

 if(!selectedUser) return;

 clearTimeout(typingTimer);

 const id=
 chatId(
  currentUser.uid,
  selectedUser.id
 );

 try{

  await db
  .collection("typing")
  .doc(id)
  .set({

   uid:
   currentUser.uid,

   typing:false,

   updatedAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });

 }catch(e){

  console.log(e);

 }

}


function listenTyping(){

 if(unsubscribeTyping)
  unsubscribeTyping();

 if(!selectedUser) return;

 const id=
 chatId(
  currentUser.uid,
  selectedUser.id
 );

 unsubscribeTyping=
 db
 .collection("typing")
 .doc(id)
 .onSnapshot(doc=>{

  const box=
  document.getElementById(
   "typingStatus"
  );

  if(!doc.exists){

async function saveProfile(){

 const name=
 document.getElementById("profileName")
 .value.trim();

 const about=
 document.getElementById("profileAbout")
 .value.trim();

 if(!name){

  alert("Name required.");

  return;

 }

 const file=
 document.getElementById("profilePhoto")
 .files[0];

 let photoURL="";

 try{

  const old=
  await db
  .collection("users")
  .doc(currentUser.uid)
  .get();

  if(old.exists){

   photoURL=
   old.data().photoURL || "";

  }

  if(file){

   if(file.size>5*1024*1024){

    alert(
     "Profile image maximum 5MB."
    );

    return;

   }

   if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    return;

   }

   const ref=
   storage.ref(
    `profiles/${currentUser.uid}`
   );

   await ref.put(file);

   photoURL=
   await ref.getDownloadURL();

  }

  await db
  .collection("users")
  .doc(currentUser.uid)
  .set({

   name:name,

   about:about,

   photoURL:photoURL

  },{merge:true});

  document.getElementById("myName")
  .textContent=name;

  document.getElementById("myAvatar")
  .src=
  photoURL ||
  avatarSVG(name);

  closeProfile();

  showToast("Profile updated ✓");

 }catch(err){

  alert(err.message);

 }

}


/* =====================================================
   WEBRTC
===================================================== */

const rtcConfig={

 iceServers:[

  {
   urls:
   "stun:stun.l.google.com:19302"
  },

  {
   urls:
   "stun:stun1.l.google.com:19302"
  }

 ]

};


/* =====================================================
   CLEAN CALL LISTENERS
===================================================== */

function cleanupCallListeners(){

 callListeners.forEach(
  unsub=>{
   try{
    if(typeof unsub==="function")
     unsub();
   }catch(e){}
  }
 );

 callListeners=[];

}


/* =====================================================
   START CALL
===================================================== */

async function startCall(video){

 if(!selectedUser){

  alert("Select a friend first.");

  return;

 }

 if(!friendIds.has(selectedUser.id)){

  alert("You can only call friends.");

  return;

 }

 if(
  currentCallId ||
  peerConnection
 ){

  showToast("A call is already active.");

  return;

 }

 currentCallVideo=video;

 currentCallId=
 db.collection("calls")
 .doc().id;

 try{

  localStream=
  await navigator.mediaDevices
  .getUserMedia({

   audio:true,

   video:video

  });

  document.getElementById("localVideo")
  .srcObject=localStream;

  document.getElementById("localVideo")
  .style.display=
  video ? "block":"none";

  peerConnection=
  new RTCPeerConnection(
   rtcConfig
  );

  localStream
  .getTracks()
  .forEach(track=>{

   peerConnection.addTrack(
    track,
    localStream
   );

  });

  peerConnection.ontrack=e=>{

   document.getElementById(
    "remoteVideo"
   ).srcObject=
   e.streams[0];

  };

  const callRef=
  db.collection("calls")
  .doc(currentCallId);

  const offerCandidates=
  callRef.collection(
   "offerCandidates"
  );

  const answerCandidates=
  callRef.collection(
   "answerCandidates"
  );

  peerConnection.onicecandidate=e=>{

   if(e.candidate){

    offerCandidates.add(
     e.candidate.toJSON()
    );

   }

  };

  const offer=
  await peerConnection
  .createOffer();

  await peerConnection
  .setLocalDescription(offer);

  await callRef.set({

   callerId:
   currentUser.uid,

   receiverId:
   selectedUser.id,

   video:video,

   offer:{

    type:offer.type,

    sdp:offer.sdp

   },

   status:"calling",

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });

  const unsubCandidates=
  answerCandidates
  .onSnapshot(snapshot=>{

   snapshot.docChanges()
   .forEach(change=>{

    if(
     change.type==="added" &&
     peerConnection
    ){

     peerConnection
     .addIceCandidate(
      new RTCIceCandidate(
       change.doc.data()
      )
     )
     .catch(()=>{});

    }

   });

  });

  const unsubCall=
  callRef.onSnapshot(
  async snapshot=>{

   const data=
   snapshot.data();

   if(!data) return;

   if(
    data.answer &&
    peerConnection &&
    !peerConnection
    .currentRemoteDescription
   ){

    try{

     await peerConnection
     .setRemoteDescription(
      new RTCSessionDescription(
       data.answer
      )
     );

    }catch(e){

     console.log(e);

    }

   }

   if(
    data.status==="connected"
   ){

    document.getElementById(
     "callText"
    ).textContent="Connected";

   }

   if(
    data.status==="ended"
   ){

    endCallLocal();

   }

  });

  callListeners.push(
   unsubCandidates,
   unsubCall
  );

  showCallScreen(
   "Calling "+selectedUser.name
  );

 }catch(err){

  endCallLocal();

  alert(
   "Camera/Microphone error: "+
   err.message
  );

 }

}


/* =====================================================
   INCOMING CALL LISTENER
===================================================== */

function listenForCalls(){

 if(unsubscribeIncomingCalls)
  unsubscribeIncomingCalls();

 if(!currentUser) return;

 unsubscribeIncomingCalls=
 db.collection("calls")
 .where(
  "receiverId",
  "==",
  currentUser.uid
 )
 .where(
  "status",
  "==",
  "calling"
 )
 .onSnapshot(snapshot=>{

  snapshot.docChanges()
  .forEach(change=>{

   if(
    change.type==="added"
   ){

    const data=
    change.doc.data();

    if(
     pendingIncomingCall &&
     pendingIncomingCall.id===
     change.doc.id
    ){

     return;

    }

    receiveCall(
     change.doc.id,
     data
    );

   }

  });

 },err=>{

  console.log(
   "Call listener:",
   err
  );

 });

}


/* =====================================================
   SHOW INCOMING CALL
===================================================== */

async function receiveCall(
 callId,
 data
){

 if(
  currentCallId ||
  peerConnection
 ){

  await db
  .collection("calls")
  .doc(callId)
  .update({
   status:"ended"
  })
  .catch(()=>{});

  return;

 }

 let caller={};

 try{

  const doc=
  await db
  .collection("users")
  .doc(data.callerId)
  .get();

  if(doc.exists)
   caller=doc.data();

 }catch(e){

  console.log(e);

 }

 pendingIncomingCall={
  id:callId,
  data:data,
  caller:caller
 };

 document.getElementById(
  "incomingAvatar"
 ).src=
 caller.photoURL ||
 avatarSVG(caller.name);

 document.getElementById(
  "incomingName"
 ).textContent=
 caller.name ||
 "Unknown User";

 document.getElementById(
  "incomingType"
 ).textContent=
 data.video
 ? "Incoming video call"
 : "Incoming voice call";

 document.getElementById(
  "incomingCall"
 ).style.display="flex";

}


/* =====================================================
   ACCEPT INCOMING CALL
===================================================== */

async function acceptIncomingCall(){

 if(!pendingIncomingCall)
  return;

 const call=
 pendingIncomingCall;

 pendingIncomingCall=null;

 document.getElementById(
  "incomingCall"
 ).style.display="none";

 await receiveCallAccepted(
  call.id,
  call.data
 );

}


/* =====================================================
   ACCEPT CALL PROCESS
===================================================== */

async function receiveCallAccepted(
 callId,
 data
){

 currentCallId=callId;

 currentCallVideo=
 data.video;

 try{

  localStream=
  await navigator.mediaDevices
  .getUserMedia({

   audio:true,

   video:data.video

  });

  document.getElementById(
   "localVideo"
  ).srcObject=
  localStream;

  document.getElementById(
   "localVideo"
  ).style.display=
  data.video
  ? "block"
  : "none";

  peerConnection=
  new RTCPeerConnection(
   rtcConfig
  );

  localStream
  .getTracks()
  .forEach(track=>{

   peerConnection.addTrack(
    track,
    localStream
   );

  });

  peerConnection.ontrack=e=>{

   document.getElementById(
    "remoteVideo"
   ).srcObject=
   e.streams[0];

  };

  const callRef=
  db.collection("calls")
  .doc(callId);

  const offerCandidates=
  callRef.collection(
   "offerCandidates"
  );

  const answerCandidates=
  callRef.collection(
   "answerCandidates"
  );

  peerConnection.onicecandidate=e=>{

   if(e.candidate){

    answerCandidates.add(
     e.candidate.toJSON()
    );

   }

  };

  await peerConnection
  .setRemoteDescription(
   new RTCSessionDescription(
    data.offer
   )
  );

  const answer=
  await peerConnection
  .createAnswer();

  await peerConnection
  .setLocalDescription(answer);

  await callRef.update({

   answer:{

    type:answer.type,

    sdp:answer.sdp

   },

   status:"connected"

  });

  const unsubCandidates=
  offerCandidates
  .onSnapshot(snapshot=>{

   snapshot.docChanges()
   .forEach(change=>{

    if(
     change.type==="added" &&
     peerConnection
    ){

     peerConnection
     .addIceCandidate(
      new RTCIceCandidate(
       change.doc.data()
      )
     )
     .catch(()=>{});

    }

   });

  });

  const unsubCall=
  callRef.onSnapshot(snapshot=>{

   const d=
   snapshot.data();

   if(
    d &&
    d.status==="ended"
   ){

    endCallLocal();

   }

  });

  callListeners.push(
   unsubCandidates,
   unsubCall
  );

  showCallScreen(
   "Connected"
  );

 }catch(err){

  endCallLocal();

  alert(
   "Camera/Microphone error: "+
   err.message
  );

 }

}

function toggleMic(){

 localStream
 .getAudioTracks()
 .forEach(track=>{

  track.enabled=
  !track.enabled;

 });

}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

 localStream
 .getVideoTracks()
 .forEach(track=>{

  track.enabled=
  !track.enabled;

 });

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

 const id=
 currentCallId;

 if(id){

  try{

   await db
   .collection("calls")
   .doc(id)
   .set({

    status:"ended"

   },{merge:true});

  }catch(e){

   console.log(e);

  }

 }

 endCallLocal();

}


function endCallLocal(){

 cleanupCallListeners();

 if(localStream){

  localStream
  .getTracks()
  .forEach(track=>{

   track.stop();

  });

 }

 if(peerConnection){

  try{

   peerConnection.close();

  }catch(e){}

 }

 localStream=null;

 peerConnection=null;

 currentCallId=null;

 currentCallVideo=false;

 document.getElementById(
  "remoteVideo"
 ).srcObject=null;

 document.getElementById(
  "localVideo"
 ).srcObject=null;

 document.getElementById(
  "callScreen"
 ).style.display="none";

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(str){

 return String(str ?? "")

 .replaceAll("&","&amp;")

 .replaceAll("<","&lt;")

 .replaceAll(">","&gt;")

 .replaceAll('"',"&quot;")

 .replaceAll("'","&#039;");

}
