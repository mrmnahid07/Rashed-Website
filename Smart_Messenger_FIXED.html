        text.textContent =
            data.text ||
            "";

        bubble.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            data.createdAt
        );


    bubble.appendChild(
        time
    );


    if(
        data.senderId ===
        currentUser.uid
    ){

        const del =
            document.createElement(
                "span"
            );

        del.className =
            "message-delete";

        del.textContent =
            "Delete";


        del.onclick =
            function(){

                deleteMessage(
                    id
                );

            };


        bubble.appendChild(
            del
        );

    }


    wrap.appendChild(
        bubble
    );


    $("messages")
    .appendChild(
        wrap
    );

};


/* =====================================================
   CALL STATE
===================================================== */

let fixRemoteDescriptionSet =
    false;

let pendingIceCandidates = [];


/* =====================================================
   CREATE PEER CONNECTION
===================================================== */

function createFixedPeerConnection(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onconnectionstatechange =
        function(){

            console.log(
                "Connection:",
                pc.connectionState
            );


            if(
                pc.connectionState ===
                "connected"
            ){

                $("chatCallStatus")
                    .style
                    .display =
                    "block";

                $("chatCallStatus")
                    .textContent =
                    "🔵 Call connected";


                stopRingtone();

            }


            if(
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "disconnected" ||
                pc.connectionState ===
                    "closed"
            ){

                if(
                    pc.connectionState !==
                    "closed"
                ){

                    setTimeout(
                        function(){

                            if(
                                peerConnection ===
                                pc
                            ){

                                cleanupCall();

                            }

                        },
                        1500
                    );

                }

            }

        };


    pc.oniceconnectionstatechange =
        function(){

            console.log(
                "ICE:",
                pc.iceConnectionState
            );

        };


    return pc;

}


/* =====================================================
   FIX START CALL
===================================================== */

window.startCall =
async function(type){

    if(
        !currentUser ||
        !selectedUser
    )
        return;


    if(
        !friendIds.has(
            selectedUser.id
        )
    ){

        alert(
            "You can call only friends."
        );

        return;

    }


    try{

        cleanupCall();


        currentCallId =
            db
            .collection("calls")
            .doc()
            .id;


        const callId =
            currentCallId;


        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                },

                video:
                    type === "video"
                    ? {
                        width:{
                            ideal:1280
                        },
                        height:{
                            ideal:720
                        },
                        facingMode:
                            "user"
                    }
                    : false

            });


        peerConnection =
            createFixedPeerConnection();


        localStream
        .getTracks()
        .forEach(
            function(track){

                peerConnection
                .addTrack(
                    track,
                    localStream
                );

            }
        );


        peerConnection.ontrack =
            function(event){

                if(
                    event.streams &&
                    event.streams[0]
                ){

                    remoteStream =
                        event.streams[0];

                    $("remoteVideo")
                        .srcObject =
                        remoteStream;

                    $("remoteVideo")
                        .play()
                        .catch(()=>{});

                }

            };


        peerConnection.onicecandidate =
            async function(event){

                if(
                    !event.candidate
                )
                    return;


                try{

                    await db
                    .collection("calls")
                    .doc(callId)
                    .collection(
                        "callerCandidates"
                    )
                    .add(
                        event.candidate
                        .toJSON()
                    );

                }catch(error){

                    console.error(
                        error
                    );

                }

            };


        const offer =
            await peerConnection
            .createOffer({

                offerToReceiveAudio:true,

                offerToReceiveVideo:
                    type === "video"

            });


        await peerConnection
        .setLocalDescription(
            offer
        );


        await db
        .collection("calls")
        .doc(callId)
        .set({

            callerId:
                currentUser.uid,

            receiverId:
                selectedUser.id,

            type:
                type,

            offer:{
                type:
                    offer.type,

                sdp:
                    offer.sdp
            },

            status:
                "ringing",

            createdAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        });


        $("localVideo")
            .srcObject =
            localStream;


        if(type === "video"){

            $("videoModal")
                .style
                .display =
                "block";

        }


        showOutgoingCallStatus(
            type
        );


        startOutgoingRingtone();


        listenCallerAnswer(
            callId
        );


        listenReceiverCandidates(
            callId
        );


    }catch(error){

        console.error(
            "CALL ERROR:",
            error
        );


        stopRingtone();


        alert(
            "Call failed: " +
            (
                error.message ||
                error
            )
        );


        cleanupCall();

    }

};

                },

                    ? {

                        },

                            ideal:720
                        },
                        facingMode:
                            "user"
                    }
                    : false

            });


        peerConnection =
            createFixedPeerConnection();


        pendingIceCandidates =
            [];


        peerConnection
        .getSenders();


        localStream
        .getTracks()
        .forEach(
            function(track){

                peerConnection
                .addTrack(
                    track,
                    localStream
                );

            }
        );


        peerConnection.ontrack =
            function(event){

/* =====================================================
   FIX CALLER ANSWER
===================================================== */

window.listenCallerAnswer =
function(callId){

    const unsubscribe =
        db
        .collection("calls")
        .doc(callId)
        .onSnapshot(
            async function(snapshot){

                const data =
                    snapshot.data();


                if(!data)
                    return;


                if(
                    data.answer &&
                    peerConnection
                ){

                    try{

                        if(
                            !peerConnection
                            .currentRemoteDescription
                        ){

                            await peerConnection
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data.answer
                                )
                            );


                            $("chatCallStatus")
                                .textContent =
                                "🔵 Call connected";


                            stopRingtone();

                        }

                    }catch(error){

                        console.error(
                            "Remote description error:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    stopRingtone();

                    alert(
                        "Call rejected."
                    );

                    cleanupCall();

                }


                if(
                    data.status ===
                    "ended"
                ){

                    cleanupCall();

                }

            }
        );


    callUnsubscribers.push(
        unsubscribe
    );

};


/* =====================================================
   FIX INCOMING CALL DUPLICATE
===================================================== */

const handledCalls =
    new Set();


window.listenForIncomingCalls =
function(){

    if(unsubscribeIncomingCalls){

        unsubscribeIncomingCalls();

    }


    unsubscribeIncomingCalls =
        db
        .collection("calls")
        .where(
            "receiverId",
            "==",
            currentUser.uid
        )
        .onSnapshot(
            function(snapshot){

                snapshot
                .docChanges()
                .forEach(
                    function(change){

                        if(
                            change.type !==
                            "added"
                        )
                            return;


                        const data =
                            change.doc.data();


                        if(
                            data.status !==
                            "ringing"
                        )
                            return;


                        if(
                            handledCalls.has(
                                change.doc.id
                            )
                        )
                            return;


                        handledCalls.add(
                            change.doc.id
                        );


                        showIncomingCall(
                            change.doc.id,
                            data
                        );

                    }
                );

            },
            function(error){

                console.error(
                    "Incoming call listener:",
                    error
                );

            }
        );

};

window.showIncomingCall =
function(

){

};


/* =====================================================
   FIX REJECT
===================================================== */

window.rejectIncomingCall =
async function(){

    stopRingtone();


    const call =
        incomingCallData;


    if(call){

        try{

            await db
            .collection("calls")
            .doc(call.callId)
            .update({

                status:
                    "rejected"

            });

        }catch(error){

            console.error(error);

        }

    }


    incomingCallData =
        null;

    currentCallId =
        null;


    $("incomingCallModal")
        .style
        .display =
        "none";


    $("chatCallStatus")
        .style
        .display =
        "none";

};


/* =====================================================
   FIX END CALL
===================================================== */

window.endCall =
async function(){

    stopRingtone();


    try{

        if(currentCallId){

            await db
            .collection("calls")
            .doc(currentCallId)
            .update({

                status:
                    "ended",

                endedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

        }

    }catch(error){

        console.error(error);

    }


    cleanupCall();

};


/* =====================================================
   FIX CLEANUP
===================================================== */

window.cleanupCall =
function(){

    stopRingtone();


    callUnsubscribers
    .forEach(
        function(unsubscribe){

            try{

                unsubscribe();

            }catch(e){}

        }
    );


    callUnsubscribers =
        [];


    if(localStream){

        localStream
        .getTracks()
        .forEach(
            function(track){

                try{

                    track.stop();

                }catch(e){}

            }
        );

    }


    if(peerConnection){

        try{

            peerConnection.ontrack =
                null;

            peerConnection.onicecandidate =
                null;

            peerConnection.close();

        }catch(e){}

    }


    localStream =
        null;

    remoteStream =
        null;

    peerConnection =
        null;

    currentCallId =
        null;

    incomingCallData =
        null;

    fixRemoteDescriptionSet =
        false;

    pendingIceCandidates =
        [];


    const local =
        $("localVideo");

    const remote =
        $("remoteVideo");


    if(local)
        local.srcObject =
            null;

    if(remote)
        remote.srcObject =
            null;


    $("videoModal")
        .style
        .display =
        "none";


    $("incomingCallModal")
        .style
        .display =
        "none";


    $("chatCallStatus")
        .style
        .display =
        "none";

};

    border:0;background:rgba(0,0,0,.06);border-radius:12px;
    padding:2px 6px;cursor:pointer;font-size:12px;
}
.message-wrap.mine .sm-react{background:rgba(255,255,255,.18)}
.sm-reply-preview{
    font-size:11px;opacity:.75;border-left:3px solid currentColor;
    padding-left:7px;margin-bottom:5px;
}
.sm-file-card{
    display:flex;align-items:center;gap:8px;padding:9px;
    border-radius:10px;background:rgba(0,0,0,.06);
}
.message-wrap.mine .sm-file-card{background:rgba(255,255,255,.15)}
.sm-file-icon{font-size:24px}
.sm-file-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-profile-view .modal-box{max-width:430px}
@media(max-width:700px){
    .sm-extra-tools{padding:7px 9px}
    .sm-extra-btn{font-size:11px}
    .sm-activity-box{max-height:88dvh}
}
</style>

<script>
(function(){
"use strict";

/* ---------- APP ICON / FAVICON ---------- */
const smIconSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
 <rect width="512" height="512" rx="120" fill="#1877f2"/>
 <path fill="#fff" d="M256 92c-92 0-166 64-166 143 0 48 28 91 72 117l-17 68 78-43c11 2 22 3 33 3 92 0 166-64 166-145S348 92 256 92zm-73 145a25 25 0 1 1 0 -50 25 25 0 0 1 0 50zm73 0a25 25 0 1 1 0-50 25 25 0 0 1 0 50zm73 0a25 25 0 1 1 0-50 25 25 0 0 1 0 50z"/>
</svg>`;
const smIconData = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(smIconSvg);
const favicon = document.getElementById("dynamicFavicon");
if(favicon) favicon.href = smIconData;

try{
    const manifest = {
        name:"Smart Messenger",
        short_name:"Messenger",
        start_url:location.href.split("#")[0],
        display:"standalone",
        background_color:"#ffffff",
        theme_color:"#1877f2",
        icons:[
            {src:smIconData,sizes:"192x192",type:"image/svg+xml"},
            {src:smIconData,sizes:"512x512",type:"image/svg+xml"}
        ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const manifestEl = document.getElementById("dynamicManifest");
    if(manifestEl) manifestEl.href = manifestURL;
}catch(e){}

/* ---------- EXTRA SIDEBAR TOOLS ---------- */
function addSidebarTools(){
    const sidebar = document.querySelector(".sidebar");
    const tabs = document.querySelector(".tabs");
    if(!sidebar || !tabs || document.getElementById("smExtraTools")) return;

    const tools = document.createElement("div");
    tools.id = "smExtraTools";
    tools.className = "sm-extra-tools";
    tools.innerHTML = `
        <button class="sm-extra-btn" onclick="openMyProfileCenter()">👤 Profile</button>
        <button class="sm-extra-btn" onclick="openActivityPanel()">🕘 Activity</button>
        <button class="sm-extra-btn" onclick="openInstallHelp()">📱 App</button>
    `;
    tabs.parentNode.insertBefore(tools, tabs);
}
addSidebarTools();

/* ---------- ACTIVITY LOG ---------- */
window.smActivity = window.smActivity || [];

function smActivityText(action, extra){
    const name = (currentProfile && currentProfile.name) || "You";
    return extra ? `${name} ${action} ${extra}` : `${name} ${action}`;
}

window.logActivity = async function(action, extra, targetUid){
    const text = smActivityText(action, extra);
    const item = {
        uid: currentUser ? currentUser.uid : "",
        name: (currentProfile && currentProfile.name) || "User",
        photoURL: (currentProfile && currentProfile.photoURL) || "",
        text,
        action: action || "",
        extra: extra || "",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    smActivity.unshift({...item, createdAt:new Date()});
    if(smActivity.length > 80) smActivity.length = 80;

    if(!currentUser) return;
    try{
        await db.collection("activity").add(item);
    }catch(e){
        console.log("Activity log:",e);
    }
};

window.loadActivity = async function(){
    if(!currentUser) return;
    try{
        const snap = await db.collection("activity")
            .orderBy("createdAt","desc").limit(50).get();
        smActivity = [];
        snap.forEach(doc=>{
            const d = doc.data();
            smActivity.push({id:doc.id,...d});
        });
    }catch(e){
        console.log("Activity load:",e);
    }
};

window.openActivityPanel = async function(){
    let panel = document.getElementById("smActivityPanel");
    if(!panel){
        panel = document.createElement("div");
        panel.id = "smActivityPanel";
        panel.className = "sm-activity-panel";
        panel.innerHTML = `
          <div class="sm-activity-box">
            <div class="sm-panel-head">
              <strong>Activity</strong>
              <button class="sm-close" onclick="closeActivityPanel()">✕</button>
            </div>
            <div id="smActivityList" class="sm-activity-list"></div>
          </div>`;
        panel.addEventListener("click",e=>{
            if(e.target===panel) closeActivityPanel();
        });
        document.body.appendChild(panel);
    }
    await loadActivity();
    renderActivityPanel();
    panel.style.display="flex";
};

window.closeActivityPanel = function(){
    const p=document.getElementById("smActivityPanel");
    if(p) p.style.display="none";
};

function renderActivityPanel(){
    const box=document.getElementById("smActivityList");
    if(!box) return;
    if(!smActivity.length){
        box.innerHTML=`<div style="padding:30px;text-align:center;color:#888">No activity yet.</div>`;
        return;
    }
    box.innerHTML="";
    smActivity.forEach(a=>{
        const row=document.createElement("div");
        row.className="sm-activity-item";
        const img=document.createElement("img");
        img.className="sm-activity-avatar";
        img.src=a.photoURL||defaultAvatar;
        const body=document.createElement("div");
        body.className="sm-activity-text";
        const t=document.createElement("div");
        t.textContent=a.text||"Activity";
        const tm=document.createElement("div");
        tm.className="sm-activity-time";
        tm.textContent=formatTime(a.createdAt)||"Just now";
        body.appendChild(t); body.appendChild(tm);
        row.appendChild(img); row.appendChild(body); box.appendChild(row);
    });
}

/* ---------- INSTALL / APP HELP ---------- */
window.openInstallHelp = async function(){
    if(window.smInstallPrompt){
        try{
            await window.smInstallPrompt.prompt();
            await window.smInstallPrompt.userChoice;
            window.smInstallPrompt=null;
            return;
        }catch(e){}
    }
    alert("App icon system is enabled. For full app installation, open this website through HTTPS or localhost, then use your browser's Install App / Add to Home Screen option.");
};

window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    window.smInstallPrompt=e;
});

/* ---------- PROFILE CENTER ---------- */
window.openMyProfileCenter = function(){
    if(!currentProfile) return;
    let panel=document.getElementById("smProfileView");
    if(!panel){
        panel=document.createElement("div");
        panel.id="smProfileView";
        panel.className="modal sm-profile-view";
        panel.innerHTML=`
          <div class="modal-box">
            <div class="modal-title">My Profile</div>
            <div class="sm-profile-card">
              <img id="smPVAvatar" src="">
              <h3 id="smPVName"></h3>
              <p id="smPVAbout"></p>
              <p id="smPVEmail" style="margin-top:5px;font-size:11px"></p>
              <div class="sm-profile-actions">
                <button class="primary" onclick="closeMyProfileCenter();openProfileModal()">✏️ Edit Profile</button>
                <button onclick="closeMyProfileCenter()">Close</button>
              </div>
            </div>
          </div>`;
        panel.addEventListener("click",e=>{
            if(e.target===panel) closeMyProfileCenter();
        });
        document.body.appendChild(panel);
    }
    document.getElementById("smPVAvatar").src=currentProfile.photoURL||defaultAvatar;
    document.getElementById("smPVName").textContent=currentProfile.name||"User";
    document.getElementById("smPVAbout").textContent=currentProfile.about||"No bio added";
    document.getElementById("smPVEmail").textContent=currentProfile.email||"";
    panel.style.display="flex";
};

window.closeMyProfileCenter=function(){
    const p=document.getElementById("smProfileView");
    if(p) p.style.display="none";
};

/* ---------- MEDIA PREVIEW ---------- */
let smSelectedFile=null;

function addMediaPreview(){
    const composer=document.querySelector(".composer");
    if(!composer || document.getElementById("smMediaPreview")) return;
    const preview=document.createElement("div");
    preview.id="smMediaPreview";
    preview.className="sm-media-preview";
    preview.innerHTML=`
      <div class="sm-media-preview-inner">
        <div id="smPreviewMedia"></div>
        <div class="sm-media-preview-info">
          <b id="smPreviewName">Selected file</b>
          <span id="smPreviewType"></span>
        </div>
        <button class="sm-remove-preview" onclick="clearMediaPreview()">✕</button>
      </div>`;
    composer.parentNode.insertBefore(preview,composer);
}
addMediaPreview();

window.clearMediaPreview=function(){
    smSelectedFile=null;
    const p=document.getElementById("smMediaPreview");
    const input=document.getElementById("fileInput");
    if(p) p.style.display="none";
    if(input) input.value="";
};

function showMediaPreview(file){
    addMediaPreview();
    smSelectedFile=file;
    const p=document.getElementById("smMediaPreview");
    const media=document.getElementById("smPreviewMedia");
    const name=document.getElementById("smPreviewName");
    const type=document.getElementById("smPreviewType");
    media.innerHTML="";
    name.textContent=file.name;
    type.textContent=(file.type||"file")+" • "+Math.round(file.size/1024)+" KB";
    if(file.type.startsWith("image/")){
        const img=document.createElement("img");
        img.src=URL.createObjectURL(file);
        media.appendChild(img);
    }else if(file.type.startsWith("video/")){
        const v=document.createElement("video");
        v.src=URL.createObjectURL(file); v.muted=true;
        media.appendChild(v);
    }else{
        const icon=document.createElement("div");
        icon.style.cssText="font-size:32px;padding:8px";
        icon.textContent=file.type.startsWith("audio/")?"🎵":"📎";
        media.appendChild(icon);
    }
    p.style.display="block";
}

/* File picker preview: non-invasive; original sendFile remains untouched. */
const smFileInput=document.getElementById("fileInput");
if(smFileInput){
    smFileInput.addEventListener("change",function(){
        const file=this.files && this.files[0];
        if(file) showMediaPreview(file);
    });
}

/* ---------- RICH MESSAGE RENDER ---------- */
const originalRenderMessage = window.renderMessage;
window.renderMessage = function(id,data){
    const wrap=document.createElement("div");
    wrap.className="message-wrap "+(data.senderId===currentUser.uid?"mine":"");
    const bubble=document.createElement("div");
    bubble.className="message";

    if(data.replyToText){
        const rp=document.createElement("div");
        rp.className="sm-reply-preview";
        rp.textContent="↩ "+data.replyToText;
        bubble.appendChild(rp);
    }

    if(data.type==="image"){
        const img=document.createElement("img");
        img.src=data.fileUrl; img.alt=data.fileName||"Image";
        img.loading="lazy";
        img.style.cursor="pointer";
        img.onclick=()=>window.open(data.fileUrl,"_blank");
        bubble.appendChild(img);
        if(data.text){
            const t=document.createElement("div");
            t.textContent=data.text; bubble.appendChild(t);
        }
    }else if(data.type==="video"){
        const v=document.createElement("video");
        v.src=data.fileUrl; v.controls=true; v.playsInline=true;
        v.preload="metadata"; bubble.appendChild(v);
    }else if(data.type==="audio"){
        const a=document.createElement("audio");
        a.src=data.fileUrl; a.controls=true; a.preload="metadata";
        a.style.width="230px"; a.style.maxWidth="100%";
        bubble.appendChild(a);
    }else if(data.type==="file"){
        const card=document.createElement("a");
        card.className="sm-file-card";
        card.href=data.fileUrl; card.target="_blank"; card.download=data.fileName||"file";
        card.style.color="inherit"; card.style.textDecoration="none";
        card.innerHTML=`<span class="sm-file-icon">📎</span><span class="sm-file-name"></span>`;
        card.querySelector(".sm-file-name").textContent=data.fileName||"File";
        bubble.appendChild(card);
    }else{
        const t=document.createElement("div");
        t.textContent=data.text||""; bubble.appendChild(t);
    }

    const meta=document.createElement("div");
    meta.className="sm-message-meta";
    const tm=document.createElement("span");
    tm.textContent=formatTime(data.createdAt);
    meta.appendChild(tm);
    if(data.senderId===currentUser.uid){
        const st=document.createElement("span");
        st.className="sm-status";
        st.textContent=data.read ? "✓✓" : "✓";
        meta.appendChild(st);
    }
    bubble.appendChild(meta);

    if(data.senderId===currentUser.uid){
        const del=document.createElement("span");
        del.className="message-delete";
        del.textContent="Delete";
        del.onclick=()=>deleteMessage(id);
        bubble.appendChild(del);
    }

    const react=document.createElement("div");
    react.className="sm-react-row";
    ["❤️","👍","😂","😮"].forEach(emoji=>{
        const b=document.createElement("button");
        b.className="sm-react";
        b.textContent=emoji;
        b.onclick=async()=>{
            try{
                const chat=chatId(currentUser.uid,selectedUser.id);
                await db.collection("chats").doc(chat).collection("messages").doc(id)
                    .set({reaction:emoji},{merge:true});
            }catch(e){console.log(e);}
        };
        react.appendChild(b);
    });
    if(data.reaction){
        const rr=document.createElement("span");
        rr.textContent=data.reaction;
        rr.style.marginLeft="4px";
        react.appendChild(rr);
    }
    bubble.appendChild(react);

    wrap.appendChild(bubble);
    $("messages").appendChild(wrap);
};

/* ---------- ACTIVITY HOOKS (NON-BLOCKING) ----------
   IMPORTANT: core functions are NOT overridden here.
   This keeps Send, media upload, voice upload and profile Save reliable.
*/

function smSafeActivity(action,target){
    try{
        if(typeof logActivity !== "function") return;
        Promise.resolve(logActivity(action,target)).catch(function(err){
            console.warn("Activity log skipped:",err);
        });
    }catch(err){
        console.warn("Activity log skipped:",err);
    }
}

/* Profile rendering remains on the original function. */

/* Load activity after authentication is ready. */
const oldAuthStateHandlerMarker = setInterval(function(){
    if(currentUser){
        loadActivity().catch(()=>{});
        clearInterval(oldAuthStateHandlerMarker);
    }
},1000);

})();
</script>


<!-- =========================================================
     SMART MESSENGER FINAL MEDIA + PROFILE FIX
     Keeps the existing systems and replaces only the broken
     media/profile handlers.
========================================================= -->
<script>
(function () {
    "use strict";

    function smGet(id) {
        return document.getElementById(id);
    }

    function smError(title, error) {
        console.error(title, error);
        const msg = error && error.message ? error.message : String(error || "Unknown error");
        alert(title + "\n\n" + msg);
    }

    /* =====================================================
       FINAL IMAGE / VIDEO / AUDIO SEND
    ===================================================== */
    window.sendFile = async function (event) {
        const input = event && event.target;
        const file = input && input.files && input.files[0];

        if (!file) return;

        if (!currentUser) {
            alert("Please login first.");
            input.value = "";
            return;
        }

        if (!selectedUser) {
            alert("Please open a chat first, then select the picture/video.");
            input.value = "";
            return;
        }

        const isImage = file.type && file.type.startsWith("image/");
        const isVideo = file.type && file.type.startsWith("video/");
        const isAudio = file.type && file.type.startsWith("audio/");

        if (!isImage && !isVideo && !isAudio) {
            alert("Only picture, video and audio files are supported.");
            input.value = "";
            return;
        }

        if (file.size > 100 * 1024 * 1024) {
            alert("File must be smaller than 100MB.");
            input.value = "";
            return;
        }

        try {
            const safeName = (file.name || "file")
                .replace(/[^a-zA-Z0-9._-]/g, "_");

            const type = isImage ? "image" : (isVideo ? "video" : "audio");

            const path =
                "chatFiles/" +
                currentUser.uid +
                "/" +
                Date.now() +
                "_" +
                safeName;

            if (!storage || !db) {
                throw new Error("Firebase Storage/Firestore is not initialized.");
            }

            const storageRef = storage.ref().child(path);

            const metadata = {
                contentType: file.type || "application/octet-stream"
            };

            const upload = await storageRef.put(file, metadata);
            const url = await upload.ref.getDownloadURL();

            const id = chatId(currentUser.uid, selectedUser.id);

            await db
                .collection("chats")
                .doc(id)
                .collection("messages")
                .add({
                    senderId: currentUser.uid,
                    receiverId: selectedUser.id,
                    fileUrl: url,
                    fileName: file.name || "file",
                    type: type,
                    contentType: file.type || "",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

            input.value = "";

            if (typeof clearMediaPreview === "function") {
                clearMediaPreview();
            }

            if (typeof loadMessages === "function") {
                try {
                    await loadMessages();
                } catch (e) {
                    console.warn("Message refresh skipped:", e);
                }
            }

        } catch (error) {
            smError("Picture/Video upload failed.", error);
            if (input) input.value = "";
            if (typeof clearMediaPreview === "function") {
                try { clearMediaPreview(); } catch (e) {}
            }
        }
    };

    /* =====================================================
       FINAL PROFILE SAVE
       - Works even if currentProfile is temporarily null
       - Saves name/about without requiring a photo
       - Uploads photo only when a new photo is selected
       ===================================================== */
    window.saveProfile = async function () {
        if (!currentUser) {
            alert("Please login first.");
            return;
        }

        const nameInput = smGet("profileNameInput");
        const aboutInput = smGet("profileAboutInput");
        const photoInput = smGet("profilePhotoInput");

        if (!nameInput || !aboutInput) {
            alert("Profile form was not found. Please refresh the page.");
            return;
        }

        const name = nameInput.value.trim();
        const about = aboutInput.value.trim();

        if (!name) {
            alert("Name is required.");
            nameInput.focus();
            return;
        }

        try {
            if (!currentProfile) {
                currentProfile = {};
            }

            let photoURL = currentProfile.photoURL || "";
            const file = photoInput && photoInput.files
                ? photoInput.files[0]
                : null;

            if (file) {
                if (!file.type || !file.type.startsWith("image/")) {
                    alert("Please select an image for your profile photo.");
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert("Profile photo must be under 5MB.");
                    return;
                }

                const safeName = (file.name || "profile.jpg")
                    .replace(/[^a-zA-Z0-9._-]/g, "_");

                const path =
                    "profilePhotos/" +
                    currentUser.uid +
                    "/" +
                    Date.now() +
                    "_" +
                    safeName;

                const ref = storage.ref().child(path);

                const upload = await ref.put(file, {
                    contentType: file.type
                });

                photoURL = await upload.ref.getDownloadURL();
            }

            await db
                .collection("users")
                .doc(currentUser.uid)
                .set({
                    name: name,
                    about: about,
                    photoURL: photoURL
                }, {
                    merge: true
                });

            currentProfile.name = name;
            currentProfile.about = about;
            currentProfile.photoURL = photoURL;
            currentProfile.email =
                currentProfile.email ||
                currentUser.email ||
                "";

            /* Update the visible profile immediately */
            const myName = smGet("myName");
            const myAvatar = smGet("myAvatar");

            if (myName) myName.textContent = name;
            if (myAvatar) myAvatar.src = photoURL || defaultAvatar;

            /* Keep existing app functions working */
            if (typeof renderMyProfile === "function") {
                try { renderMyProfile(); } catch (e) {}
            }

            if (typeof loadUsers === "function") {
                try { await loadUsers(); } catch (e) {}
            }

            if (typeof loadFriends === "function") {
                try { await loadFriends(); } catch (e) {}
            }

            if (photoInput) photoInput.value = "";

            if (typeof closeProfileModal === "function") {
                closeProfileModal();
            } else {
                const modal = smGet("profileModal");
                if (modal) modal.style.display = "none";
            }

            alert("Profile updated successfully.");

        } catch (error) {
            smError("Profile update failed.", error);
        }
    };

})();
</script>
